/* Layout: one phone-first column (max 640px). Floating pill nav + round cyan plus on the main tabs; inside a quote a floating price bar replaces the nav. Popups sit centred, never as bottom sheets. Same tokens as the work board. */
:root{
  --bg:#F8F7F4;--card:#FFFFFF;--sub:#F2F1EC;--ink:#00203F;--ink2:#4D5E73;--ink3:#8592A3;
  --line:rgb(0 32 63 / .11);--sh:0 4px 14px rgb(0 32 63 / .06);--trk:#E6E9EC;
  --blue:#06B3E5;--navy:#00203F;--fuchsia:#FA1664;--graphite:#2F2F2F;
  --on:#00203F;--onfg:#FFFFFF;--onic:#06B3E5;--bb:#00203F;--bt:#FFFFFF;
  --sun1:#D9F3FC;--sun2:#BEE9F8;--pp:#FFFFFF;--ln:#E6E9EC;
  --pop:#FFFFFF;--navsh:0 12px 30px rgb(0 32 63 / .14);
  --c-draft-bg:rgb(0 32 63 / .06);--c-draft:#4D5E73;
  --c-hold-bg:rgb(0 32 63 / .09);--c-hold:#00203F;
  --c-sent-bg:rgb(6 179 229 / .14);--c-sent:#0480AB;
  --c-won-bg:rgb(46 158 98 / .14);--c-won:#1E7A3F;
  --c-lost-bg:rgb(250 22 100 / .12);--c-lost:#D80F55;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Heebo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#03080F;--card:#131C27;--sub:#0F1823;--ink:#F2F5F8;--ink2:#A2ABB6;--ink3:#6F7A87;
  --line:rgb(255 255 255 / .1);--sh:none;--trk:rgb(255 255 255 / .1);
  --on:#06B3E5;--onfg:#00203F;--onic:#00203F;--bb:#06B3E5;--bt:#00203F;
  --sun1:#0D3D62;--sun2:#0A2E4B;--pp:#174566;--ln:rgb(255 255 255 / .16);
  --pop:#18222F;--navsh:0 12px 30px rgb(0 0 0 / .5);
  --c-draft-bg:rgb(255 255 255 / .08);--c-draft:#A2ABB6;--c-hold-bg:rgb(255 255 255 / .1);--c-hold:#C9D3DE;
  --c-sent:#5FD3F5;--c-won:#6FDB9C;--c-lost:#FF6A9C;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#03080F;--card:#131C27;--sub:#0F1823;--ink:#F2F5F8;--ink2:#A2ABB6;--ink3:#6F7A87;
  --line:rgb(255 255 255 / .1);--sh:none;--trk:rgb(255 255 255 / .1);
  --on:#06B3E5;--onfg:#00203F;--onic:#00203F;--bb:#06B3E5;--bt:#00203F;
  --sun1:#0D3D62;--sun2:#0A2E4B;--pp:#174566;--ln:rgb(255 255 255 / .16);
  --pop:#18222F;--navsh:0 12px 30px rgb(0 0 0 / .5);
  --c-draft-bg:rgb(255 255 255 / .08);--c-draft:#A2ABB6;--c-hold-bg:rgb(255 255 255 / .1);--c-hold:#C9D3DE;
  --c-sent:#5FD3F5;--c-won:#6FDB9C;--c-lost:#FF6A9C;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--f);font-size:15px;line-height:1.45;direction:rtl;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
main{max-width:640px;margin:0 auto;padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
main.v-in{animation:vin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
.empty{padding:28px 18px;color:var(--ink2);text-align:center;background:var(--card);border-radius:18px;box-shadow:var(--sh)}
.wash{position:fixed;top:0;right:0;left:0;height:420px;pointer-events:none;z-index:-1;background:radial-gradient(70% 60% at 85% 8%,rgb(6 179 229 / .18),transparent 70%),radial-gradient(50% 45% at 8% 38%,rgb(250 22 100 / .08),transparent 70%)}
/* top */
.hbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.hbar .logo{height:28px;justify-self:center;display:block}
.rbtn{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh);color:var(--ink)}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:999px;background:var(--card);color:var(--ink3);box-shadow:var(--sh)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.search svg.i{width:19px;height:19px}
.ttl1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 2px 0}
/* numbers */
.cells{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0}
.cell+.cell::before{content:"";position:absolute;right:0;top:6px;bottom:6px;width:1px;background:var(--line)}
.cell b{font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.02em;transition:color .2s}
.cell span{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.cell.on b{color:var(--blue)}
.dot{display:none}
/* hero + cards */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:16px 18px;background:linear-gradient(135deg,var(--sun1),var(--sun2));display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px}
.hero .l{font-size:13px;color:var(--ink2)}.hero .v{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}.hero .s{font-size:12.5px;color:var(--ink2)}
.hero .l,.hero .v,.hero .s{justify-self:start}.hero .art{grid-column:2;grid-row:1/4;width:118px;margin:-6px -6px -14px 0;align-self:end}
.art .pp{fill:var(--pp)}.art .ln{fill:var(--ln)}.art .bb{fill:var(--bb)}.art .bt{stroke:var(--bt)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:14px 16px}
.mini{display:flex;align-items:center;gap:12px}.mini .tx{flex:1;min-width:0}.mini .tx span{display:block;font-size:12.5px;color:var(--ink2)}.mini .tx b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.spark{display:flex;align-items:flex-end;gap:4px;height:40px;width:96px}.spark i{flex:1;border-radius:3px;background:var(--blue);opacity:.35;min-height:3px}.spark i.on{opacity:1;background:var(--fuchsia)}
.sx{display:flex;align-items:baseline;gap:8px;padding:0 4px;margin-top:4px}.sx b{font-size:15.5px;font-weight:700;flex:none}.sx b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--fuchsia);margin-inline-end:8px;vertical-align:2px}.sx span{font-size:12px;color:var(--ink2)}
.sx .tot{margin-inline-start:auto;font-size:15px;font-weight:700;color:var(--ink)}
.sx.g b::before{background:#A3ABB8}
/* quote card */
.qc{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px 14px;display:flex;flex-direction:column;gap:6px;width:100%;text-align:right;cursor:pointer}
.qc .top{display:flex;align-items:baseline;gap:8px}.qc .t{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qc .p{font-size:15px;font-weight:700;display:inline-flex;align-items:baseline;gap:6px}
.was{text-decoration:line-through;color:var(--ink3);font-size:12.5px;font-weight:500}
.qc .bot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.qc .bot .age{color:var(--ink3)}.qc .bot .k{margin-inline-start:auto;white-space:nowrap}
.qc .bot{flex-wrap:nowrap;min-width:0}.qc .bot>*{flex-shrink:0}.qc .bot .age{flex-shrink:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qc .bot .k{font-size:12px;color:var(--ink3);padding-inline-start:4px}
.chip{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.c-draft{background:var(--c-draft-bg);color:var(--c-draft)}.c-hold{background:var(--c-hold-bg);color:var(--c-hold)}
.c-sent{background:var(--c-sent-bg);color:var(--c-sent)}.c-won{background:var(--c-won-bg);color:var(--c-won)}.c-lost{background:var(--c-lost-bg);color:var(--c-lost)}
.vtag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;font-size:11.5px;font-weight:700;background:var(--c-sent-bg);color:var(--c-sent)}
.vtag svg.i{width:13px;height:13px}
.lostlink{align-self:center;font-size:13px;font-weight:600;color:var(--ink2);padding:8px 14px}
/* nav */
.nav{position:fixed;z-index:20;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:calc(14px + env(safe-area-inset-right,0px));left:calc(88px + env(safe-area-inset-left,0px));max-width:560px;margin-inline-start:auto;height:64px;padding:5px;border-radius:999px;background:var(--card);display:flex;gap:2px;box-shadow:var(--navsh)}
body.nofab .nav{left:calc(14px + env(safe-area-inset-left,0px))}
.nav button{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:999px;font-size:11px;font-weight:500;color:var(--ink3);transition:color .25s,transform .2s}
.nav button svg.i{width:22px;height:22px}
.nav button.on{color:var(--onfg);font-weight:600}.nav button.on svg.i{color:var(--onic)}
.nav .pill{position:absolute;z-index:0;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--on);box-shadow:0 6px 16px rgb(0 32 63 / .25);transition:transform .42s cubic-bezier(.25,1,.5,1),width .42s cubic-bezier(.25,1,.5,1)}
.fab{position:fixed;z-index:20;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:calc(14px + env(safe-area-inset-left,0px));width:64px;height:64px;border-radius:50%;background:var(--blue);color:var(--navy);display:grid;place-items:center;box-shadow:var(--navsh);transition:transform .2s}
.fab svg.i{width:24px;height:24px;stroke-width:2.2}
body.nofab .fab,body.innav .nav,body.innav .fab{display:none}
/* quote screen */
.dbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}.dbar .ttl{text-align:center;font-size:16px;font-weight:700}
.dbar .saved{display:block;text-align:center;font-size:11.5px;color:var(--ink3);font-weight:500}
.qh{display:flex;flex-direction:column;gap:6px;padding:0 2px}.qh .cl{font-size:13px;color:var(--ink2)}.qh .nm{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.qh .tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qh .tags button.chip{cursor:pointer}
.qh .tags button.chip::after{content:"";width:6px;height:6px;border-inline-end:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin:-3px 2px 0 0;opacity:.7}
.ban{border-radius:16px;background:var(--c-lost-bg);color:var(--c-lost);padding:10px 12px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center}
.ban svg.i{width:18px;height:18px}.ban span{flex:1}
.ban .bsm{height:34px;padding:0 14px;border-radius:999px;background:var(--bb);color:var(--bt);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.ban .bsm svg.i{width:16px;height:16px}
.seg{display:flex;background:var(--trk);border-radius:999px;padding:3px}
.seg button{flex:1;text-align:center;padding:8px 0;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink2);transition:background .25s,color .25s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
:root[data-theme="dark"] .seg button.on{background:#1E2A38}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{background:#1E2A38}}
/* meta card */
.meta{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meta .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:12px;color:var(--ink2);font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--sub);border-radius:12px;padding:9px 12px;color:var(--ink);outline:none}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--blue)}
.fld textarea{resize:vertical;line-height:1.55;min-height:90px}
.fld input[type=date]{-webkit-appearance:none;appearance:none;min-height:42px;text-align:right}
/* lines */
.lc{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.ln{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.ln+.ln{border-top:.5px solid var(--line)}
.ln.zero{opacity:.6}.ln.zero:focus-within{opacity:1}
.ln .r1,.ln .r2{display:flex;align-items:center;gap:8px}
.ln input.n{flex:1;min-width:0;border:1px solid transparent;background:none;border-radius:8px;padding:3px 6px;font-weight:600;font-size:16px;outline:none}
.ln input.n:focus,.ln input.v:focus,.ln input.nt:focus{border-color:var(--blue);background:var(--sub)}
.ln input.v{width:84px;border:1px solid var(--line);background:var(--sub);border-radius:9px;padding:4px 8px;text-align:center;direction:ltr;font-variant-numeric:tabular-nums;outline:none}
.ln input.v.q{width:52px}
.ln .x{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.ln .sum{margin-inline-start:auto;font-weight:700;font-size:15px}
.ln input.nt{width:100%;border:1px dashed var(--line);background:none;border-radius:8px;padding:5px 8px;font-size:14px;color:var(--ink2);outline:none}
.ln .cwt{font-size:12px;color:var(--ink3);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{flex:none;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center}
.who.k{background:var(--c-sent-bg);color:var(--c-sent)}.who.s{background:var(--c-draft-bg);color:var(--c-draft)}
.del{width:28px;height:28px;border-radius:50%;color:var(--ink3);font-size:18px;line-height:1;display:grid;place-items:center;flex:none}
.drag{width:18px;color:var(--ink3);cursor:grab;touch-action:none;font-size:14px;letter-spacing:-3px;opacity:.6;flex:none;user-select:none;-webkit-user-select:none}
.ln.dragging{background:var(--sub);box-shadow:0 4px 14px rgb(0 0 0 / .12);position:relative;z-index:2}
.cwb{width:28px;height:28px;border-radius:8px;color:var(--ink3);display:grid;place-items:center;flex:none;opacity:.6}.cwb.has{opacity:1;color:var(--c-sent)}
.cwb svg.i{width:16px;height:16px}
.ln .r2 input.v,.ln .r2 .msel{height:38px;box-sizing:border-box}
.ln.tpl{gap:6px;padding:9px 12px}
.tg3{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;padding-inline-start:24px}
.tg3 .full{grid-column:1/-1}
.tg3 .lab{display:flex;flex-direction:column;gap:2px;min-width:0}
.tg3 .lab>span:first-child{font-size:11px;color:var(--ink3);font-weight:600}
.tg3 .bx{display:flex;align-items:center;gap:4px;height:36px;border:1px solid var(--line);background:var(--sub);border-radius:9px;padding:0 10px}
.tg3 .bx .u{color:var(--ink3);font-size:13px}
.tg3 .bx input.v{flex:1;width:auto;min-width:0;height:auto;border:0;background:none;padding:0;text-align:left}
.tg3 .bx:focus-within{border-color:var(--blue)}
.tg3 .msel{height:36px;width:100%;padding:0 8px}
.tg3 input.nt{height:36px;border:1px solid var(--line);background:var(--sub);border-radius:9px;padding:0 10px;font-size:14px;color:var(--ink);border-style:solid}
.tg3 input.nt::placeholder{color:var(--ink3)}
.msel{border:1px solid var(--line);background:var(--sub);border-radius:9px;padding:4px 6px;font-size:15px;outline:none}
.addl{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;font-size:13.5px;font-weight:600;color:var(--c-sent);border-top:.5px solid var(--line);width:100%}
.addl svg.i{width:16px;height:16px}
.picker{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 12px;border-top:.5px dashed var(--line);background:var(--sub)}
.picker .ph{width:100%;font-size:12px;color:var(--ink2);font-weight:600}
.pchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;display:inline-flex;gap:6px;align-items:baseline}
.pchip small{color:var(--ink3);font-variant-numeric:tabular-nums}.pchip.blank{border-style:dashed;color:var(--c-sent);font-weight:700}
/* summary */
.sumc{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.sr{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}.sr b{color:var(--ink);font-weight:600}
.sr.t{border-top:.5px solid var(--line);padding-top:9px}.sr.t b,.sr.t>span{color:var(--ink);font-weight:700}
.pin{width:44px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--sub);text-align:center;font-weight:700;outline:none;margin-inline-start:12px;margin-inline-end:4px}
.range{width:100%;direction:ltr;accent-color:var(--blue);margin:0}
.ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);direction:ltr;margin-top:-4px}
.pricebx{border-radius:16px;background:linear-gradient(135deg,var(--sun1),var(--sun2));padding:12px 14px;display:flex;align-items:center;gap:10px}
.pricebx .l{font-size:12.5px;color:var(--ink2);display:block}.pricebx .v{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.15;display:block}
.pricebx .tx{flex:1;min-width:0;text-align:left}.pricebx .h{font-size:11.5px;color:var(--ink2);display:block}.pricebx .h button{color:var(--ink);text-decoration:underline;font-weight:600}
.pricebx input{width:150px;font-size:24px;font-weight:800;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 10px;direction:ltr;text-align:left;outline:none}
.pen{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}.pen svg.i{width:18px;height:18px}
.dsc b{color:var(--c-lost)!important}
.keep{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.keep span{font-size:14px;font-weight:600}.keep b{font-size:22px;font-weight:800;color:var(--c-won)}
.keep.neg b{color:var(--c-lost)}
.keep small{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px;font-weight:400}
/* floating price bar */
.sbar{position:fixed;z-index:20;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:calc(14px + env(safe-area-inset-right,0px));left:calc(14px + env(safe-area-inset-left,0px));max-width:612px;margin-inline:auto;height:64px;border-radius:999px;background:var(--card);box-shadow:var(--navsh);display:flex;align-items:center;gap:10px;padding:0 24px 0 6px}.sbar:has(.go2){padding:0 6px}
.sbar .p{flex:1;min-width:0;line-height:1.2;text-align:right}.sbar .p span{display:block}.sbar .p b{font-size:18px;font-weight:800;display:block}.sbar .p span{font-size:11.5px;color:var(--ink2)}
.sbar .go{height:52px;padding:0 20px;border-radius:999px;background:var(--bb);color:var(--bt);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;flex:none}
.sbar .go2{height:52px;width:52px;border-radius:50%;background:var(--trk);display:grid;place-items:center;flex:none}
/* client tab list */
.mc{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mc .r{display:flex;align-items:center;gap:10px}.mc .r b{flex:1;font-size:15px}
.mc a{color:var(--c-sent);font-weight:600;text-decoration:none}
.mdot{width:30px;height:30px;border-radius:9px;background:#2E9E62;color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.pl{height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;background:var(--trk);color:var(--ink2);white-space:nowrap}
.pl.ok{background:var(--c-won-bg);color:var(--c-won)}.pl.sbx{background:rgb(183 121 31 / .15);color:#a86c12}
.lst{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:right}.li+.li{border-top:.5px solid var(--line)}
.li .ic{width:34px;height:34px;border-radius:10px;background:var(--c-sent-bg);color:var(--c-sent);display:grid;place-items:center;flex:none}.li .ic svg.i{width:18px;height:18px}
.li .m{flex:1;min-width:0}.li .m b{display:block;font-size:15px;font-weight:600}.li .m span{display:block;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{font-weight:700}.li .ch{color:var(--ink3)}
/* popups */
.scrim{position:fixed;inset:0;z-index:40;background:rgb(10 20 35 / .32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fade .22s ease}
.pop{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(100vw - 28px),440px);max-height:calc(100dvh - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;overscroll-behavior:contain;background:var(--pop);border-radius:26px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px rgb(0 0 0 / .25);animation:popin .32s cubic-bezier(.25,1,.5,1)}
.pop.wide{width:min(calc(100vw - 20px),560px)}
@keyframes popin{from{opacity:0;transform:translate(-50%,-50%) scale(.92)}}
@keyframes fade{from{opacity:0}}
.pop h3{margin:0;font-size:18px;font-weight:800;text-align:center}.pop .sub{margin:-6px 0 0;font-size:12.5px;color:var(--ink2);text-align:center}
.pop .note{font-size:12px;color:var(--ink2);text-align:center;margin:0}
.pop .msg{font-size:13px;color:var(--ink2);min-height:0}.pop .msg.err{color:var(--c-lost);font-weight:600}
.stp{border-radius:16px;background:var(--sub);padding:12px;display:flex;flex-direction:column;gap:8px}
.stp .hd{display:flex;align-items:center;gap:10px}.stp .hd .no{width:24px;height:24px;border-radius:50%;background:var(--blue);color:var(--navy);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
.stp .hd b{flex:1;font-size:14.5px}.stp.off{opacity:.45;pointer-events:none}.stp.off .no{background:var(--trk);color:var(--ink2)}
.stp.done .no{background:#2E9E62;color:#fff}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2)}.kv b{color:var(--ink)}
.kv.t{border-top:.5px solid var(--line);padding-top:7px}.kv.t b,.kv.t span{color:var(--ink);font-weight:800;font-size:14px}
.kv.ds b{color:var(--c-lost)}
.ok2{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--c-won)}.ok2 svg.i{width:14px;height:14px}
.inp{width:100%;min-width:0;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:0 12px;color:var(--ink);outline:none}
.inp:focus{border-color:var(--blue)}
textarea.inp{height:auto;padding:9px 12px;line-height:1.5;resize:vertical}
.btns{display:flex;gap:8px}.btns>*{flex:1}
.bp{height:46px;border-radius:999px;background:var(--bb);color:var(--bt);font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.bp:disabled,.bs:disabled{opacity:.55;cursor:default}
.bs{height:46px;border-radius:999px;background:var(--trk);font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.bs.red{background:var(--c-lost-bg);color:var(--c-lost)}
.lnk{color:var(--c-sent);font-weight:600;font-size:13px;align-self:center;padding:4px}
.addd{align-self:flex-start;height:30px;padding:0 12px;border-radius:999px;background:var(--c-sent-bg);color:var(--c-sent);font-size:12.5px;font-weight:700}
.drow{display:flex;gap:8px;align-items:center}.drow .inp{flex:1;height:36px}
.ut{display:flex;background:var(--trk);border-radius:999px;padding:2px;flex:none}.ut button{width:34px;height:30px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink2)}.ut button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.xb{width:30px;height:30px;border-radius:50%;background:var(--trk);display:grid;place-items:center;color:var(--ink2);font-size:15px;flex:none}
.tg{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--sub)}
.tg .m{flex:1}.tg .m b{display:block;font-size:14px}.tg .m span{font-size:12px;color:var(--ink2)}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--trk);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .3);transition:right .2s}
.sw:checked{background:#34C759}.sw:checked::after{right:21px}
.wc{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--sub);border:1.5px solid transparent;text-align:right;width:100%}
.wc.on{border-color:var(--blue)}

/* ---------- theme (manual toggle on the main page; follows the phone otherwise) ---------- */
const eff=()=>document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");

/* ---------- calculations ---------- */
function lineAmt(l){const r=n(l.rate);if(l.mode==="fixed")return r;if(l.mode==="day")return r*(l.qty!==""&&l.qty!=null?n(l.qty):1);return r*n(l.qty)}
function discAmt(q,base){const d=q.disc;if(!d||!n(d.v))return 0;return d.t==="pct"?Math.round(base*n(d.v)/100):n(d.v)}
function calc(q){
  const t={sec:{prod:0,crew:0,post:0},direct:0,ext:0,ins:0};
  (q.lines||[]).forEach(l=>{const a=lineAmt(l);t.sec[l.sec]=(t.sec[l.sec]||0)+a;t.direct+=a;if(l.inhouse)t.ins+=a;else t.ext+=a});
  t.cont=t.direct*n(q.cont)/100;t.cost=t.direct+t.cont;
  t.auto=Math.ceil(t.cost*(1+n(q.profit)/100)/100)*100;
  t.base=q.priceOverride!=null&&q.priceOverride!==""?n(q.priceOverride):t.auto;
  t.disc=discAmt(q,t.base);t.price=t.base-t.disc;
  t.profitAmt=t.price-t.cost;t.profitPct=t.cost?t.profitAmt/t.cost*100:0;
  t.keep=t.price-t.ext;t.vat=t.price*n(q.vat??18)/100;t.gross=t.price+t.vat;
  return t}
const verOf=q=>n(q.ver)||1;
const firstPrice=q=>q.hist&&q.hist.length?n(q.hist[0].price):null;
const stOf=s=>STATUS.find(z=>z[0]===s)||STATUS[0];
const baseName=nm=>String(nm||"").replace(/\s+\d+$/,"").trim();
function clientOf(l){if(l.client!=null&&l.client!=="")return {t:l.client,g:l.grp||""};
  const tl=(S.tpl?.lines||[]).find(x=>x.sec===l.sec&&(x.name===l.name||x.name===baseName(l.name)));
  if(tl&&tl.client!=null&&tl.client!=="")return {t:tl.client,g:tl.grp||""};return {t:baseName(l.name),g:""}}
const andJoin=(a,b)=>{const w1=a.split(" ")[0],w2=b.split(" ")[0];return a+" ו"+(w1===w2&&b.includes(" ")?b.slice(w2.length+1):b)};
function autoDesc(q){
  const out=["ההצעה כוללת:"];const H={prod:"קדם הפקה",crew:"צילום",post:"פוסט פרודקשן"};
  for(const [sec] of SECS){const ls=(q.lines||[]).filter(l=>l.sec===sec&&lineAmt(l)>0);if(!ls.length)continue;
    const items=[];const groups={};
    ls.forEach(l=>{const c=clientOf(l);if(!c.t||c.t==="-"||c.t==="—")return;
      if(c.g){if(!groups[c.g]){groups[c.g]=[];items.push({g:c.g})}if(!groups[c.g].includes(c.t))groups[c.g].push(c.t)}
      else if(!items.some(x=>x.t===c.t))items.push({t:c.t})});
    if(!items.length)continue;
    let h=H[sec];if(sec==="crew"){const dd=Math.max(1,...ls.filter(l=>l.mode==="day").map(l=>l.qty!==""&&l.qty!=null?n(l.qty):1));h+=` – ${dd>1?dd+" ימי צילום":"יום צילום"}`}
    out.push("",h);
    items.forEach(x=>{if(x.t){out.push("• "+x.t);return}const a=groups[x.g];
      out.push("• "+(x.g==="and"&&a.length===2?andJoin(a[0],a[1]):a.join(", ")))})}
  return out.length>1?out.join("\n"):""}
const ageTxt=s=>{const d=new Date(s);if(isNaN(d))return "";const t=new Date(),y=new Date();y.setDate(t.getDate()-1);const same=(a,b)=>a.toDateString()===b.toDateString();if(same(d,t))return "היום";if(same(d,y))return "אתמול";return d.getDate()+"/"+(d.getMonth()+1)+(d.getFullYear()!==t.getFullYear()?"/"+String(d.getFullYear()).slice(2):"")};
const whenOf=q=>q.statusAt||q.sentAt||q.updatedAt||q.createdAt||q.date;

function setSaved(t){const el=$("#saved");if(el)el.textContent=t}
const clean=o=>{const c=JSON.parse(JSON.stringify(o));delete c.id;return c};
S.dirty={};
function saveQuote(q){q.updatedAt=new Date().toISOString();S.quotes[q.id]=q;S.dirty[q.id]=Date.now();persist("quotes/"+q.id,clean(q),q.id)}
function saveTpl(){S.dirty.tpl=Date.now();persist("settings/template",clean(S.tpl),"tpl")}
const isDirty=k=>S.dirty[k]&&Date.now()-S.dirty[k]<5000;
const editing=()=>{const a=document.activeElement;return !!(a&&(a.closest("#view")||a.closest("#layer"))&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))};
function setStatus(q,s){q.status=s;q.statusAt=new Date().toISOString();if(s==="won")q.wonAt=q.statusAt;if(s==="sent"&&!q.sentAt)q.sentAt=q.statusAt}

/* ---------- versions ---------- */
function snapOf(q){return {lines:JSON.parse(JSON.stringify(q.lines||[])),profit:q.profit,cont:q.cont,priceOverride:q.priceOverride??null,disc:q.disc||null}}
function archive(q,note){const t=calc(q);q.hist=q.hist||[];
  q.hist.push({n:verOf(q),price:t.price,status:q.status||"draft",at:new Date().toISOString(),note:q.verNote||(verOf(q)===1?"ההצעה המקורית":""),morning:q.morning||null,snap:snapOf(q)});

const howTxt=s=>s==="sent"||s==="won"?"נשלחה":s==="hold"?"בעל־פה · עוד לא נשלחה":s==="lost"?"נדחתה":"טיוטה";

function render(){

  if(S.loadErr){v.innerHTML=`<div class="empty">לא הצלחתי לטעון את ההצעות.<br>בדקו את החיבור ופתחו את הדף מחדש.</div>`;document.body.classList.add("innav");return}

  if(S.view==="quote"&&!S.quotes[S.cur])S.view="list";
  const key=S.view+(S.view==="quote"?S.cur+S.ctab:"");
  v.innerHTML=(PREVIEW?`<span class="prev">תצוגת ניסיון · עותק של הנתונים</span>`:"")+(S.view==="quote"?vQuote(S.quotes[S.cur]):S.view==="rates"?vRates():S.view==="settings"?vSettings():vList());

  requestAnimationFrame(setPill);
}

/* ---------- list (dashboard) ---------- */
function monthKey(s){const d=new Date(s);return isNaN(d)?"":d.getFullYear()+"-"+d.getMonth()}

  const all=Object.values(S.quotes).filter(q=>!kHide.has(q.id));
  const by=s=>all.filter(q=>(q.status||"draft")===s);
  const draft=by("draft"),hold=by("hold"),sent=by("sent"),won=by("won"),lost=by("lost");
  const sum=(a,f)=>a.reduce((s,q)=>s+f(calc(q)),0);
  const waiting=sent.concat(hold);
  const now=new Date();const ms=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push(d.getFullYear()+"-"+d.getMonth())}

  const mName=now.toLocaleDateString("he-IL",{month:"long"});
  const C=[["draft",draft.length,"טיוטות","#A3ABB8"],["hold",hold.length,"בעל־פה","#00203F"],["sent",sent.length,"נשלחו","#06B3E5"],["won",won.length,"אושרו","#2E9E62"]];
  return `<div class="hbar"><span></span><img class="logo" src="${LOGO}" alt="Keenest"><button class="rbtn" id="themeBtn" aria-label="בהיר / כהה">${eff()==="dark"?I.sun:I.moon}</button></div>

  <div class="cells">${C.map(c=>`<button class="cell${S.filter===c[0]?" on":""}" data-filter="${c[0]}"><b class="num">${c[1]}</b><span><i class="dot" style="background:${c[3]}"></i>${c[2]}</span></button>`).join("")}</div>
  <div class="hero"><span class="l">מחכה לתשובה</span><span class="v num">${ils(sum(waiting,t=>t.price))}</span><span class="s">${waiting.length===1?"הצעה אחת":waiting.length+" הצעות"} · נשאר אצלנו ${ils(sum(waiting,t=>t.keep))}</span>${ART}</div>
  <div class="card mini"><div class="tx"><span>אושר ב${esc(mName)}</span><b class="num">${ils(sum(thisM,t=>t.price))}</b><span>${thisM.length===1?"הצעה אחת":thisM.length+" הצעות"} · נשאר אצלנו ${ils(sum(thisM,t=>t.keep))}</span></div><div class="spark" aria-label="אושר בחצי השנה האחרונה">${mv.map((x,i)=>`<i class="${i===5?"on":""}" style="height:${Math.round(x/mx*100)}%"></i>`).join("")}</div></div>
  <div id="qlist">${listBody()}</div>`}
const hcmp=(a,b)=>String(a||"").localeCompare(String(b||""),"he");const QST=["draft","hold","sent","won","lost"];
const QSORTS={date:["תאריך",(a,b)=>String(whenOf(b)||"").localeCompare(String(whenOf(a)||""))],client:["לקוח",(a,b)=>hcmp(a.client,b.client)||hcmp(a.project,b.project)],amount:["סכום",(a,b)=>calc(b).price-calc(a).price],status:["סטטוס",(a,b)=>QST.indexOf(a.status||"draft")-QST.indexOf(b.status||"draft")||String(whenOf(b)||"").localeCompare(String(whenOf(a)||""))]};

function qcard(q){const t=calc(q);const st=stOf(q.status);const f=firstPrice(q);const v=verOf(q);

function qHead(q){const st=stOf(q.status);const v=verOf(q);

  else if(v>1&&(q.status||"draft")==="draft")ban=`<div class="ban">${I.cp}<span>גרסה ${v} · טיוטה – עוד לא נשלחה. גרסה ${v-1} נשמרה.</span></div>`;
  return `<div class="dbar b2"><button class="rbtn" id="back" aria-label="חזרה להצעות">${I.back}</button><div><span class="ttl" style="display:block">הצעת מחיר${q.morning&&q.morning.number?` <span class="num" style="color:var(--ink3);font-weight:500">#${esc(q.morning.number)}</span>`:""}</span><span class="saved" id="saved"></span></div><div class="hb"><button class="rbtn" id="moreBtn" aria-label="עוד">${I.more}</button></div></div>

function vQuote(q){return qHead(q)+(S.ctab==="client"?vClient(q):vCalc(q))}
const sumTxt=a=>ils(a);
function lineRow(l,isTpl){

function secCard(sec,label,obj,isTpl){
  const lines=(obj.lines||[]).filter(l=>l.sec===sec);const t=isTpl?null:calc(obj);
  return `<div class="sx"><b>${label}</b>${isTpl?`<span>${lines.length===1?"סעיף אחד":lines.length+" סעיפים"}</span>`:`<span class="tot num" data-sectot="${sec}">${ils(t.sec[sec])}</span>`}</div>
  <div class="lc" data-sec="${sec}">${lines.map(l=>lineRow(l,isTpl)).join("")}
    ${isTpl?`<button class="addl" data-add="${sec}" data-mode="${sec==="crew"?"day":sec==="post"?"shift":"fixed"}">${I.plus}סעיף חדש</button>`
      :`<button class="addl" data-pick="${sec}">${I.plus}${S.pick[sec]?"סגירה":"הוספה מהמחירון"}</button>${S.pick[sec]?picker(sec,obj):""}`}</div>`}
function picker(sec,q){
  const T=(S.tpl?.lines||[]).filter(l=>l.sec===sec);const used=new Set((q.lines||[]).map(l=>l.name));
  const fresh=T.filter(l=>!used.has(l.name)),again=T.filter(l=>used.has(l.name));
  const chip=l=>`<button class="pchip" data-addtpl="${esc(l.id)}">${esc(l.name)}${n(l.rate)?` <small>${ils(l.rate)}</small>`:""}</button>`;
  return `<div class="picker"><span class="ph">מהמחירון</span>${fresh.map(chip).join("")}
    ${again.length?`<span class="ph">להוסיף עוד אחד (כבר בהצעה)</span>${again.map(chip).join("")}`:""}
    <span class="ph"></span>${sec==="post"?`<button class="pchip blank" data-add="${sec}" data-mode="shift">+ משמרות אחרות</button>`:""}<button class="pchip blank" data-add="${sec}" data-mode="${sec==="crew"?"day":"fixed"}">+ שורה ריקה</button></div>`}
const priceHint=(q,t)=>q.priceOverride!=null&&q.priceOverride!==""?`<span class="h">מחיר שהוקלד ידנית · רווח בפועל ${t.profitPct.toFixed(1)}%</span><span class="h"><button id="resetPrice">חזרה לחישוב (${ils(t.auto)})</button></span>`:`<span class="h">מעוגל ל-100 ₪ · לפני מע״מ</span><span class="h">כולל מע״מ <b class="num">${ils(t.base*(1+n(q.vat??18)/100))}</b></span>`;
const keepBr=t=>[`עבודה שלנו ${ils(t.ins)}`,`רווח ${ils(t.profitAmt)}`,`בלתי צפוי ${ils(t.cont)}`].map(s=>s.replace(/ /g,"\u00a0")).join(" · ");
function vCalc(q){const t=calc(q);
  const meta=`<div class="meta"><div class="fld full"><label for="q_client">לקוח</label><input id="q_client" data-q="client" value="${esc(q.client)}" placeholder="שם הלקוח"></div>

    ${t.disc?`<div class="sr dsc"><span>הנחה <button class="lnk" id="rmDisc" style="font-size:12px">הסרה</button></span><b class="num">−${ils(t.disc)}</b></div><div class="sr t"><span>אחרי הנחה</span><b class="num">${ils(t.price)}</b></div>`:""}
    <div class="sr"><span>משולם לספקים</span><b class="num" id="o_ext">${ils(t.ext)}</b></div>
    <div class="keep${t.keep<0?" neg":""}" id="o_keepbox"><div><span>נשאר אצלנו</span><small id="o_br">${keepBr(t)}</small></div><b class="num" id="o_keep">${ils(t.keep)}</b></div></div>`;
  return meta+SECS.map(([k,l])=>secCard(k,l,q,false)).join("")+sum}
function sbar(q){const t=calc(q);
  if(S.ctab==="client")return `<div class="sbar"><div class="p"><b class="num">${ils(t.price)}</b><span>כולל מע״מ ${ils(t.gross)}</span></div><button class="go" id="sendQ">${I.send}שליחה ללקוח</button></div>`;
  return `<div class="sbar"><div class="p"><b class="num" id="sb_price">${ils(t.price)}</b><span id="sb_keep">נשאר אצלנו ${ils(t.keep)}</span></div><button class="go" id="sendQ">${I.send}שליחה ללקוח</button></div>`}
function vClient(q){const m=q.morning;
  const mc=m?`<div class="mc"><div class="r"><span class="mdot" aria-hidden="true">m</span><b>מורנינג</b>${m.environment==="sandbox"?`<span class="pl sbx">סביבת בדיקות</span>`:""}<span class="pl ok">✓ מס׳ ${esc(m.number)}</span></div><div class="r" style="font-size:12.5px;color:var(--ink2)"><span style="flex:1">הופקה ${esc(mDT(m.issuedAt))}</span>${m.url?`<a href="${esc(m.url)}" target="_blank" rel="noopener">פתיחה במורנינג ↗</a>`:""}</div></div>`
    :`<div class="mc"><div class="r"><span class="mdot" aria-hidden="true">m</span><b>מורנינג</b><span class="pl">עוד לא הופקה</span></div></div>`;
  const desc=(q.desc||"").trim()||autoDesc(q);const first=desc.split("\n").filter(x=>x.trim()&&!/^ההצעה כוללת/.test(x)).slice(0,3).map(x=>x.replace(/^[•\-*]\s*/,"")).join(", ");
  const rows=[["eTitle",I.ttl,"כותרת",(q.title||"").trim()||q.project||"לפי שם הפרויקט"],["eDesc",I.lst,"מה ההצעה כוללת",(q.desc?"נערך ביד · ":"אוטומטי · ")+(first||"עוד אין סעיפים")],["eTerms",I.doc,"תנאים",(q.terms||"").replace(/\n/g," · ")||"אין תנאים"]];
  return mc+`<div class="lst">${rows.map(r=>`<button class="li" id="${r[0]}"><span class="ic">${r[1]}</span><span class="m"><b>${r[2]}</b><span>${esc(r[3])}</span></span><span class="ch">${I.chev}</span></button>`).join("")}</div>

function closePop(){$("#layer").innerHTML=""}
function kFit(el){if(!el||el.tagName!=="TEXTAREA")return;el.rows=2;el.style.height="auto";el.style.height=Math.max(el.scrollHeight+2,110)+"px"}
function pop(html,cls){const L=$("#layer");L.innerHTML=`<div class="scrim"></div><div class="pop ${cls||""}" role="dialog" aria-modal="true">${html}</div>`;
  L.querySelector(".scrim").onclick=()=>{if(!L.querySelector(".pop").dataset.busy)closePop()};return L.querySelector(".pop")}

function editTextPop(q,key,label,area,auto){const p=pop(`<h3>${label}</h3>
  ${area?`<textarea class="inp" id="pt" rows="12">${esc(q[key]||auto||"")}</textarea>`:`<input class="inp" id="pt" value="${esc(q[key]||"")}" placeholder="${esc(auto||"")}">`}
  ${key==="desc"?`<div class="note" id="ptHint">${q.desc?`נערך ביד · <button class="lnk" id="ptReset">חזרה לנוסח האוטומטי</button>`:"נכתב אוטומטית"}</div>`:""}
  <button class="bp" id="ptOk">סיום</button>`);
  const el=p.querySelector("#pt");kFit(el);el.addEventListener("input",()=>kFit(el));el.oninput=()=>{q[key]=el.value;saveQuote(q);if(key==="desc"){const h=p.querySelector("#ptHint");if(h)h.textContent="נערך ביד"}};
  const rs=p.querySelector("#ptReset");if(rs)rs.onclick=()=>{q.desc="";saveQuote(q);el.value=autoDesc(q);p.querySelector("#ptHint").textContent="נכתב אוטומטית"};
  p.querySelector("#ptOk").onclick=()=>{closePop();render()};setTimeout(()=>el.focus(),60)}

function fitPreview(){const box=$(".pvbox"),sc=$("#pvScale");if(!box||!sc)return;const w=box.clientWidth-16;const k=Math.min(1,w/794);sc.style.transform=`scale(${k})`;sc.style.width="794px";sc.style.height=(sc.firstElementChild.offsetHeight*k)+"px"}

function statusMenu(q,anchor){const m=menu(STATUS.map(s=>[s[0],`<span class="chip ${s[2]}" style="pointer-events:none">${s[1]}</span>`,(q.status||"draft")===s[0]?" ✓":""]));

function moreMenu(q){const m=menu([["dup",I.cp,"שכפול ההצעה"],["vers",I.hist,"כל הגרסאות"],["newv",I.tag,"גרסה חדשה / הנחה"],["del",I.tr,"מחיקת ההצעה","red"]]);

function approvePop(q){const t=calc(q);

async function buildPdf(q){
  if(!window.htmlToImage||!window.jspdf)throw new Error("lib");
  const host=$("#pdfHost");host.innerHTML=paper(q);const node=host.firstElementChild;
  await document.fonts.ready;
  const canvas=await htmlToImage.toCanvas(node,{pixelRatio:2,backgroundColor:"#ffffff",width:794,height:node.offsetHeight});
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"pt",format:"a4"});
  const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
  const pxPerPt=canvas.width/pw;const pageHpx=Math.floor(ph*pxPerPt);
  for(let y=0,i=0;y<canvas.height;y+=pageHpx,i++){const h=Math.min(pageHpx,canvas.height-y);const c=document.createElement("canvas");c.width=canvas.width;c.height=h;
    c.getContext("2d").drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,pw,h/pxPerPt)}
  host.innerHTML="";return pdf.output("blob")}

const bp2=x=>String(x).padStart(2,"0");

async function bCal(old,at,summary,desc){const m=await bMcp();if(!m)throw {code:"no_mcp"};

  const r=await m.callTool(B_GCAL,"create_event",body,{cache:false});let p=r&&r.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(_){}}
