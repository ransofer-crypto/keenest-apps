  --sent:#0480AB;--sent-bg:rgb(6 179 229 / .14);--hot:#D80F55;--hot-bg:rgb(250 22 100 / .12);

}

  --won:#6FDB9C;--won-bg:rgb(46 158 98 / .18);--gray:#A2ABB6;--gray-bg:rgb(255 255 255 / .08);

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--f);font-size:15px;line-height:1.45;direction:rtl;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wash{position:fixed;top:0;right:0;left:0;height:420px;pointer-events:none;z-index:-1;
  background:radial-gradient(70% 60% at 85% 8%,var(--wash1),transparent 70%),radial-gradient(50% 45% at 8% 38%,var(--wash2),transparent 70%)}
#view{max-width:640px;margin:0 auto;padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}

/* search pill */
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:999px;background:var(--card);color:var(--ink3);box-shadow:var(--sh)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.search svg.i{width:19px;height:19px}
.search .clr{color:var(--ink3)}

/* hero */
.lhero{border-radius:22px;padding:16px 16px 16px 14px;background:linear-gradient(135deg,var(--sun1),var(--sun2));display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:12px;align-items:center}
.lhero .tx{display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:right}
.lhero .l{font-size:12.5px;color:var(--ink2)}
.lhero .s{font-size:12.5px;color:var(--ink2);margin-top:5px}
.jt{font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.25;margin-top:3px}
.jtags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.jtags span{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--tag)}
.pgb{display:block;width:100%;height:6px;border-radius:999px;background:var(--hline);margin-top:10px;overflow:hidden}
.pgb i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.art{position:relative;height:76px}
.art .bk,.art .fr{position:absolute;inset:6px 4px;border-radius:12px}
.art .bk{background:var(--card);opacity:.55;transform:rotate(6deg)}
.art .fr{background:var(--card);box-shadow:0 8px 20px rgb(0 32 63 / .15);transform:rotate(-3deg);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 12px}
.art .ci{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#FFFFFF;display:grid;place-items:center}
.art .ci svg.i{width:15px;height:15px}
.art i{display:block;height:5px;border-radius:9px;background:var(--trk);width:80%}.art i.sh{width:52%}

/* section title + sort */
.sx{display:flex;align-items:center;gap:8px;padding:0 4px;margin-top:2px;position:relative}
.sx b{font-size:15.5px;font-weight:700}
.sx b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--fuchsia);margin-inline-end:8px;vertical-align:2px}
.sx .cnt{font-size:12.5px;color:var(--ink3)}
.sortb{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--sent);padding:4px 2px}
.sortb svg.i{width:17px;height:17px}
.srt-menu{position:absolute;z-index:30;left:0;top:30px;min-width:170px;background:var(--pop);border-radius:14px;box-shadow:0 14px 34px rgb(0 10 25 / .22);padding:6px}
.srt-menu .mt{font-size:11.5px;color:var(--ink3);padding:4px 10px 6px}
.srt-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:9px;font-size:14px;text-align:right}
.srt-menu button.on{font-weight:700}
.srt-menu button .ck{color:var(--sent)}

/* lists */
.list{background:var(--card);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;width:100%;text-align:right;cursor:pointer}
.row+.row{border-top:1px solid var(--line)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{display:block;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{display:flex;align-items:center;gap:8px;flex:none}
.row .age{font-size:11.5px;color:var(--ink3)}
.row .age.dt{font-size:12px;font-weight:600}.row .age.dt.t{color:var(--sent)}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px;flex:none}
.bars i{width:4px;border-radius:2px;background:var(--trk)}.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:12px}
.bars i.on{background:var(--fuchsia)}
.chip{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.c-sig{background:var(--sent-bg);color:var(--sent)}.c-hot{background:var(--hot-bg);color:var(--hot)}
.c-won{background:var(--won-bg);color:var(--won)}.c-gray{background:var(--gray-bg);color:var(--gray)}
.empty{padding:22px 18px;color:var(--ink2);text-align:center;background:var(--card);border-radius:18px;box-shadow:var(--sh);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* buttons */

/* tiny, safe markdown for Claude's summaries (headings, bullets, bold, links) */
function md(t){const lines=String(t||"").split(/\n/);let out="",ul=false;
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  for(const ln of lines){const m=ln.match(/^\s*[-*•]\s+(.*)/);
    if(m){if(!ul){out+="<ul>";ul=true}out+=`<li>${inl(m[1])}</li>`;continue}
    if(ul){out+="</ul>";ul=false}
    const hd=ln.match(/^#{1,4}\s+(.*)/);if(hd){out+=`<h4>${inl(hd[1])}</h4>`;continue}
    if(ln.trim())out+=`<p>${inl(ln)}</p>`}
  if(ul)out+="</ul>";return out}

async function saveLead(id,patch){const l=S.leads.find(x=>x.id===id);
  if(l&&patch.stage&&!patch.log&&patch.stage!==(l.stage||"new")&&l.stage!=="found")patch={...patch,log:[...(l.log||[]),{t:"stage",text:`${STAGES[l.stage||"new"][1]} ← ${STAGES[patch.stage][1]}`,by:S.me||null,at:now()}]};
  if(l)Object.assign(l,patch);render();
  if(!S.db){toast("אין חיבור לנתונים");return}
  try{await S.db.doc("leads/"+id).update({...patch,updatedAt:now()})}catch(e){toast(e?.code==="invalid_argument"?"אין הרשאה לשמור":"השמירה נכשלה")}}
async function newRequest(data){
  if(!S.db){toast("אין חיבור לנתונים");return null}
  const ref=S.db.collection("requests").doc();const doc={...data,status:"pending",createdAt:now(),by:S.me||null};
  try{await ref.set(doc)}catch(e){toast("לא הצלחתי לשמור את הבקשה");return null}
  S.reqs.push({id:ref.id,...doc});
  const fired=await fireSearch(ref.id);
  try{await ref.update({fired})}catch(_){}
  return ref.id}

function findJobs(x,out=[]){if(Array.isArray(x))x.forEach(y=>findJobs(y,out));else if(x&&typeof x==="object"){if(x.job_id||x.jobId)out.push(x);else Object.values(x).forEach(y=>findJobs(y,out))}return out}

  if(!js.length){const t=((r&&r.content)||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n");const re=/"?index"?\s*[:=]\s*(\d+)[\s\S]*?"?job_id"?\s*[:=]\s*"?([0-9a-f]{8}-[0-9a-f-]{27})/gi;let m;while((m=re.exec(t)))js.push({index:+m[1],job_id:m[2]})}

   <div class="fld" id="fRw" hidden><label>רזולוציה</label><div class="opts" id="fR"></div></div>
   <div class="fld" id="fQw" hidden><label>איכות</label><div class="opts" id="fQ">${["low","medium","high","xhigh","max"].map(q=>`<button data-fq="${q}">${QN[q]}</button>`).join("")}</div></div>

  const ok=()=>{const m=MODELS.find(x=>x.id===sel.m);p.querySelector("#fGo").disabled=!(m&&sel.r&&sel.a&&(!m.q||sel.q)&&p.querySelector("#fp").value.trim())};

async function startFrame(id,params){const l=S.leads.find(x=>x.id===id);if(!l)return;toast("שולח ל-Higgsfield…");

  catch(e){toast(hfErr(e));return}

const FPOLL={};
function ensureFramePoll(id){if(FPOLL[id]||!S.mcp)return;FPOLL[id]=(async()=>{try{for(let round=0;round<80;round++){

    let res;try{res=await hf("jobs_wait",{jobs:pend.map((f,i)=>({index:i,job_id:f.job})),timeout_seconds:15})}catch(e){if(e&&e.retryable){await new Promise(r=>setTimeout(r,4000));continue}throw e}
    const js=jobsFrom(res);let changed=false;const frames=(l.frames||[]).map(f=>({...f}));
    for(const f of frames){if(f.state!=="pending")continue;const j=js.find(x=>x.job_id===f.job);if(!j)continue;const st=String(j.status||"").toLowerCase();
      if(st==="completed"&&j.url){f.url=j.url;f.state="done";f.thumb=await thumbOf(j.url);changed=true}
      else if(/fail|error|cancel|nsfw|reject/.test(st)){f.state="failed";changed=true}}
    if(changed)await saveLead(id,{frames});
    await new Promise(r=>setTimeout(r,1500))}}catch(e){toast(hfErr(e))}finally{delete FPOLL[id]}})()}
async function thumbOf(url){const q=u=>"'"+String(u).replace(/'/g,"'\\''")+"'";const f="lf_"+Math.random().toString(36).slice(2,8);
  try{const r=await hf("sandbox_exec",{command:`curl -sfL -o ${f}.png ${q(url)} && convert ${f}.png -resize '640x640>' -quality 72 ${f}.jpg && rm -f ${f}.png`,image_paths:[f+".jpg"],timeout_seconds:60});
    const im=(r.content||[]).find(c=>c.type==="image"&&c.data);return im?`data:${im.mimeType||"image/jpeg"};base64,${im.data}`:""}catch(_){return ""}}

render();
(async()=>{

  db.collection("requests").onSnapshot(snap=>{S.reqs=snap.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  db.collection("meta").onSnapshot(snap=>{const d=snap.docs.find(x=>x.id==="ideas");S.ideas=d?d.data():null;if(S.view==="search")render()},()=>{});
})();

(async()=>{S.sample=await window.claude?.use?.("sample");if(S.view==="lead")render()})();

<script>
/* ===== Keenest dialog language — header with title + X, one wide primary button ===== */
(function(){
  const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const CLOSE=/^\s*(ביטול|סגירה)\s*$/;
  function polish(box,root,close){
    if(!box||box.dataset.kd)return;box.dataset.kd=1;
    if(box.querySelector(".rhd,.bhd")){root.classList.add("kd");return}           // already in the new language
    const h=[...box.children].find(c=>c.tagName==="H3");
    root.classList.add("kd");
    const bar=box.querySelector(".actions,.btns");
    const cancel=bar&&[...bar.querySelectorAll("button")].find(b=>CLOSE.test(b.textContent)&&!b.classList.contains("bp"));
    if(bar){if(bar.querySelector(".bp,.btn:not(.ghost):not(.danger)"))bar.classList.add("kd-hasp")}
    if(h){const hd=document.createElement("div");hd.className="kd-hd";const t=document.createElement("div");t.className="kd-t";
      h.replaceWith(hd);t.appendChild(h);const sub=hd.nextElementSibling;if(sub&&sub.matches("p.sub"))t.appendChild(sub);
      const x=document.createElement("button");x.type="button";x.className="kd-x";x.setAttribute("aria-label","סגירה");x.innerHTML=X;
      x.onclick=()=>cancel?cancel.click():close();hd.append(t,x);
      if(cancel){cancel.hidden=true;if(bar&&![...bar.children].some(c=>!c.hidden&&!c.matches(".spacer")))bar.hidden=true}}
  }
  const wrapFn=(name,after)=>{const f=window[name];if(typeof f!=="function"||f.__kd)return;const w=function(){const r=f.apply(this,arguments);try{after(r)}catch(_){}return r};w.__kd=1;window[name]=w};
  wrapFn("openSheet",()=>{const sc=document.querySelector("#sheetHost .scrim");if(sc)polish(sc.querySelector(".sheet"),sc,()=>window.closeSheet())});
  wrapFn("pop",p=>{const el=p&&p.nodeType?p:document.querySelector("#layer .pop");if(el)polish(el,el,()=>window.closePop())});
})();
</script>
