/* Layout: sticky header; boards list → board page with 3 steps (script / shot list / storyboard). Storyboard = grid of pencil frames drawn by Nano Banana 2.1 through the viewer's Higgsfield connector. */
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.bar .ttl{font-family:var(--f-display);font-size:22px;white-space:nowrap}
.bar img{height:30px;width:auto;display:block}
main{padding-block:18px 16px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0}
.spacer{flex:1}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--brand2);color:var(--brand2-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.blue{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
.btn.ai{border:1px solid var(--accent);color:var(--accent-text);background:var(--accent-soft)}
.link{border:0;background:none;color:var(--accent-text);font-weight:700;cursor:pointer;padding:4px 2px}
.hint{color:var(--muted);font-size:13.5px}
.empty{padding:26px;color:var(--muted);text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px}
.col{display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.lbl{font-size:13px;color:var(--muted);font-weight:600}
.fld input,.fld textarea,.fld select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.55}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--neutral-bg);color:var(--muted)}
.pill.b{background:var(--accent-soft);color:var(--accent-text)}
.pill.c{background:var(--amber-bg);color:var(--amber)}
.pill.s{background:var(--ok-bg);color:var(--ok)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{background:none;border:0;color:var(--muted);font-weight:600;cursor:pointer;padding:6px 0}
.saved{font-size:13px;color:var(--muted)}
.meta{display:grid;grid-template-columns:2fr 2fr 1fr;gap:10px}
@media (max-width:600px){.meta{grid-template-columns:1fr 1fr}.meta .fld:last-child{grid-column:1/-1}}
/* list */
.plist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.swipe{position:relative;overflow:hidden;border-top:1px solid var(--line)}.swipe:first-child{border-top:0}
.swbg{position:absolute;inset:0;background:var(--rec);display:flex;justify-content:space-between;align-items:stretch}
.swbg button{border:0;background:none;color:#fff;font-weight:700;width:96px;cursor:pointer;font-size:15px}
.swipe .prow{position:relative;background:var(--surface);touch-action:pan-y;transition:transform .2s ease;user-select:none;-webkit-user-select:none}
.swipe .prow.drag-x{transition:none}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 14px;cursor:pointer;text-align:right;border:0;width:100%}
@media (hover:hover){.prow:hover{background:var(--sunk)}}
.prow .th{width:56px;aspect-ratio:16/9;border-radius:6px;background:var(--paper);border:1px solid var(--paper-line);overflow:hidden}
.prow .th img{width:100%;height:100%;object-fit:cover;display:block}
.prow .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .s{color:var(--muted);font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* steps */
.stages{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.stages button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.stages button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.stages .num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sunk);font-size:12px;margin-inline-end:6px}
.stages button[aria-selected="true"] .num{background:var(--accent);color:var(--accent-ink)}
.stages .cnt{font-size:12px;color:var(--muted);margin-inline-start:4px;font-weight:600}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-weight:600;color:var(--muted);cursor:pointer;font-size:14px}

.anp .sub small{font-size:12.5px;font-weight:700;color:#FA1664}
.anp .sub div{font-size:17px;font-weight:500;line-height:1.4;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.anp .sc{padding:0 18px;max-width:900px;width:100%;margin:0 auto}
.anp .bars{display:flex;gap:3px}
.anp .bars button{flex-basis:0;min-width:2px;height:20px;border:0;padding:0;background:none;position:relative;cursor:pointer;color:var(--ink)}
.anp .bars button::before{content:"";position:absolute;inset:8px 0;border-radius:2px;background:var(--line)}
.anp .bars i{position:absolute;top:8px;bottom:8px;right:0;width:0;border-radius:2px;background:currentColor}
.anp .tt{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-top:2px}
.anp .ctl{display:flex;align-items:center;justify-content:center;gap:40px;padding:14px 0 22px}
.anp .ctl button{border:0;background:none;color:var(--ink);padding:8px;cursor:pointer;display:grid;place-items:center}
.anp .ctl button svg.i{width:24px;height:24px}
.anp .ctl .pp{width:60px;height:60px;border-radius:50%;background:var(--ink);padding:0}
.anp .ctl .pp i{width:16px;height:18px;border-inline:5px solid var(--bg);box-sizing:border-box}
.anp.paused .ctl .pp i{width:0;height:0;border-style:solid;border-width:10px 0 10px 16px;border-color:transparent transparent transparent var(--bg);margin-left:4px}
@media (prefers-reduced-motion:reduce){.anp,.anp .big img{transition:none}}
.sbtop{flex-wrap:nowrap}.sbtop .pill,.sbtop .pdfp,.sbtop .pillw{padding:0 12px}
.sbtop .pdfp.ico{width:36px;padding:0;justify-content:center}.sbtop .pdfp.ico span{display:none}
.sbtop .pdfp .spin.sm{display:inline-block;flex:none;width:16px;height:16px;border-width:2px}

const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));

const B=()=>S.boards[S.cur];
const imgSrc=id=>id?(S.blob[id]||"/_blob/"+id):"";

/* ---------- data ---------- */
let saveT={};
function setSaved(t){const el=$("#saved");if(el)el.textContent=t}
function saveB(b){b.updatedAt=new Date().toISOString();S.boards[b.id]=b;S.dirty[b.id]=Date.now();clearTimeout(saveT[b.id]);setSaved("שומר…");
  const id=b.id;saveT[id]=setTimeout(async()=>{const c=clone(S.boards[id]||b);delete c.id;S.dirty[id]=Date.now();
    try{await S.db.doc("boards/"+id).set(c);setSaved("נשמר")}catch(e){setSaved("השמירה נכשלה");toast("השמירה נכשלה, נסו שוב")}},500)}
const ordered=b=>{const sh=b.shots||[];if(S.order!=="loc")return sh;const locs=[];sh.forEach(s=>{const l=(s.loc||"").trim();if(!locs.includes(l))locs.push(l)});return locs.flatMap(l=>sh.filter(s=>(s.loc||"").trim()===l))};
const shotNo=(b,s)=>{const sc=String(s.scene||"").trim();if(!sc)return String((b.shots||[]).indexOf(s)+1);return `${sc}.${(b.shots||[]).filter(x=>String(x.scene||"").trim()===sc).indexOf(s)+1}`};
const totalDur=b=>(b.shots||[]).reduce((a,s)=>a+(+s.dur||0),0);
const fmtDur=t=>t>=60?`${Math.floor(t/60)}:${String(Math.round(t%60)).padStart(2,"0")} דק׳`:`${Math.round(t)} שנ׳`;
const allT=b=>(b.shots||[]).flatMap(s=>s.endf?[s,s.endf]:[s]);
const isEnd=o=>!!o&&/_e$/.test(o.id||"");
const parentOf=(b,o)=>(b.shots||[]).find(s=>s.endf===o)||(b.shots||[]).find(s=>s.id+"_e"===o.id);
const targets=b=>ordered(b).flatMap(s=>s.endf?[s,s.endf]:[s]);
const esig=s=>[s.endDesc,s.desc,s.move,s.size,s.subject].join("|");
const locOf=(b,s)=>(b.locs||[]).find(l=>(l.name||"").trim()===(s.loc||"").trim());
const techLabel=s=>[s.type&&s.type!=="one"?lab(KTYPES,s.type):"",lab(SIZES,s.size),lab(SIDES,s.side),lab(LENSES,s.lens),s.move!=="static"?lab(MOVES,s.move):""].filter(Boolean).join(" · ");
const slabH=(s,extra)=>`${s.subject?`<b class="sj">${esc(s.subject)}</b> `:""}<bdi dir="ltr">${esc(techLabel(s))}${extra?esc(extra):""}</bdi>`;
const shotLabel=s=>[s.type&&s.type!=="one"?lab(KTYPES,s.type):"",lab(SIZES,s.size),s.subject,lab(SIDES,s.side),lab(LENSES,s.lens),s.move!=="static"?lab(MOVES,s.move):""].filter(Boolean).join(" · ");

/* ---------- Claude ---------- */
let SAMPLE=null;
async function sampleFn(){if(SAMPLE===null){try{SAMPLE=await claude.use("sample")}catch(_){SAMPLE=false}}return SAMPLE||null}
const aiErr=e=>{const c=e&&e.code;return c==="not_granted"?"צריך לאשר ל-Claude לעבוד בדף (בחלון שקופץ).":c==="rate_limited"?"יותר מדי בקשות ברגע. נסו שוב עוד דקה.":c==="images_unavailable"||c==="image_rejected"?"לא הצלחתי לשלוח את התמונה. נסו JPG או PNG.":c==="invalid_json"?"Claude ענה בפורמט לא צפוי. נסו שוב.":"Claude לא הצליח לענות כרגע. נסו שוב."};
let wasHidden=false;document.addEventListener("visibilitychange",()=>{if(document.hidden)wasHidden=true});
const waitVisible=()=>new Promise(r=>{if(!document.hidden){setTimeout(r,400);return}const f=()=>{if(!document.hidden){document.removeEventListener("visibilitychange",f);setTimeout(r,600)}};document.addEventListener("visibilitychange",f)});
async function aiJSON(prompt,opts={}){const sm=await sampleFn();if(!sm)throw {code:"unavailable"};
  for(let i=0;;i++){wasHidden=document.hidden;
    try{return await sm.json(prompt,{modelTier:"default",...opts})}
    catch(e){const c=e&&e.code;if(i<3&&(wasHidden||document.hidden)&&!["not_granted","rate_limited","unavailable"].includes(c)){await waitVisible();toast("Claude ממשיך מאיפה שעצר…");continue}throw e}}}
const codes=a=>a.map(x=>`${x[0]} = ${x[2]}`).join("; ")+(a===SIZES?KTHINT:"");
const num=(v,lo,hi,d)=>{v=+v;return isFinite(v)?Math.max(lo,Math.min(hi,v)):d};
function normShot(x){const pick=(arr,v,d)=>arr.some(a=>a[0]===String(v))?String(v):d;
  const c=x.cam&&typeof x.cam==="object"?{x:num(x.cam.x,0,100,50),y:num(x.cam.y,0,140,50),tx:num(x.cam.tx,0,100,50),ty:num(x.cam.ty,0,140,40)}:null;

async function submitShots(b,list,fix){const ar=b.aspect==="9:16"?"9:16":"16:9";
  for(let k=0;k<list.length;k+=12){const chunk=list.slice(k,k+12);
    const requests=chunk.map((o,i)=>{let prompt,refs=[];
      if(fix){prompt=`Edit this storyboard frame. REQUIRED CHANGE: ${fix}\nThe change must be clearly visible in the result – do not return the same image. Keep everything else – the characters and the rough pencil storyboard style – as in the reference. No text, no arrows.`;refs=o.gen&&o.gen.prev?[{job:o.gen.prev}]:[]}
      else if(isEnd(o)){const s=parentOf(b,o);refs=s?refsForEnd(b,s):[];prompt=s?endPromptFull(b,s,refs):STYLE}
      else{refs=refsFor(b,o);prompt=shotPrompt(b,o,refs)}
      if(!fix&&o.pnote){prompt+=`\nFor this drawing specifically: ${o.pnote}`;delete o.pnote}
      o.dsig=dsigOf(b,o);
      const params={model:MODEL,prompt,aspect_ratio:ar,resolution:"1k",count:1,use_unlim:false};
      if(refs.length)params.medias=refs.map(r=>({value:r.job,role:"image_references"}));return {index:k+i,params}});
    const en=await toEnglish(requests.map(q=>q.params.prompt||""),false);requests.forEach((q,i)=>{if(en[i])q.params.prompt=en[i]});
    let r=null,js=[];const isRL=m=>/429|rate_limit|rate limit|concurren|too many|limit_reached/i.test(String(m||""));
    for(let tries=0;tries<40;tries++){let err=null;try{r=await hf("generate_image_batch",{requests,context:"Pencil storyboard frames for a video production shot list"})}catch(e){err=e}
      if(err){if(isRL(err.message)){chunk.forEach(o=>{o.gen={...(o.gen||{}),state:"queued",qt:Date.now()}});render();await sleep(15000);continue}throw err}
      const got=jobsFrom(r);js=js.concat(got.filter(j=>j.job_id));const waiting=requests.filter(q=>!js.some(j=>j.index===q.index)&&isRL((got.find(j=>j.index===q.index)||{}).error));
      got.filter(j=>!j.job_id&&!isRL(j.error)).forEach(j=>{if(!js.some(x=>x.index===j.index))js.push(j)});
      if(!waiting.length)break;
      requests.splice(0,requests.length,...waiting);render();await sleep(15000)}
    chunk.forEach((o,i)=>{const j=js.find(x=>x.index===k+i);if(j&&j.job_id)o.gen={state:"pending",job:j.job_id,at:new Date().toISOString(),prev:o.gen&&o.gen.prev};else{o.gen={state:"failed"};S.err[o.id]=(j&&j.error)||"השליחה ל-Higgsfield נכשלה"}})}
  saveB(b)}
async function drawItems(ids,fix){const b=B();if(!b)return;const bid=b.id;
  const list=ids.map(id=>allT(b).find(x=>x.id===id)).filter(s=>s&&!busyGen(s.gen));if(!list.length)return;
  list.forEach(o=>{delete S.err[o.id];o.gen={state:"queued",qt:Date.now(),prev:o.gen&&o.gen.prev}});render();
  try{
    if(!fix){try{await ensurePrompts(b,list)}catch(e){list.forEach(s=>{if(!isEnd(s)&&!s.prompt){s.prompt=s.desc;s.psig=sig(s)}})}}
    if(fix){await submitShots(b,list,fix);ensurePoll(bid);render();return}
    const starts=list.filter(x=>!isEnd(x)),ends=list.filter(isEnd);
    const first=anchorsIn(b,starts);const rest=starts.filter(x=>!first.includes(x));
    if(first.length&&rest.length){await submitShots(b,first);ensurePoll(bid);render();while(first.some(x=>busyGen(x.gen)))await sleep(1500)}
    const go=first.length&&rest.length?rest:starts;if(go.length){await submitShots(b,go);ensurePoll(bid);render()}
    if(ends.length){const ps=ends.map(e=>parentOf(b,e)).filter(Boolean);while(ps.some(p=>busyGen(p.gen)))await sleep(1500);await submitShots(b,ends);ensurePoll(bid);render()}}
  catch(e){list.forEach(o=>{if(!o.gen||o.gen.state==="queued"){o.gen={state:"failed"};S.err[o.id]=hfErr(e)}});saveB(b);toast(hfErr(e));render()}}
function ensurePoll(bid){if(S.poll[bid])return S.poll[bid];
  S.poll[bid]=(async()=>{try{await pollBoard(bid)}catch(e){toast(hfErr(e))}finally{delete S.poll[bid];render();const b=S.boards[bid];if(b&&pendingT(b).length)ensurePoll(bid)}})();return S.poll[bid]}
async function pollBoard(bid){const b=S.boards[bid];if(!b)return;
  for(let round=0;round<200;round++){const pend=pendingT(S.boards[bid]||b);if(!pend.length)break;
    let res;try{res=await hf("jobs_wait",{jobs:pend.slice(0,12).map((s,i)=>({index:i,job_id:s.gen.job})),timeout_seconds:15})}
    catch(e){if(e&&e.retryable){await sleep(4000);continue}throw e}
    const js=jobsFrom(res);const chunk=pend.slice(0,12);
    for(let i=0;i<chunk.length;i++){const s=chunk[i];const j=js.find(x=>x.index===i)||js.find(x=>x.job_id===s.gen.job);if(!j)continue;
      const st=String(j.status||"").toLowerCase();
      if(st==="completed"&&j.url){await fetchFrame(bid,s,j.url);render()}
      else if(/fail|error|cancel|nsfw|reject/.test(st)){s.gen={state:"failed",job:s.gen.job};S.err[s.id]="Higgsfield לא הצליח לצייר";saveB(S.boards[bid]);render()}}
    await sleep(1500)}}
async function fetchFrame(bid,s,url){const b=S.boards[bid];const f="kf_"+s.id;const q=u=>"'"+String(u).replace(/'/g,"'\\''")+"'";
  try{const r=await hf("sandbox_exec",{command:`curl -sfL -o ${f}.png ${q(url)} && convert ${f}.png -resize '1280x1280>' -quality 80 ${f}.jpg && rm -f ${f}.png`,image_paths:[f+".jpg"],timeout_seconds:60});
    const im=(r.content||[]).find(c=>c.type==="image"&&c.data);if(!im)throw {code:"no_image"};
    const bin=atob(im.data);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const blob=new Blob([u8],{type:im.mimeType||"image/jpeg"});const as=await assetsFn();if(!as)throw {code:"no_assets"};
    const up=await as.upload(blob,{type:blob.type});S.blob[up.id]=up.url||URL.createObjectURL(blob);
    if(s.img&&s.img!==up.id)dropAsset(s.img);s.img=up.id;s.gen={state:"done",job:s.gen.job,url,at:new Date().toISOString()};saveThumb(s,blob)}
  catch(e){s.gen={state:"done",job:s.gen.job,url,at:new Date().toISOString()};S.err[s.id]="התמונה צוירה אבל לא נשמרה בדף – אפשר לפתוח אותה בקישור"}
  saveB(b)}
const b64Blob=(d,t)=>{const bin=atob(d);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return new Blob([u8],{type:t||"image/jpeg"})};
async function toThumb(blob,max=880){const bm=await createImageBitmap(blob);const k=Math.min(1,max/Math.max(bm.width,bm.height));const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.72)}
async function saveThumb(s,blob){try{const d=await toThumb(blob);S.thumb[s.id]=d;await S.db.doc("frames/"+s.id).set({d,img:s.img||""})}catch(_){}}

async function thumbFor(s){if(S.thumb[s.id])return S.thumb[s.id];
  try{const d=await S.db.doc("frames/"+s.id).get();const x=d&&d.exists&&d.data();if(x&&x.d&&(!x.img||x.img===s.img)){S.thumb[s.id]=x.d;return x.d}}catch(_){}
  try{const r=await fetch(imgSrc(s.img),{credentials:"include"});if(r.ok){const bl=await r.blob();if(bl.size){await saveThumb(s,bl);if(S.thumb[s.id])return S.thumb[s.id]}}}catch(_){}
  const url=s.gen&&s.gen.url;if(!url)return "";
  try{const f="kt_"+s.id;const r=await hf("sandbox_exec",{command:`curl -sfL -o ${f}.png '${String(url).replace(/'/g,"'\\''")}' && convert ${f}.png -resize '880x880>' -quality 72 ${f}.jpg && rm -f ${f}.png`,image_paths:[f+".jpg"],timeout_seconds:60});
    const im=(r.content||[]).find(c=>c.type==="image"&&c.data);if(!im)return "";const d=`data:${im.mimeType||"image/jpeg"};base64,${im.data}`;S.thumb[s.id]=d;S.db.doc("frames/"+s.id).set({d,img:s.img||""}).catch(()=>{});return d}catch(_){return ""}}

  const st=b.style||{};const h2=t=>`<h2 style="font-family:'Secular K','Assistant K',sans-serif;font-weight:400;font-size:18px;margin:0;color:#0784ad">${t}</h2>`;

    ${(b.chars||[]).length?h2("דמויות ראשיות")+`<table><tbody>${b.chars.map(c=>`<tr><td style="width:120px"><b>${esc(c.name)}</b></td><td>${esc(c.look)}</td></tr>`).join("")}</tbody></table>`:""}

  const all=[...tp,...prep];return all.map((h,i)=>`<div class="paper pt">${i?"":cover("שוטינג ליסט",b)}${h}${foot(b,i+1,all.length)}</div>`)}
function boardPages(b){const v=b.aspect==="9:16";const list=targets(b);const cols=v?5:3,per=v?5:6;const pages=[];for(let i=0;i<list.length;i+=per)pages.push(list.slice(i,i+per));
  return pages.map((ch,pi)=>`<div class="paper ls">${pi?"":cover("סטוריבורד",b)}<div class="fr" style="grid-template-columns:repeat(${cols},1fr)">${ch.map(o=>{const e=isEnd(o);const s=e?parentOf(b,o):o;const tag=e?"סוף":s.endf?"התחלה":"";

async function makePdf(kind,btn){const b=B();const old=btn.textContent;btn.disabled=true;btn.textContent="מכין PDF…";

      if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",.9),"JPEG",0,0,pw,ph)}
    host.innerHTML="";const dl=await claude.use("downloads");if(!dl)throw {code:"unavailable"};
    const nm=[land?"סטוריבורד":"שוטינג ליסט",b.name].filter(Boolean).join(" - ").replace(/[\\/:*?"<>|]/g," ");

  catch(e){toast(e&&e.code==="declined"?"ההורדה בוטלה":"לא הצלחתי ליצור PDF")}

${idx.map((i,k)=>`[${k+1}]\n${list[i]}`).join("\n\n")}`);
      const out=Array.isArray(r.items)?r.items:[];idx.forEach((i,k)=>{const t=String(out[k]||"").trim();if(t&&t.length>list[i].length*0.4)TRC[list[i]]=t})}catch(_){}}
  return list.map(p=>TRC[p]||p)}

function closePop(){$("#layer").innerHTML=""}
function pop(html,cls){const L=$("#layer");L.innerHTML=`<div class="scrim"></div><div class="pop ${cls||""}" role="dialog" aria-modal="true">${html}</div>`;
  L.querySelector(".scrim").onclick=()=>{if(!L.querySelector(".pop").dataset.busy)closePop()};return L.querySelector(".pop")}
function menu(items){const L=$("#layer");L.innerHTML=`<div class="mscrim"></div><div class="menu" role="menu">${items.map(x=>`<button data-m="${x[0]}" class="${x[3]||""}">${x[1]}${x[2]}</button>`).join("")}</div>`;
  L.querySelector(".mscrim").onclick=closePop;return L.querySelector(".menu")}
function modal(html,onMount){const h=$("#modalHost");if(h.dataset.fm){S.fm=null;renderFM()}const p=pop(html);onMount&&onMount(p)}
function closeModal(){closePop()}
function confirmBox(title,text,okTxt,ok,danger){modal(`<h3>${esc(title)}</h3>${text?`<p class="sub">${text}</p>`:""}<div class="btns"><button class="bs" id="cx">ביטול</button><button class="${danger?"bs red":"bp"}" id="cok">${esc(okTxt)}</button></div>`,
  m=>{m.querySelector("#cx").onclick=closeModal;m.querySelector("#cok").onclick=()=>{closeModal();ok()}})}
function sceneEdit(key){const b=B();const sc=(b.scenes||[]).find(x=>String(x.n)===key);const shots=(b.shots||[]).filter(s=>String(s.scene||"").trim()===key);const loc=(shots[0]||{}).loc||"";
  modal(`<h3>סצנה ${esc(key)}</h3><div class="fld"><label for="sc_t">כותרת</label><input id="sc_t" value="${esc(sc?sc.title:"")}" placeholder="2–4 מילים"></div><div class="fld"><label for="sc_l">לוקיישן</label><input id="sc_l" value="${esc(loc)}"></div>
    <div class="btns"><button class="bs" id="scx">ביטול</button><button class="bp" id="scok">שמירה</button></div>`,m=>{m.querySelector("#scx").onclick=closeModal;
    m.querySelector("#scok").onclick=()=>{const t=m.querySelector("#sc_t").value.trim(),l=m.querySelector("#sc_l").value.trim();b.scenes=b.scenes||[];let x=b.scenes.find(y=>String(y.n)===key);if(!x){x={n:key,title:""};b.scenes.push(x)}x.title=t;shots.forEach(s=>s.loc=l);saveB(b);closeModal();render()}})}
function metaPop(isNew){const b=B();if(!b)return;const v=b.aspect==="9:16";
  const p=pop(`<h3>${isNew?"סטוריבורד חדש":"פרטי הסטוריבורד"}</h3><div class="fld"><label for="m_name">שם</label><input id="m_name" value="${esc(b.name)}"></div>

    <div class="fld"><label>פורמט</label><div class="seg" id="m_asp"><button type="button" data-asp="16:9" class="${v?"":"on"}" aria-pressed="${!v}">16:9 רוחבי</button><button type="button" data-asp="9:16" class="${v?"on":""}" aria-pressed="${v}">9:16 לרילס</button></div></div>
    <div class="btns"><button class="bs" id="m_cx">ביטול</button><button class="bp" id="m_ok">${isNew?"המשך לתסריט":"שמירה"}</button></div>`);
  p.querySelector("#m_asp").onclick=e=>{const x=e.target.closest("[data-asp]");if(!x)return;p.querySelectorAll("[data-asp]").forEach(y=>{const on=y===x;y.classList.toggle("on",on);y.setAttribute("aria-pressed",on)})};
