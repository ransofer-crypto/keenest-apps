<!DOCTYPE html>
<html class="v6" lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>המשימות שלי</title><link rel="manifest" href="manifest.webmanifest?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="המשימות שלי"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-180.png?v=1"><link rel="icon" type="image/png" href="icons/icon-192.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --blue:#06B3E5;--navy:#00203F;--gray:#E6E9EC;--graphite:#2F2F2F;--fuchsia:#FA1664;
  --bg:#F6F7F9;--surface:#FFFFFF;--text:#00203F;--muted:#6B7A8C;--line:rgb(0 32 63 / .08);
  --sunk:rgb(0 32 63 / .05);--sel-bg:#00203F;--sel-fg:#fff;--seg-bg:rgb(0 32 63 / .06);--seg-on:#FFFFFF;
  --me:#00203F;--me-fg:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0B1724;--surface:#132435;--text:#EEF2F6;--muted:#8DA0B3;--line:rgb(255 255 255 / .08);
  --sunk:rgb(255 255 255 / .06);--sel-bg:#06B3E5;--sel-fg:#00203F;--seg-bg:rgb(255 255 255 / .07);--seg-on:#22384D;--me:#22384D;--me-fg:#EEF2F6}}
:root[data-theme=dark]{
  --bg:#0B1724;--surface:#132435;--text:#EEF2F6;--muted:#8DA0B3;--line:rgb(255 255 255 / .08);
  --sunk:rgb(255 255 255 / .06);--sel-bg:#06B3E5;--sel-fg:#00203F;--seg-bg:rgb(255 255 255 / .07);--seg-on:#22384D;--me:#22384D;--me-fg:#EEF2F6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Heebo,system-ui,sans-serif;touch-action:manipulation}
body{padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 90px);max-width:640px;margin:0 auto;transition:background .3s,color .3s}
body.chat{padding-bottom:calc(env(safe-area-inset-bottom) + 120px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;height:44px;margin-bottom:14px}
.top .ttl{flex:1;min-width:0}
.top h1{margin:0;font-size:24px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .date{font-size:13px;color:var(--muted);margin-top:2px}
.rnd,.back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);flex:none}
.rnd svg,.back svg{width:20px;height:20px}

/* segmented */
.seg{display:flex;background:var(--seg-bg);border-radius:999px;padding:4px;height:44px;margin-bottom:14px}
.seg>button{flex:1;border-radius:999px;font-size:15px;font-weight:600;color:var(--muted)}
.seg>button[aria-pressed=true]{background:var(--seg-on);color:var(--text);box-shadow:0 1px 4px rgb(0 20 40 / .1)}

/* summary */
.sum{display:flex;align-items:baseline;gap:8px;margin:4px 2px 14px}
.sum b{font-size:40px;font-weight:800;line-height:1;color:var(--blue)}
.sum span{font-size:15px;color:var(--muted)}
.sum i{font-style:normal;font-size:13px;color:var(--muted);margin-inline-start:auto}

/* section headings */
.sh{display:flex;align-items:center;gap:8px;margin:22px 2px 6px;min-height:24px}
.sh h2{margin:0;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.sh h2::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.8;flex:none}
.srtw{position:relative;max-width:62%;display:flex}
.srt{display:flex;align-items:center;gap:6px;color:var(--blue);font-size:13px;font-weight:600;min-width:0}
.srt>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srt svg{width:16px;height:16px;flex:none}
.lnk{color:var(--blue);font-size:13px;font-weight:600}

/* rows */
.list{position:relative}
.row{position:relative;border-bottom:1px solid var(--line);overflow:hidden}
.xwrap .row:active{background:none!important}
.row:last-child{border-bottom:0}
.sw{position:relative;z-index:1;display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 2px;background:var(--bg);touch-action:pan-y}
.swbg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:stretch;z-index:0}
.swbg button{width:88px;font-size:14px;font-weight:700;color:#fff}
.swbg .sw-dup{background:var(--blue)}
.swbg .sw-del{background:var(--fuchsia)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid rgb(127 140 160 / .55);flex:none;display:grid;place-items:center;transition:background .25s,border-color .25s}
.ck svg{width:14px;height:14px;opacity:0;color:#fff}
.ck.on{background:var(--blue);border-color:var(--blue)}.ck.on svg{opacity:1}
.ck.drop{border-style:dashed}
.tx{flex:1;min-width:0;cursor:pointer}
.t1{font-size:16px;font-weight:500;line-height:1.35}
.done .t1,.dropped .t1{color:var(--muted);text-decoration:line-through;text-decoration-color:rgb(127 140 160 / .6)}
.t2{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2 .late{color:var(--fuchsia);font-weight:600}
.t2 .fut{color:var(--blue);font-weight:600}
.when{width:26px;height:26px;display:grid;place-items:center;flex:none;color:rgb(127 140 160 / .6)}
.when svg{width:20px;height:20px}
.when.on{color:var(--blue)}

/* inline task panel */
.xwrap{border-bottom:1px solid var(--line)}
.xwrap:last-child{border-bottom:0}
.xwrap>.row{border-bottom:0}
.xpn{padding:2px 2px 16px 40px}
[dir=rtl] .xpn{padding:2px 40px 16px 2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chp{height:40px;padding:0 14px;border-radius:999px;background:var(--sunk);font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.chp small{font-size:11.5px;color:var(--muted);font-weight:500}
.chp.on{background:var(--blue);color:#00203F}.chp.on small{color:#00203F}
.nd{display:flex;align-items:center;height:40px;border-radius:999px;background:var(--sunk);padding:0 4px 0 12px}
[dir=rtl] .nd{padding:0 12px 0 4px}
.nd span{font-size:14.5px;font-weight:600;white-space:nowrap}
.nd input{width:44px;height:32px;border:0;border-radius:999px;background:var(--bg);text-align:center;font-size:16px;outline:none;margin:0 6px}
.nd button{height:32px;padding:0 12px;border-radius:999px;background:var(--sel-bg);color:var(--sel-fg);font-size:13.5px;font-weight:700}
.ask{display:flex;gap:8px;margin-top:12px}
.ask input{flex:1;min-width:0;height:44px;border:0;border-radius:22px;background:var(--sunk);padding:0 16px;font-size:16px;outline:none}
.ask button{width:44px;height:44px;border-radius:50%;background:var(--sel-bg);color:var(--sel-fg);display:grid;place-items:center;flex:none}
.ask button svg{width:20px;height:20px}
.ask button:disabled{opacity:.4}
.xa{font-size:14.5px;line-height:1.5;margin-top:10px;white-space:pre-wrap}
.xa.wait{color:var(--muted)}
.xl{display:flex;gap:18px;margin-top:12px;font-size:13.5px;font-weight:600}
.xl button{color:var(--muted)}
.xl button.x{color:var(--fuchsia)}
.icons{display:flex;gap:8px;flex:none}
.icons .rnd.on{background:var(--sel-bg);color:var(--sel-fg)}

/* option-1 row */
.ring{width:22px;height:22px;border-radius:50%;border:1.5px solid rgb(127 140 160 / .32);flex:none;display:grid;place-items:center;transition:background .3s,border-color .3s}
.ring svg{width:12px;height:12px;color:#fff;opacity:0;transition:opacity .2s}
.done .ring{background:var(--blue);border-color:var(--blue)}.done .ring svg{opacity:1}
.dropped .ring{border-style:dashed}
.sw{align-items:flex-start!important}
.sw .ring{margin-top:2px}
.ic{display:flex;gap:2px;align-self:flex-end;margin-bottom:-4px;flex:none}
.ic button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:rgb(127 140 160 / .75);transition:background .25s,color .25s}
.ic button svg{width:17px;height:17px}
.ic button.on{background:var(--sunk);color:var(--blue)}
.ic .spk{color:#D97757}.ic .spk.on{color:#D97757}
.advl{display:flex;align-items:center;gap:6px;width:100%;padding:0 34px 10px 2px;font-size:13px;font-weight:600;color:#C2603F;text-align:start;position:relative;z-index:1;background:var(--bg)}
.advl .s svg{width:12px;height:12px;display:block}
.advl .a{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.advl>svg{width:13px;height:13px;transition:transform .3s;color:var(--muted)}
.advl.on>svg{transform:rotate(-90deg)}
.pvhost{position:relative;z-index:6}
.pvw{position:relative;height:0}
.pv{position:absolute;left:2px;top:-10px;z-index:8;background:var(--surface);border-radius:16px;box-shadow:0 12px 34px rgb(0 10 25 / .22);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:250px;max-width:calc(100% - 4px);transform-origin:top left;animation:iosMenu .38s var(--ios-move,ease) both}
.pv .q{font-size:12.5px;font-weight:700;color:var(--muted);padding:0 4px}
.pv .chp{height:38px}
.pv .nd{height:38px;gap:6px}
.pv .nd input{margin:0}
.pvl{display:flex;gap:16px;padding:2px 4px 0;font-size:13px;font-weight:600}
.pvl button{color:var(--muted)}.pvl button.x{color:var(--fuchsia)}
.xpn{padding:0 34px 14px 2px!important}
.advb{margin-top:8px;height:36px;padding:0 14px;border-radius:999px;background:rgb(217 119 87 / .12);color:#C2603F;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.advb svg{width:14px;height:14px}
.draft{background:var(--sunk);border-radius:14px;padding:11px 13px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.th{display:flex;align-items:baseline;gap:8px;margin:24px 2px 2px}
.thn{font-size:15px;font-weight:800;color:var(--text);text-align:start}
.thc{font-size:11.5px;color:var(--muted);font-weight:500}
.nb{font-style:normal;display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--fuchsia);color:#fff;font-size:11px;font-weight:700;margin-inline-start:4px;vertical-align:1px}
.sgr{display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line)}
.sgr:last-child{border-bottom:0}
.sgr button{height:34px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:700;flex:none}
.sgr .sa{background:var(--sel-bg);color:var(--sel-fg)}.sgr .sb{background:var(--sunk);color:var(--muted)}

/* topic rows */
.tp{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px;transition:background-color .2s}
.tp:last-child{border-bottom:0}
.tp .nm{flex:1;min-width:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp .ct{font-size:14px;font-weight:700;color:var(--blue);min-width:22px;text-align:center}
.tp .ct.zero{color:var(--muted);font-weight:500}
.tp .chev{width:16px;height:16px;color:var(--muted);flex:none}

/* wide buttons */
.wide{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:44px;border-radius:999px;background:var(--sel-bg);color:var(--sel-fg);font-size:15px;font-weight:700;margin:4px 0 0}
.wide.soft{background:var(--sunk);color:var(--text)}
.fold{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600;margin:22px 2px 6px;height:24px}
.fold svg{width:14px;height:14px;transition:transform .3s}
.fold.open svg{transform:rotate(-90deg)}
.empty{color:var(--muted);font-size:15px;padding:14px 2px}
.note{color:var(--muted);font-size:14px;line-height:1.5;margin:-4px 2px 10px;white-space:pre-wrap}

/* menu */
.menu{position:absolute;top:28px;left:0;z-index:20;background:var(--surface);border-radius:14px;box-shadow:0 12px 34px rgb(0 10 25 / .22);padding:6px;min-width:200px;max-width:280px;max-height:60vh;overflow:auto}
.menu button{display:block;width:100%;text-align:right;direction:rtl;padding:10px 12px;border-radius:9px;font-size:14.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu button.cat{font-weight:700}
.menu button.sub{padding-inline-start:24px;color:var(--muted)}
.menu button.on{color:var(--blue);font-weight:700}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* popup */
#layer .scrim{position:fixed;inset:0;background:rgb(0 10 25 / .4);z-index:50}
.pop{position:fixed;z-index:51;width:min(420px,calc(100vw - 32px));background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 60px);overflow:auto}
.pop h3{margin:0;font-size:17px;font-weight:800}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12.5px;color:var(--muted);font-weight:600}
.fld textarea,.fld input,.fld select{width:100%;border:0;border-radius:14px;background:var(--sunk);padding:12px 14px;font-size:16px;outline:none;resize:none}
.fld select{-webkit-appearance:none;appearance:none;height:46px;padding:0 14px}
.btns{display:flex;gap:8px}
.bp{background:var(--sel-bg);color:var(--sel-fg)}
.bs{background:var(--sunk)}
.bred{color:var(--fuchsia)}
.btns:not(.kd-hasp) .bred{background:var(--fuchsia);color:#fff}
/* when picker */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{height:48px;border-radius:14px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:600;line-height:1.15}
.opt small{font-size:11.5px;color:var(--muted);font-weight:500}
.opt.on{background:var(--blue);color:#00203F}.opt.on small{color:#00203F}
.dd{display:flex;gap:8px;align-items:center}
.dd input{flex:1;min-width:0;height:48px;border:0;border-radius:14px;background:var(--sunk);padding:0 14px;font-size:16px;outline:none}
.dd button{height:48px;padding:0 18px;border-radius:14px;background:var(--sel-bg);color:var(--sel-fg);font-weight:700;font-size:15px;flex:none}
.plain{display:flex;gap:8px}
.plain button{flex:1;height:44px;border-radius:999px;font-size:14.5px;font-weight:600;background:var(--sunk)}
.plain button.x{color:var(--fuchsia)}

/* chat */
.msgs{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.me{align-self:flex-start;max-width:85%;background:var(--me);color:var(--me-fg);padding:10px 14px;border-radius:18px;font-size:15.5px;line-height:1.45;white-space:pre-wrap}
.ai{align-self:stretch;font-size:15.5px;line-height:1.55;white-space:pre-wrap}
.ai.wait{color:var(--muted)}
.chg{margin-top:10px;border-top:1px solid var(--line)}
.chg div{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.4}
.chg div b{flex:none;width:18px;text-align:center;color:var(--blue);font-weight:800}
.chg div b.r{color:var(--fuchsia)}
.chg div span{flex:1;min-width:0}
.chg div em{font-style:normal;color:var(--muted);font-size:12.5px;display:block}
.chgb{display:flex;gap:8px;margin-top:10px}
.chgb .wide{margin:0;flex:1}
.chgb .no{flex:none;padding:0 18px;height:44px;border-radius:999px;background:var(--sunk);font-weight:600}
.applied{margin-top:8px;font-size:13px;color:var(--blue);font-weight:700}
#composer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);padding:10px 18px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line)}
#composer .in{max-width:604px;margin:0 auto;display:flex;align-items:flex-end;gap:8px}
#composer textarea{flex:1;min-width:0;min-height:44px;max-height:140px;border:0;border-radius:22px;background:var(--sunk);padding:11px 16px;font-size:16px;line-height:22px;outline:none;resize:none;display:block}
#composer button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
#composer .send{background:var(--sel-bg);color:var(--sel-fg)}
#composer .send:disabled{opacity:.4}
#composer .mic{background:var(--sunk)}
#composer .mic.on{background:var(--fuchsia);color:#fff}
#composer svg{width:20px;height:20px}

/* toast */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:60;background:#FFF0A6;color:#00203F;border-radius:999px;padding:11px 20px;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px rgb(0 10 25 / .18);white-space:nowrap}
body.chat .toast{bottom:calc(env(safe-area-inset-bottom) + 84px)}
.toast button{color:#0590B8;font-weight:800}
/* ===== look: direction 5 — clean light blue ===== */
:root{
  --bg:#F4F9FC;--bg2:#E6F3FA;--surface:#FFFFFF;--text:#16222E;--muted:#7A8896;--line:#E8EEF3;--sunk:#F0F4F7;
  --blue:#2B9FD9;--blue2:#58B8EA;--blueD:#1B6E9E;--soft:#E3F2FA;--chip:#F0F4F7;--chip-line:#E3EAF0;
  --sel-bg:#16222E;--sel-fg:#fff;--me:#2B9FD9;--me-fg:#fff;--shadow:0 6px 18px rgb(30 120 180 / .07);
  --grad:linear-gradient(160deg,#5EC0EE,#2B93D1);--font:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0D1620;--bg2:#10202D;--surface:#16222E;--text:#EAF2F8;--muted:#8FA2B3;--line:#22313F;--sunk:#1C2B39;
  --soft:#16384D;--chip:#1C2B39;--chip-line:#273849;--sel-bg:#58B8EA;--sel-fg:#0D1620;--shadow:0 6px 18px rgb(0 0 0 / .3);--blueD:#8BD3F5}}
:root[data-theme=dark]{
  --bg:#0D1620;--bg2:#10202D;--surface:#16222E;--text:#EAF2F8;--muted:#8FA2B3;--line:#22313F;--sunk:#1C2B39;
  --soft:#16384D;--chip:#1C2B39;--chip-line:#273849;--sel-bg:#58B8EA;--sel-fg:#0D1620;--shadow:0 6px 18px rgb(0 0 0 / .3);--blueD:#8BD3F5}
html,body{font-family:var(--font);height:100%;overflow:hidden;overscroll-behavior:none}
body{padding:0!important;max-width:none!important;margin:0;background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 35%,var(--bg))}
input,textarea,select,button{font-family:var(--font)}
.shell{height:100vh;height:100dvh;display:flex;flex-direction:column}
#paper{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;padding:calc(env(safe-area-inset-top,0px) + 14px) 0 calc(env(safe-area-inset-bottom,0px) + 110px)}
#paper::-webkit-scrollbar{display:none}
body.chat #paper{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 190px)}
.col{max-width:560px;margin:0 auto;padding:0 16px}
#view{padding:0}
.f1{flex:1;min-width:0}
/* top */
.tp{display:flex;align-items:center;gap:10px;background:rgb(255 255 255 / .7);border-radius:24px;padding:8px 10px;box-shadow:var(--shadow)}
:root[data-theme=dark] .tp{background:rgb(255 255 255 / .05)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tp{background:rgb(255 255 255 / .05)}}
.tp .av{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:600;font-size:17px;flex:none}
.tp .l1{font-size:12.5px;color:var(--muted)}.tp .l2{font-size:16px;font-weight:500}
.tp .rb{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:0 4px 12px rgb(30 120 180 / .1);flex:none;color:var(--text)}
.tp .rb svg{width:19px;height:19px}
/* summary + search */
.rem{margin-top:14px;border-radius:26px;background:linear-gradient(180deg,#D6EDF9,#E7F4FB);padding:14px}
:root[data-theme=dark] .rem{background:linear-gradient(180deg,#14324A,#12293B)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .rem{background:linear-gradient(180deg,#14324A,#12293B)}}
.rrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rrow .em{font-size:26px}
.rrow b{font-size:16px;font-weight:500;display:block}.rrow small{font-size:12.5px;color:var(--muted)}
.dg{display:flex;gap:4px;direction:ltr;align-items:center}
.dg span{min-width:26px;height:34px;padding:0 4px;border-radius:9px;background:var(--surface);display:grid;place-items:center;font-size:17px;font-weight:500}
.dg .sl{background:none;min-width:8px;color:var(--muted)}
.sr{height:50px;border-radius:16px;background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;box-shadow:0 4px 14px rgb(30 120 180 / .06);color:var(--muted)}
.sr>svg{width:19px;height:19px;flex:none}
.sr input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--text);height:100%}
.sr .fb{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--blue)}
.sr .fb.on{background:var(--blue);color:#fff}
.sr .fb svg{width:19px;height:19px}
.srtw{position:relative}
.menu{top:46px;left:0}
.menu .mc{font-size:11.5px;color:var(--muted);font-weight:600;padding:8px 12px 2px}
.chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:40px;padding:0 16px;border-radius:14px;background:var(--surface);font-size:14.5px;color:var(--muted)}
.chips button.on{background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff}
.fnote{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--blueD);background:var(--surface);border-radius:999px;padding:4px 6px 4px 12px}
.fnote button{width:22px;height:22px;display:grid;place-items:center}.fnote svg{width:14px;height:14px}
/* headings */
.hd{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.hd b{font-size:16px;font-weight:500}.hd span{font-size:13px;color:var(--muted)}
.hd .lk{color:var(--blue);font-size:13.5px}
.cat{font-size:12.5px;color:var(--muted);margin:16px 4px 8px}
/* cards */
.list{display:flex;flex-direction:column;gap:10px}
.row{position:relative;border-radius:22px;overflow:hidden;border:0!important}
.post,.xwrap.post{background:var(--surface);box-shadow:var(--shadow)}
.xwrap{border-radius:22px;overflow:hidden;border:0!important}
.xwrap>.row{border-radius:0}
.sw{position:relative;z-index:1;background:inherit;padding:14px!important;display:block!important;min-height:0!important}
.post .sw,.xwrap.post .sw{background:var(--surface)}
.swbg button{width:88px}
.swbg{border-radius:22px;overflow:hidden}
.rr{display:flex;align-items:flex-start;gap:12px}
.ring{width:24px;height:24px;border-radius:50%;border:1.5px solid #C6D6E2;flex:none;display:grid;place-items:center;margin-top:1px;transition:background .3s,border-color .3s}
.ring svg{width:12px;height:12px;color:#fff;opacity:0}
.done .ring{background:var(--blue);border-color:var(--blue)}.done .ring svg{opacity:1}
.dropped .ring{border-style:dashed}
.tx{flex:1;min-width:0;cursor:pointer}
.t1{font-size:16px;font-weight:500;line-height:1.35}
.done .t1,.dropped .t1{opacity:.45;text-decoration:line-through}
.t3{font-size:13px;opacity:.85;margin-top:3px;line-height:1.45}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0 0;padding-inline-start:36px}
.tg span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.tg .late{background:#FDE7EE;color:#D1245C}
.tg .fut{background:var(--soft);color:var(--blueD)}
.tg .adv{background:#FCEBE3;color:#C2603F}
:root[data-theme=dark] .tg .late{background:#3E1B27;color:#FF9DB9}:root[data-theme=dark] .tg .adv{background:#3A2418;color:#F3B497}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tg .late{background:#3E1B27;color:#FF9DB9}:root:not([data-theme=light]) .tg .adv{background:#3A2418;color:#F3B497}}
/* featured blue card */
.rec,.xwrap.rec{background:var(--grad);color:#fff;box-shadow:0 14px 30px rgb(40 150 210 / .3)}
.rec .sw,.xwrap.rec .sw{background:transparent}
.fh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fh .lg{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;flex:none}
.fh .lg svg{width:20px;height:20px}
.fh b{display:block;font-size:15px;font-weight:500}.fh small{font-size:12.5px;opacity:.85}
.rec .t1,.xwrap.rec .t1{font-size:19px}
.rec .ring,.xwrap.rec .ring{border-color:rgb(255 255 255 / .7)}
.rec.done .ring,.xwrap.rec.done .ring{background:#fff}.rec.done .ring svg{color:var(--blue)}
.fa{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:4px}
.fa .tg{padding:0}.rec .tg span{background:rgb(255 255 255 / .22)!important;color:#fff!important}
.go{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:500;color:#fff;flex:none;margin-inline-start:auto}
.go svg{width:16px;height:16px}
/* detail */
.xpn{padding:0 14px 16px 14px!important}
.xwrap.rec .xpn{color:#fff}
.note{font-size:14px;line-height:1.55;margin:0 0 10px}
.lbl{font-size:11.5px;font-weight:600;opacity:.75;margin:12px 0 6px;display:flex;align-items:center;gap:5px}
.lbl svg{width:12px;height:12px;color:#D97757}
.xwrap.rec .lbl svg{color:#fff}
.draft{background:var(--sunk);border-radius:16px;padding:11px 13px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.xwrap.rec .draft{background:rgb(255 255 255 / .18)}
.xa{font-size:14px;line-height:1.5;margin-top:6px;white-space:pre-wrap}
.xa.wait{opacity:.6}
.mini{display:flex;gap:14px;margin-top:8px}
.mini button{display:flex;align-items:center;gap:4px;font-size:13px;opacity:.7}
.mini svg{width:14px;height:14px}
.ask{display:flex;gap:8px;margin-top:12px}
.ask input{flex:1;min-width:0;height:46px;border:0;border-radius:23px;background:var(--sunk);padding:0 16px;font-size:16px;outline:none;color:var(--text)}
.xwrap.rec .ask input{background:rgb(255 255 255 / .92);color:#16222E}
.ask button{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}
.xwrap.rec .ask button{background:#fff;color:var(--blue)}
.ask button svg{width:20px;height:20px}.ask button:disabled{opacity:.4}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.acts button{height:36px;padding:0 13px;border-radius:12px;background:var(--chip);font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:6px;color:var(--text)}
.acts button svg{width:15px;height:15px}
.acts .sp{background:#FCEBE3;color:#C2603F}.acts .x{color:#D1245C;background:none}
.acts button.on{background:var(--soft);color:var(--blueD)}
.xwrap.rec .acts button{background:rgb(255 255 255 / .2);color:#fff}.xwrap.rec .acts .x{background:none;color:#fff;opacity:.8}
.ppw{margin-top:12px}
.ppw .q{font-size:12.5px;font-weight:600;opacity:.75;margin-bottom:6px}
.chips2{display:flex;gap:6px;flex-wrap:wrap}
.chp{height:38px;padding:0 14px;border-radius:12px;background:var(--soft);color:var(--blueD);font-size:14px;font-weight:500}
.xwrap.rec .chp{background:#fff;color:var(--blue)}
.nd{display:flex;align-items:center;gap:6px;height:38px;border-radius:12px;background:var(--soft);padding:0 4px 0 12px;font-size:14px;font-weight:500;color:var(--blueD);border:0}
[dir=rtl] .nd{padding:0 12px 0 4px}
.xwrap.rec .nd{background:#fff;color:var(--blue)}
.nd input{width:44px;height:30px;border:0;border-radius:9px;background:var(--surface);text-align:center;font-size:16px;outline:none;color:var(--text);margin:0}
.nd button{height:30px;padding:0 11px;border-radius:9px;background:var(--blue);color:#fff;font-size:13px;font-weight:600}
.lnk2{font-size:13px;opacity:.75;margin-top:8px}
.chg{margin-top:8px}
.chg div{display:flex;gap:8px;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.chg div b{width:14px;text-align:center;color:var(--blue)}.chg div b.r{color:#D1245C}
.chg div em{font-style:normal;opacity:.65;font-size:12px;display:block}
.chgb{display:flex;gap:8px;margin-top:10px}
.chgb .wide{flex:1;height:42px;border-radius:14px;background:var(--grad);color:#fff;font-weight:500;margin:0}
.xwrap.rec .chgb .wide{background:#fff;color:var(--blue)}
.chgb .no{height:42px;padding:0 16px;border-radius:14px;background:var(--chip);color:var(--text)}
/* topics */
.tps{display:flex;flex-direction:column;gap:8px}
.tpc{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:20px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
[dir=rtl] .tpc{padding:6px 14px 6px 6px}
.tpc .f1{text-align:start;padding:8px 0}
.tpc b{display:block;font-size:15.5px;font-weight:500}.tpc small{font-size:12.5px;color:var(--muted)}
.tpc .ed{width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--muted)}
.tpc .ed svg{width:17px;height:17px}
.wide{height:52px;border-radius:16px;font-weight:500}
.wide.soft{background:var(--surface);color:var(--blue);border:0;box-shadow:var(--shadow)}
/* suggestions + chat */
.sgr{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow)}
.sgr .t1{font-size:15px}.sgr .t2{font-size:12px;color:var(--muted);margin-top:2px}
.sgr button{height:34px;padding:0 13px;border-radius:11px;font-size:13px;font-weight:600;flex:none}
.sgr .sa{background:var(--blue);color:#fff}.sgr .sb{background:var(--chip);color:var(--muted)}
.msgs{display:flex;flex-direction:column;gap:12px}
.me{align-self:flex-start;max-width:85%;background:var(--grad);color:#fff;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;white-space:pre-wrap}
.ai{background:var(--surface);border-radius:20px;padding:12px 14px;font-size:15px;line-height:1.55;white-space:pre-wrap;box-shadow:var(--shadow)}
.ai.wait{color:var(--muted)}
.applied{margin-top:8px;font-size:13px;color:var(--blue);font-weight:600}
#composer{bottom:calc(env(safe-area-inset-bottom,0px) + 88px)!important;background:transparent!important;border:0!important;padding:0 16px!important}
#composer textarea{background:var(--surface)!important;box-shadow:var(--shadow);border-radius:24px!important}
#composer .send{background:var(--grad)!important;color:#fff!important}
/* empty, fold */
.empty{color:var(--muted);font-size:15px;padding:16px 4px}
.fold{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;margin:22px 4px 10px}
.fold svg{width:14px;height:14px;transition:transform .3s}.fold.open svg{transform:rotate(-90deg)}
.chips{flex-wrap:nowrap!important}
.rec .sw,.xwrap.rec .sw{background:var(--grad)!important}
.xwrap.rec>.row .sw{background:transparent!important}
.hd[class*=tc-] b{padding:5px 13px;border-radius:999px;background:var(--chip);font-size:14.5px}
/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(82px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:space-around;background:linear-gradient(180deg,rgb(230 244 251 / .7),#E2F1FA);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
:root[data-theme=dark] .bnav{background:linear-gradient(180deg,rgb(16 32 45 / .7),#10202D)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .bnav{background:linear-gradient(180deg,rgb(16 32 45 / .7),#10202D)}}
.bnav>button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);width:60px;font-weight:500!important}
.bnav>button svg{width:22px;height:22px}
.bnav>button.on{color:var(--blueD)}
.bnav .nb{position:absolute;top:-4px;right:12px;font-style:normal;min-width:17px;height:17px;border-radius:999px;background:#FA1664;color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
.bnav .hx{width:62px;height:62px;border-radius:22px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgb(40 150 210 / .45);transform:rotate(45deg) translateY(-12px);flex:none}
.bnav .hx span{transform:rotate(-45deg);display:grid}
.bnav .hx svg{width:26px;height:26px}
.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 98px)!important}
body.chat .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 160px)!important}
/* ===== features ===== */
.hero{margin-top:14px}
.hero .rem{margin-top:0;border-radius:26px 26px 0 0;padding:18px 18px 16px;position:relative;z-index:1}
.hero .rrow{margin:0;min-height:44px}
.hero .rrow b{font-size:21px;font-weight:600;letter-spacing:-.2px}
.hero .rrow small{display:block;margin-top:2px;font-size:13px}
.rb2{width:44px;height:44px;border-radius:50%;background:rgb(255 255 255 / .55);display:grid;place-items:center;color:inherit;flex:none}
.rb2 svg{width:19px;height:19px}
.hero .sr{height:44px;box-shadow:none;background:rgb(255 255 255 / .75);padding:0 4px 0 14px}
.sx{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}.sx svg{width:16px;height:16px}
.milk2{display:flex;align-items:center;gap:8px;padding:10px 10px;border-radius:0 0 26px 26px;background:rgb(255 255 255 / .5);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 10px 24px rgb(120 100 40 / .08);border:1px solid rgb(255 255 255 / .6);border-top:0}
.mseg{flex:1;display:flex;gap:4px;background:rgb(255 255 255 / .55);border-radius:16px;padding:4px;position:relative}
.mseg>button{flex:1;height:38px;border-radius:12px;font-size:14.5px;color:var(--muted);position:relative;z-index:1}
.mseg>button.on{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgb(0 0 0 / .08)}
.milk2 .fb{width:46px;height:46px;border-radius:16px;background:rgb(255 255 255 / .55);display:grid;place-items:center;color:var(--text)}
.milk2 .fb.on{background:var(--text);color:var(--surface)}.milk2 .fb svg{width:19px;height:19px}
/* topic tab on cards */
.tpx{display:none}
html[data-tv=a] .post .tpx{display:block;margin:-14px -14px 12px;padding:7px 16px;font-size:12.5px;font-weight:600;border-radius:22px 22px 0 0}
html[data-tv=b] .list{gap:34px}html[data-tv=b] .list{padding-top:24px}
html[data-tv=b] .post,html[data-tv=b] .xwrap.post,html[data-tv=b] .xwrap.post>.row{overflow:visible}
html[data-tv=b] .post .sw{border-radius:22px 0 22px 22px}
html[data-tv=b] .post .tpx{display:block;position:absolute;top:-26px;right:0;height:26px;padding:0 16px;line-height:28px;font-size:12.5px;font-weight:600;border-radius:14px 14px 0 0;background:var(--surface)!important}
html[data-tv=b] .post .tpx::before{content:"";position:absolute;bottom:0;left:-14px;width:14px;height:14px;background:radial-gradient(circle at 0 0,transparent 14px,var(--surface) 14.5px)}
html[data-tv=c] .list{gap:12px}
html[data-tv=c] .post .rr{padding-inline-start:0}
html[data-tv=c] .post .tpx{display:inline-flex;margin:0 0 10px;padding:0;font-size:12.5px;font-weight:600;background:none!important;align-items:center;gap:8px}
html[data-tv=c] .post .tpx::before{content:"";width:18px;height:2px;border-radius:2px;background:currentColor;opacity:.6}

.xwrap .swbg{display:none!important}

.tp .sy.spin svg{animation:spn 1.6s linear infinite}@keyframes spn{to{transform:rotate(-360deg)}}
.tp .l1{margin-top:1px}
.swap{height:32px;padding:0 13px;border-radius:999px;background:rgb(255 255 255 / .55);font-size:13px;font-weight:500;color:inherit;flex:none}
.why{display:flex;align-items:flex-start;gap:6px;font-size:13.5px;margin-top:6px;line-height:1.4;opacity:.85}.why .cl{width:14px;height:14px;margin-top:2px}
.nudge{background:rgb(242 107 58 / .1);border-radius:16px;padding:2px 12px 12px;margin-bottom:6px}
.nudge .acts{margin-top:6px}
.steps{display:flex;flex-direction:column;gap:2px}
.stp{display:flex;align-items:center;gap:10px;text-align:start;padding:7px 0;font-size:14.5px;color:inherit;width:100%}
.stp .ring{width:20px;height:20px;margin:0}.stp.done .f1{opacity:.45;text-decoration:line-through}
.tg .wt{background:#E8E3F5!important;color:#4B3A8C!important}:root[data-theme=dark] .tg .wt{background:#2E2650!important;color:#CFC4FF!important}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tg .wt{background:#2E2650!important;color:#CFC4FF!important}}
.frow{display:flex;gap:8px;align-items:stretch}.frow textarea{flex:1;min-width:0}
.fmic{width:52px;border-radius:14px;background:var(--chip);display:grid;place-items:center;color:var(--text);flex:none}
.fmic svg{width:22px;height:22px}.fmic.on{background:#F26B3A;color:#fff}
.fai{font-size:12.5px;color:var(--muted);min-height:0;margin-top:4px}.fai:empty{display:none}
.pop.busy #fT{opacity:.5}
.wseg2{display:flex;gap:6px;background:var(--chip);border-radius:14px;padding:4px}
.wseg2 button{flex:1;height:36px;border-radius:10px;font-size:14px;color:var(--muted)}
.wseg2 button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 2px 6px rgb(0 0 0 / .08)}
.acts .cl{width:15px;height:15px}

/* stacked card behind (d = milky, e = tinted) */
html[data-tv=d] .list,html[data-tv=e] .list{gap:40px;padding-top:28px}
html[data-tv=d] .post,html[data-tv=e] .post,html[data-tv=d] .xwrap.post,html[data-tv=e] .xwrap.post,html[data-tv=d] .xwrap.post>.row,html[data-tv=e] .xwrap.post>.row{overflow:visible}
html[data-tv=d] .post .sw,html[data-tv=e] .post .sw,html[data-tv=d] .xwrap.post .sw,html[data-tv=e] .xwrap.post .sw{border-radius:22px}
html[data-tv=d] .xwrap.post,html[data-tv=e] .xwrap.post{border-radius:22px}
html[data-tv=d] .tpx,html[data-tv=e] .tpx{display:block;position:absolute;left:0;right:0;top:-28px;height:80px;border-radius:22px;padding:6px 18px 0;font-size:12.5px;font-weight:600;z-index:0;pointer-events:none;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
html[data-tv=d] .tpx{background:rgb(255 255 255 / .45)!important;border:1px solid rgb(255 255 255 / .7);box-shadow:0 6px 18px rgb(120 100 40 / .06)}
html[data-tv=e] .tpx.tc-k{background:rgb(140 205 232 / .45)!important}html[data-tv=e] .tpx.tc-p{background:rgb(240 208 100 / .45)!important}
html[data-tv=d] .post .sw,html[data-tv=e] .post .sw{position:relative;z-index:1}
html[data-tv=d] .swbg,html[data-tv=e] .swbg{z-index:0;inset:2px!important}
:root[data-theme=dark][data-tv=d] .tpx{background:rgb(255 255 255 / .07)!important;border-color:rgb(255 255 255 / .1)}
:root[data-theme=dark][data-tv=e] .tpx.tc-k{background:rgb(60 130 160 / .35)!important}
:root[data-theme=dark][data-tv=e] .tpx.tc-p{background:rgb(150 120 30 / .35)!important}
@media (prefers-color-scheme:dark){:root:not([data-theme=light])[data-tv=d] .tpx{background:rgb(255 255 255 / .07)!important;border-color:rgb(255 255 255 / .1)}
:root:not([data-theme=light])[data-tv=e] .tpx.tc-k{background:rgb(60 130 160 / .35)!important}
:root:not([data-theme=light])[data-tv=e] .tpx.tc-p{background:rgb(150 120 30 / .35)!important}}
/* hero/tab colors */
.tpx.tc-k{background:#A7DAEE;color:#0B4A63}.tpx.tc-p{background:#F4D873;color:#5E4800}
html[data-tv=b] .tpx.tc-k,html[data-tv=c] .tpx.tc-k{color:#0B6E92}html[data-tv=b] .tpx.tc-p,html[data-tv=c] .tpx.tc-p{color:#8A6A00}

function catKey(id){const c=S.topics.find(x=>x.id===id)?.cat||'';for(const k in chipCats)if(chipCats[k].includes(c))return k;return 'p'}
const CHIPS=[['all','הכל'],['k','עבודה'],['p','אישי']];
const chipCats={k:[CATS[0],CATS[1],CATS[2]],p:[CATS[3],CATS[4],CATS[5]]};
const ago=d=>Math.round((new Date(today()+'T12:00')-new Date(d+'T12:00'))/864e5);
const waiting=t=>active(t)&&!!t.wait;
function metaChips(t,showTopic){
  const td=today(),c=[];
  if(t.wait){const n=ago(t.wait.since||td);c.push(`<span class="wt${n>=3?' late':''}">מחכה ל${esc(t.wait.who)}${n?' · '+(n===1?'מאתמול':n+' ימים'):''}</span>`)}
  else if(t.day&&t.day<td&&active(t)){const n=ago(t.day);c.push(`<span class="late">${n===1?'מאתמול':'כבר '+n+' ימים'}</span>`)}
  if((t.pc||0)>=3&&active(t))c.push(`<span class="late">נדחתה ${t.pc} פעמים</span>`);
  if(t.steps&&t.steps.length){const d=t.steps.filter(s=>s.done).length;c.push(`<span>${d}/${t.steps.length} צעדים</span>`)}
  if(S.advBusy[t.id])c.push(`<span class="adv">קלוד עובד…</span>`);else if(t.adv)c.push(`<span class="adv">${esc(t.adv.title||'קלוד הכין')}</span>`);
  if(S.splitBusy&&S.splitBusy[t.id])c.push(`<span class="adv">מפרק לצעדים…</span>`);
  if(t.dropped)c.push('<span>לא רלוונטית</span>');
  return c.length?`<div class="tg">${c.join('')}</div>`:'';
}
function card(t,showTopic,feat){
  const open=S.open&&S.open.id===t.id;
  const cls=(feat?' rec':' post')+(t.done?' done':t.dropped?' dropped':'');
  const why=feat&&S.focus&&S.focus.id===t.id&&S.focus.day===today()&&S.focus.why?S.focus.why:'';
  let h=`<div class="row trow${open?'':cls}" data-task="${t.id}">${t.topic&&!feat?`<div class="tpx tc-${catKey(t.topic)}"><span>${esc(topicName(t.topic))}</span></div>`:''}
    <div class="swbg"><button class="sw-dup" data-dup="${t.id}">שכפול</button><button class="sw-del" data-del="${t.id}">מחיקה</button></div>
    <div class="sw">${feat?`<div class="fh"><span class="lg">${K.grid}</span><div class="f1"><b>${esc(topicName(t.topic)||'משימה')}</b><small>הדבר הבא לעשות</small></div>${!open&&S.todayCount>1?`<button class="swap" data-swap="${t.id}">החלף</button>`:''}</div>`:''}
      <div class="rr"><button class="ring" data-ck="${t.id}" aria-label="בוצע">${IC.check}</button>
      <div class="tx" data-tog="${t.id}"><div class="t1">${esc(t.text)}</div>${why&&!open?`<div class="why">${SPK}<span>${esc(why)}</span></div>`:''}</div>${feat?'':metaChips(t,showTopic)}</div>
      ${feat&&!open?`<div class="fa">${metaChips(t,false)}<button class="go" data-tog="${t.id}">פרטים ${K.arr}</button></div>`:''}
    </div></div>`;
  if(!open)return h;

- קנייה → מה בדיוק לקנות, מה לבדוק לפני, ואיפה כדאי לחפש (אין לך גישה לאינטרנט עכשיו — אל תמציא מחירים או קישורים).
- החלטה → סיכום קצר של האפשרויות והמלצה אחת.

החזר רק JSON: {"title":"2-4 מילים שמתארות מה הכנת, למשל: טיוטת וואטסאפ","body":"התוכן עצמו","next":"משפט אחד: מה נשאר לרן לעשות"}`;
  try{const r=await sample.json(prompt,{cache:false});delete S.advBusy[id];

${rows}
החזר רק JSON: {"id":"...","why":"..."}`;

  const rec=S.tasks.filter(t=>!active(t)&&((t.doneAt||t.droppedAt||0)>Date.now()-14*864e5)).map(t=>`${t.id} | ${t.text} | ${t.done?'בוצעה':'לא רלוונטית'}`).join('\n');

}
const RULES=`אתה העוזר של רן בתוך האתר "המשימות שלי" — רשימת המשימות האישית שלו (במאי, שותף בחברת ההפקות קינסט). רן מדבר איתך בעברית, לפעמים בהכתבה קולית לא מסודרת.
התפקיד: להבין מה השתנה ולהציע עדכונים לרשימה — לעדכן משימה קיימת לפי החלטה חדשה, לפצל, להוסיף משימות שחסרות, לדחות, לסמן כבוצעה או כלא רלוונטית, ולפתוח נושא חדש רק אם אין נושא מתאים.
כללים:
- משימה = פעולה אחת שאפשר לסמן עליה "בוצע", מנוסחת קצר בשם פועל ("להזמין...", "לבדוק..."). מחשבות ורקע הולכים ל"note".
- התאם למשימות הקיימות לפי ה-id שלהן. אל תמציא משימות שרן לא ביקש או שלא נובעות ישירות ממה שאמר.
- אם לא ברור למה הוא מתכוון — שאל שאלה אחת קצרה ב-reply והשאר ops ריק.
- reply: משפט או שניים בעברית פשוטה, בלי רשימות. אל תחזור על השינויים עצמם — הם מוצגים לו בנפרד.
- קטגוריות אפשריות לנושא חדש: ${CATS.join(' / ')}.
החזר רק JSON בצורה:
{"reply":"...","ops":[
 {"type":"add","text":"...","topic":"<id של נושא או key של נושא חדש>","day":"today|tomorrow|+3|YYYY-MM-DD|null","note":"..."},
 {"type":"update","id":"...","text":"(אופציונלי)","note":"(אופציונלי)","topic":"(אופציונלי)"},
 {"type":"postpone","id":"...","day":"tomorrow|+3|YYYY-MM-DD|null"},
 {"type":"done","id":"..."},
 {"type":"drop","id":"..."},
 {"type":"addTopic","key":"new1","name":"...","cat":"..."},
 {"type":"wait","id":"...","who":"למי או למה מחכים"},
 {"type":"step","id":"...","text":"צעד קצר"}
]}`;
function cleanOps(ops){
  if(!Array.isArray(ops))return [];
  const keys={};
  ops.forEach(o=>{if(o&&o.type==='addTopic'&&o.key&&o.name)keys[o.key]=String(o.name)});
  return ops.filter(o=>{if(!o||!OPICON[o.type])return false;
    if(o.type==='step'&&!o.text)return false;if(['update','postpone','done','drop','wait','step'].includes(o.type))return S.tasks.some(t=>t.id===o.id);
    if(o.type==='add'){if(!o.text)return false;if(o.topic&&!S.topics.some(t=>t.id===o.topic)){if(keys[o.topic])o._newTopicName=keys[o.topic];else o.topic=''}return true}
    if(o.type==='addTopic')return !!o.name;return false});
}

  const input=[{role:'user',content:RULES},...hist,{role:'user',content:`מצב הרשימה עכשיו:\n${dataBlock()}\n\nההודעה של רן:\n${msg}`}];

async function runOps(ops){
  const keyMap={};
  for(const o of ops.filter(o=>o.type==='addTopic'))keyMap[o.key]=await addTopic({name:String(o.name),cat:CATS.includes(o.cat)?o.cat:CATS[3]});
  for(const o of ops){
    const tp=o.topic?(keyMap[o.topic]||(S.topics.some(t=>t.id===o.topic)?o.topic:'')):undefined;
    if(o.type==='add')await addTask({text:String(o.text),topic:tp||'',day:resolveDay(o.day),note:String(o.note||'')});
    else if(o.type==='update'){const p={};if(o.text)p.text=String(o.text);if(o.note!=null&&o.note!=='')p.note=String(o.note);if(tp)p.topic=tp;if(Object.keys(p).length)await upd(o.id,p)}
    else if(o.type==='postpone')await upd(o.id,{day:resolveDay(o.day)});
    else if(o.type==='done')await upd(o.id,{done:true,doneAt:Date.now()});
    else if(o.type==='drop')await upd(o.id,{dropped:true,droppedAt:Date.now()});
    else if(o.type==='wait')await upd(o.id,{wait:{who:String(o.who||'משהו'),since:today()}});
    else if(o.type==='step'){const t=S.tasks.find(x=>x.id===o.id);if(t)await upd(o.id,{steps:[...(t.steps||[]),{text:String(o.text),done:false}]})}
  }
}

function viewRest(){

  let h=hdr('הכל',all.length===1?'משימה אחת בהמשך':all.length+' משימות בהמשך',`<button class="rb" data-tab="search" aria-label="חיפוש">${K2.srch}</button><button class="rb" data-tab="topics" aria-label="נושאים">${K.grid}</button>`)+segRow(true);
  const sortT=(a,b)=>((a.day||'')<(b.day||'')?-1:(a.day||'')>(b.day||'')?1:a.created-b.created);
  const G=[['מחר',t=>t.day===tm],['השבוע',t=>t.day&&t.day>tm&&t.day<=wk],['אחר כך',t=>t.day&&t.day>wk],['בלי זמן',t=>!t.day]];

}

async function syncNow(){
  if(S.syncing)return;S.syncing=1;render();
  try{await db.doc('requests/check').set({at:Date.now(),status:'new'})}catch(_){}
  let did=[];

<script type="text/keenest-app">
(function(){
  const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const CLOSE=/^\s*(ביטול|סגירה)\s*$/;
  function polish(box,root,close){
    if(!box||box.dataset.kd)return;box.dataset.kd=1;
    if(box.querySelector(".rhd,.bhd")){root.classList.add("kd");return}
    const h=[...box.children].find(c=>c.tagName==="H3");
    root.classList.add("kd");
    const bar=box.querySelector(".actions,.btns");
    const cancel=bar&&[...bar.querySelectorAll("button")].find(b=>CLOSE.test(b.textContent)&&!b.classList.contains("bp"));
    if(bar){if(bar.querySelector(".bp,.btn:not(.ghost):not(.danger)"))bar.classList.add("kd-hasp")}
    if(h){const hd=document.createElement("div");hd.className="kd-hd";const t=document.createElement("div");t.className="kd-t";
      h.replaceWith(hd);t.appendChild(h);const sub=hd.nextElementSibling;if(sub&&sub.matches("p.sub"))t.appendChild(sub);

      if(cancel){cancel.hidden=true;if(bar&&![...bar.children].some(c=>!c.hidden&&!c.matches(".spacer")))bar.hidden=true}}
  }

})();
