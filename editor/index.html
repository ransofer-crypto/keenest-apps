<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>עורך קינסט</title><link rel="manifest" href="manifest.webmanifest?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="עורך קינסט"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-180.png?v=1"><link rel="icon" type="image/png" href="icons/icon-192.png?v=1">
<style>:root{--bg:#F8F7F4;--ink:#00203F;--ink2:#4D5E73;--ink3:#8592A3;--trk:#E6E9EC;--sf:#FFFFFF;--line:rgb(0 32 63 / .1);
  --cy:#06B3E5;--fx:#FA1664;--navy:#00203F;--onnavy:#FFFFFF;--sh:0 2px 10px rgb(0 32 63 / .08);--toast:#FFF4C2;--toastink:#3B3000;
  --surface:#FFFFFF;--sel-bg:#00203F;--sel-fg:#FFFFFF;--red:#E5484D;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Heebo",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#03080F;--ink:#F2F5F8;--ink2:#A2ABB6;--ink3:#6F7A87;--trk:#18222F;--sf:#111B27;--line:rgb(255 255 255 / .1);--navy:#F2F5F8;--onnavy:#00203F;--sh:0 2px 10px rgb(0 0 0 / .4);--surface:#111B27;--sel-bg:#F2F5F8;--sel-fg:#00203F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#03080F;--ink:#F2F5F8;--ink2:#A2ABB6;--ink3:#6F7A87;--trk:#18222F;--sf:#111B27;--line:rgb(255 255 255 / .1);--navy:#F2F5F8;--onnavy:#00203F;--sh:0 2px 10px rgb(0 0 0 / .4);--surface:#111B27;--sel-bg:#F2F5F8;--sel-fg:#00203F;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;touch-action:manipulation}
body{font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;direction:rtl;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
svg{flex:none}
.app{max-width:560px;margin:0 auto;padding:0 18px 40px}
.tb{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.rb{width:44px;height:44px;border-radius:50%;background:var(--sf);box-shadow:var(--sh);display:grid;place-items:center;color:var(--ink);flex:none}
.rb svg{width:20px;height:20px}
.rb.ghost{visibility:hidden}
.logo{font-weight:800;font-size:24px;letter-spacing:-.03em;background:linear-gradient(90deg,#06B3E5 0%,#6A4FD8 55%,#FA1664 100%);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,#06B3E5,#00203F);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;box-shadow:var(--sh);flex:none}
.ttl{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;text-align:center}
#view{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.hd{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;margin:0}
.hd::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fx);flex:none}
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.sort{color:var(--cy);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;position:relative}
.sort svg{width:16px;height:16px}
.btn{height:50px;border-radius:16px;background:var(--navy);color:var(--onnavy);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;width:100%}
.btn svg{width:19px;height:19px}
.btn[disabled]{opacity:.45}
.btn2{height:44px;border-radius:999px;background:var(--sf);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:14px;padding-inline:16px;color:var(--ink)}
.btn2 svg{width:17px;height:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{height:44px;border-radius:999px;background:var(--sf);box-shadow:var(--sh);display:flex;align-items:center;gap:8px;padding-inline:16px;color:var(--ink3)}
.search svg{width:18px;height:18px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:15px}
.t1{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrapt{white-space:normal}
.muted{color:var(--ink2)}
.title{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:0}
.hr{height:1px;background:var(--line)}
.empty{color:var(--ink2);text-align:center;padding:28px 10px;font-size:14.5px}

/* editor status */
.mac{display:flex;align-items:center;gap:10px}
.mac .dot{width:9px;height:9px;border-radius:50%;background:var(--ink3);flex:none}
.mac.on .dot{background:var(--cy);animation:pl 2.2s cubic-bezier(.22,1,.36,1) infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgb(6 179 229 / .45)}70%{box-shadow:0 0 0 8px rgb(6 179 229 / 0)}100%{box-shadow:0 0 0 0 rgb(6 179 229 / 0)}}
.bar{height:4px;border-radius:4px;background:var(--trk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--navy);transition:width .6s cubic-bezier(.22,1,.36,1)}

/* rows */
.list{display:flex;flex-direction:column}
.sw{position:relative;overflow:hidden;border-radius:12px}
.sw .act{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding-inline:6px}
.sw .act.l{left:0}.sw .act.r{right:0}
.sw .act button{height:44px;padding-inline:16px;border-radius:999px;color:#fff;font-weight:700;font-size:14px;min-width:84px}
.sw .act .del{background:var(--red)}
.sw .act .dup{background:var(--cy)}
.it{display:flex;align-items:center;gap:12px;min-width:0;padding-block:9px;background:var(--bg);position:relative;width:100%;text-align:start}
.it .tx{flex:1;min-width:0}
.th{width:76px;height:46px;border-radius:10px;flex:none;position:relative;overflow:hidden;background-size:cover;background-position:center}
.th .d{position:absolute;bottom:3px;left:4px;font-size:10.5px;font-weight:600;color:#fff;background:rgb(0 0 0 / .45);border-radius:5px;padding:0 4px;direction:ltr}
.ring{width:30px;height:30px;flex:none}
.tag{font-size:12.5px;font-weight:650;white-space:nowrap;flex:none}
.tag.good{color:var(--cy)}.tag.maybe,.tag.weak{color:var(--ink3)}.tag.cover,.tag.warn{color:var(--fx)}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--trk);border-radius:999px;padding:3px;position:relative}
.seg>button{text-align:center;font-size:14px;font-weight:600;color:var(--ink2);height:38px;border-radius:999px;position:relative;z-index:1}
.seg>button[aria-pressed="true"]{color:var(--ink);background:var(--sf);box-shadow:0 2px 8px rgb(0 32 63 / .12)}
.filters{display:flex;gap:18px;font-size:14px;color:var(--ink3);font-weight:600;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button[aria-pressed="true"]{color:var(--ink)}

/* new project form */
.fld{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid var(--line)}
.fld .k{color:var(--ink2);font-size:14.5px;flex:none}
.fld input{border:0;background:none;outline:none;text-align:left;font-weight:600;font-size:15px;flex:1;min-width:0;direction:rtl;text-align:end}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:999px;background:var(--trk);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--onnavy)}
.src{display:flex;align-items:center;gap:12px;padding-block:7px;width:100%;text-align:start}
.src .ic{width:44px;height:44px;border-radius:12px;background:var(--trk);display:grid;place-items:center;flex:none;color:var(--ink)}
.src .ic svg{width:21px;height:21px}
.src[aria-pressed="true"] .ic{background:var(--navy);color:var(--onnavy)}
.src .ck{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--ink3);flex:none;display:grid;place-items:center;color:#fff}
.src[aria-pressed="true"] .ck{border-color:var(--cy);background:var(--cy)}
.src .ck svg{width:14px;height:14px}
.ta{border:0;outline:none;width:100%;min-height:96px;border-radius:16px;background:var(--sf);box-shadow:var(--sh);padding:12px 14px;font-size:15px;line-height:1.55;resize:vertical}
.lbl{font-size:13px;color:var(--ink2);font-weight:600}

/* materials */
.ask{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600;width:100%;text-align:start;padding-block:4px}
.ask .n{min-width:22px;height:22px;border-radius:999px;background:var(--fx);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding-inline:6px}
.ask .go2{margin-right:auto;color:var(--cy);font-size:13.5px}
.scn{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-bottom:1px solid var(--line);width:100%;text-align:start;background:var(--bg)}
.scn:last-child{border-bottom:0}
.scn .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.scn .nm{font-weight:700;font-size:15.5px}
.scn .ct{font-size:13px;color:var(--ink2);white-space:nowrap}
.scn .ct b{color:var(--cy);font-weight:700}
.fs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.fs div{aspect-ratio:16/10;border-radius:6px;position:relative;background-size:cover;background-position:center}
.fs div.x{opacity:.35}
.fs div.p::after{content:attr(data-n);position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;background:rgb(0 32 63 / .55);border-radius:6px}

/* player & clip */
.player{border-radius:16px;aspect-ratio:16/9;position:relative;overflow:hidden;background-size:cover;background-position:center;flex:none}
.player video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.player .pl{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:rgb(255 255 255 / .9);display:grid;place-items:center;color:#00203F}
.player .pl svg{width:22px;height:22px;margin-right:-2px}
.player .tc{position:absolute;bottom:8px;right:10px;font-size:12px;font-weight:600;color:#fff;direction:ltr}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.strip div{aspect-ratio:16/10;border-radius:7px;background-size:cover;background-position:center}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;font-size:14px}
.checks div{display:flex;align-items:center;gap:7px}
.checks svg{width:16px;height:16px}
.checks .ok svg{color:var(--cy)}
.checks .bad{color:var(--fx)}
.why{font-size:14px;color:var(--ink2);line-height:1.55}
.why b{color:var(--ink);font-weight:650}

/* transcript */
.mini-head{display:flex;align-items:center;gap:12px}
.mini-head .th{width:66px;height:40px}
.wave{height:46px;display:flex;align-items:center;gap:2px;direction:ltr}
.wave i{flex:1;border-radius:2px;background:var(--ink3);opacity:.45}
.wave i.on{background:var(--cy);opacity:1}
.lgd{display:flex;gap:16px;font-size:12.5px;color:var(--ink2)}
.lgd span{display:flex;align-items:center;gap:6px}
.lgd i{width:11px;height:6px;border-radius:2px;display:block}
.tr{font-size:15px;line-height:1.75}
.tr button{display:inline;text-align:start;font-size:15px;line-height:1.75;border-radius:4px}
.s-in{color:var(--ink)}
.s-out{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgb(133 146 163 / .55)}
.s-hl{background:linear-gradient(transparent 58%,rgb(250 22 100 / .2) 58%)}
.clipblk{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.clipblk:last-child{border-bottom:0}
.dock{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;align-items:center;justify-content:space-between;padding:6px 6px 6px 16px;padding-inline-start:16px;border-radius:999px;background:var(--sf);box-shadow:0 6px 24px rgb(0 32 63 / .14);font-size:14px;z-index:5}
.dock .go{height:40px;border-radius:999px;background:var(--navy);color:var(--onnavy);font-weight:700;display:flex;align-items:center;padding-inline:16px;gap:6px}
.dock .go svg{width:15px;height:15px}

/* cut / notes / export */
.cut{display:flex;gap:12px;align-items:center;padding-block:6px}
.cut .n{width:20px;color:var(--ink3);font-weight:700;font-size:13px;flex:none;text-align:center}
.cut .th{width:60px;height:36px;border-radius:8px}
.cut .tx{flex:1;min-width:0}
.tm{color:var(--ink3);font-size:12.5px;direction:ltr;font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.note{display:flex;gap:12px;font-size:14.5px;align-items:baseline;padding-block:5px}
.note .tm{color:var(--cy);font-weight:650;font-size:14px;flex:none;min-width:34px}
.note .x{flex:1}
.note.done .x{color:var(--ink3);text-decoration:line-through}
.inp{height:46px;border-radius:999px;background:var(--sf);box-shadow:var(--sh);display:flex;align-items:center;padding-inline:16px 6px;gap:8px}
.inp .tmb{color:var(--cy);font-weight:650;font-size:14px;direction:ltr;flex:none}
.inp input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:15px}
.inp .send{width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--onnavy);display:grid;place-items:center;flex:none}
.inp .send svg{width:16px;height:16px}
.vers{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.vers::-webkit-scrollbar{display:none}
.exp{display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);width:100%;text-align:start;background:var(--bg)}
.exp>svg{width:23px;height:23px}
.exp .tx{flex:1;min-width:0}
.exp .st{font-size:13px;font-weight:650;color:var(--cy);white-space:nowrap}
.exp .st.w{color:var(--ink3)}

/* popups */
#layer .scrim{position:fixed;inset:0;background:rgb(0 10 25 / .38);z-index:50}
.pop{position:fixed;z-index:51;width:min(440px,calc(100vw - 28px));max-height:calc(100vh - 60px);overflow:auto;border-radius:24px;background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgb(0 10 25 / .28)}
.pop h3{margin:0;font-size:17px;font-weight:800}
.pop .btns{display:flex;flex-direction:column;gap:8px}
.bp{height:46px;border-radius:999px;background:var(--sel-bg);color:var(--sel-fg);font-weight:700;font-size:15px}
.bs{height:44px;border-radius:999px;background:var(--trk);font-weight:600}
.bred{height:46px;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:15px}
.bred.link{background:none;color:var(--red);height:auto;padding:4px 10px;font-size:14px;align-self:center}
.qopt{display:flex;flex-wrap:wrap;gap:8px}
.q{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0;padding-bottom:0}
.srt-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:var(--surface);border-radius:16px;box-shadow:0 12px 36px rgb(0 10 25 / .2);padding:6px;min-width:150px;display:flex;flex-direction:column}
.srt-menu button{height:42px;padding-inline:14px;text-align:start;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--ink)}
.srt-menu button[aria-pressed="true"]{color:var(--cy)}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:60;background:var(--toast);color:var(--toastink);border-radius:999px;padding:10px 18px;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:16px;box-shadow:0 8px 24px rgb(0 10 25 / .18);white-space:nowrap}
.toast button{color:#0A6E92;font-weight:800}
.note-off{font-size:13px;color:var(--ink2);text-align:center}

.cut .tm{text-align:right}

.lenin{display:flex;align-items:center;gap:10px;height:46px;border-radius:999px;background:var(--sf);box-shadow:var(--sh);padding-inline:16px}
.lenin input{border:0;background:none;outline:none;font-size:18px;font-weight:700;width:70px;direction:ltr;text-align:right}
.lenin span{color:var(--ink3);font-size:13px}
.ref{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);background:var(--bg)}
.ref:last-child{border-bottom:0}
.refb{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding-block:10px;text-align:start}
.ref .ic,.nref .ic{width:42px;height:42px;border-radius:12px;background:var(--trk);display:grid;place-items:center;flex:none;color:var(--ink)}
.ref .ic svg{width:21px;height:21px}
.ref .tx{flex:1;min-width:0}
.ref .take{font-size:12.5px;color:var(--cy);font-weight:650;white-space:nowrap}
.rx{width:32px;height:32px;display:grid;place-items:center;color:var(--ink3);flex:none}
.rx svg{width:15px;height:15px}
.srcs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srcs button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 14px;border-radius:16px;background:var(--trk);font-size:14px}
.srcs button svg{width:22px;height:22px}
.srcs button[aria-pressed="true"]{background:var(--navy);color:var(--onnavy)}
.field{height:46px;border-radius:14px;background:var(--trk);display:flex;align-items:center;padding-inline:14px;gap:10px}
.field input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:15px}
.field.tmf input{flex:0 0 70px;direction:ltr;text-align:right;font-weight:700}
.field.tmf span{color:var(--ink3);font-size:13px}
.filepick{cursor:pointer;color:var(--cy);font-weight:650}
.filepick input{display:none}
.inp .att{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);flex:none;margin-inline-start:-8px}
.inp .att svg{width:19px;height:19px}
.nref{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-top:4px;text-align:start}
.nref .ic{width:26px;height:26px;border-radius:7px}
.nref .ic svg{width:15px;height:15px}
.nref.on{background:var(--sf);box-shadow:var(--sh);border-radius:999px;padding:5px 12px 5px 6px}
.nref.on .x{flex:1;color:var(--ink);font-weight:600}
.nref.on button{width:26px;height:26px;display:grid;place-items:center;color:var(--ink3)}
.nref.on button svg{width:14px;height:14px}
.seg>button{font-size:13.5px}

/* iOS: no zoom on focus */
input,textarea,select,.search input,.inp input,.field input,.fld input,.ta{font-size:16px!important}
.lenin input,.field.tmf input{font-size:18px!important}
*{touch-action:manipulation}

.fld input{text-align:right!important;direction:rtl;font-weight:600}
.fld input::placeholder{color:var(--ink2);font-weight:400}
.bsum{display:flex;flex-direction:column;gap:10px}
.pts{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:5px;font-size:15px;line-height:1.5}
.qs{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--fx)}
.okd{display:flex;align-items:center;gap:5px;color:var(--cy);font-size:13.5px;font-weight:650}
.okd svg{width:15px;height:15px}
.inp{height:46px}.inp .send{width:34px;height:34px}

.qlist{display:flex;flex-direction:column;gap:12px}
.qa{display:flex;flex-direction:column;gap:6px}
.qa .qt{font-size:14.5px;color:var(--fx);font-weight:600}
.inp input{border:0;background:none;outline:none;flex:1;min-width:0}

.rw{font-size:11.5px;font-weight:650;color:var(--cy);margin-inline-start:4px}

.s-sug{text-decoration:underline dashed var(--fx);text-decoration-thickness:1.5px;text-underline-offset:5px}
.lgd i.dsh{background:none;border-bottom:2px dashed var(--fx);border-radius:0;height:4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px;border-radius:16px;background:var(--trk);color:var(--ink);font-size:15px;text-align:start;transition:background .3s cubic-bezier(.22,1,.36,1),color .3s cubic-bezier(.22,1,.36,1)}
.opt i{width:12px;height:12px;border-radius:50%;flex:none}
.opt b{font-weight:650}
.opt span{font-size:12.5px;color:var(--ink2);margin-inline-start:auto}
.opt[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg)}
.opt[aria-pressed="true"] span{color:var(--sel-fg);opacity:.7}
.cut{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:14px;transition:box-shadow .25s,background .25s,transform .25s cubic-bezier(.22,1,.36,1)}
.cut .grip{width:22px;height:22px;color:var(--ink3);flex:none;display:grid;place-items:center}
.cut .grip svg{width:18px;height:18px}
.cut.lift{background:var(--sf);box-shadow:0 10px 30px rgb(0 32 63 / .18);transform:scale(1.02);position:relative;z-index:3}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;border-radius:18px;background:var(--trk)}
.stage button{padding:8px 12px;border-radius:15px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;color:var(--ink);text-align:start}
.stage button b{font-size:14px;font-weight:700}
.stage button span{font-size:11.5px;color:var(--ink2)}
.stage button[aria-pressed="true"]{background:var(--sf);box-shadow:0 2px 8px rgb(0 32 63 / .12)}
.stage button.lk{color:var(--ink3)}
.stage button.lk span{color:var(--ink3)}
.lockbar{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 6px 6px 14px;padding-inline-start:14px;border-radius:16px;background:rgb(6 179 229 / .1);font-size:13.5px}
.lockbar svg{width:18px;height:18px;color:var(--cy);flex:none}
.lockbar span{flex:1}
.lockbar button{height:36px;border-radius:999px;padding-inline:14px;background:var(--sf);font-weight:650;font-size:13px;color:var(--ink)}
.lyr{display:flex;align-items:center;gap:12px;padding-block:9px;border-bottom:1px solid var(--line);font-size:14.5px}
.lyr:last-child{border-bottom:0}
.lyr b{flex:1;font-weight:600}
.lyr span{font-size:12.5px;color:var(--ink2)}

.cut{cursor:pointer}
.cut.playing{background:rgb(6 179 229 / .1)}
.cut.playing .n{color:var(--cy)}

.take{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/9;flex:none}
.take video{width:100%;height:100%;display:block;object-fit:contain}
.take .again{position:absolute;inset-inline-start:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:rgb(0 0 0 / .55);color:#fff;display:grid;place-items:center}
.take .again svg{width:18px;height:18px}

.bstat{display:flex;flex-direction:column;gap:6px;font-size:14px}
.bs1{display:flex;align-items:center;gap:10px;justify-content:space-between}
.bstat .bar{height:6px;border-radius:999px;background:var(--trk);overflow:hidden}
.bstat .bar i{display:block;height:100%;background:var(--cy);border-radius:999px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.bstat .muted{font-size:12.5px}

var swiped=false;
(function(){var sx,sy,row,dx,open=null;
  function close(r){if(!r)return;r.style.transition='transform .42s var(--ios-move)';r.style.transform='';}
  document.addEventListener('touchstart',function(e){var b=e.target.closest('[data-sw]');swiped=false;if(!b){if(open&&!e.target.closest('.act')){close(open);open=null}return}
    if(open&&open!==b){close(open);open=null}row=b;sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=null;row.style.transition='none'},{passive:true});
  document.addEventListener('touchmove',function(e){if(!row)return;var x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
    if(dx===null){if(Math.abs(x)<8&&Math.abs(y)<8)return;if(Math.abs(y)>Math.abs(x)){row=null;return}dx=0}
    dx=Math.max(-110,Math.min(110,x));swiped=true;row.style.transform='translateX('+dx+'px)'},{passive:true});
  document.addEventListener('touchend',function(){if(!row)return;var r=row;row=null;r.style.transition='transform .42s var(--ios-move)';
    if(dx>60){r.style.transform='translateX(100px)';open=r}else if(dx<-60){r.style.transform='translateX(-100px)';open=r}else{r.style.transform='';open=null}
    setTimeout(function(){swiped=false},60)});
})();

.kxwash{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden;background:radial-gradient(60% 34% at 10% 6%,var(--g3),transparent 70%)}
.kxwash::before,.kxwash::after{content:"";position:absolute;border-radius:50%;filter:blur(48px)}
.kxwash::before{width:95%;height:42%;top:-12%;right:-30%;background:radial-gradient(circle,var(--g1),transparent 66%)}
.kxwash::after{width:90%;height:42%;top:16%;left:-40%;background:radial-gradient(circle,var(--g2),transparent 66%)}
html,body{background:var(--bg)}body{background:transparent!important}.tb{background:transparent!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.hb2{display:flex;align-items:center;gap:10px;min-height:44px}
.hb2 .hbl{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.hb2 .mark{height:40px;width:auto;display:block;flex:none}
.hb2 .kxt{font-size:21px;font-weight:700;letter-spacing:-.2px;line-height:1.15;color:var(--ink)}
.hb2 .kxs{font-size:12.5px;font-weight:500}
.hb2 .kxs{color:var(--ink2)}.tb.hb2wrap{justify-content:flex-start}
