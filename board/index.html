<script>
(()=>{const K="keenest.theme";const root=document.documentElement;
const SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const mq=matchMedia("(prefers-color-scheme: dark)");
const eff=()=>root.getAttribute("data-theme")||(mq.matches?"dark":"light");
const upd=()=>{const b=document.getElementById("themeBtn");if(!b)return;const d=eff()==="dark";b.innerHTML=d?SUN:MOON;b.setAttribute("aria-label",d?"מעבר למצב בהיר":"מעבר למצב כהה");b.title=d?"מצב בהיר":"מצב כהה"};
try{const v=localStorage.getItem(K);if(v==="dark"||v==="light")root.setAttribute("data-theme",v)}catch(e){}
window.toggleTheme=()=>{const n=eff()==="dark"?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem(K,n)}catch(e){}upd()};
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",upd);else setTimeout(upd,0);
mq.addEventListener?.("change",upd);})();
</script>
<script>
/* block pinch / double-tap zoom */
(()=>{const stop=e=>{e.preventDefault()};["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,stop,{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
let last=0;document.addEventListener("touchend",e=>{const now=Date.now();if(now-last<300&&!e.target.closest("input,textarea,select"))e.preventDefault();last=now},{passive:false});})();
</script>
<script type="text/keenest-app">
const PEOPLE=["רן סופר","צפריר אלבז","עדי אברהם"];
const AV={"רן סופר":["ר","r"],"צפריר אלבז":["צ","z"],"עדי אברהם":["ע","a"]};
const T_ST=["לא התחלתי","בתהליך","הושלם"];
const P_ST=["לא התחיל","בתהליך","הושלם"];
const PAY=["צריך לבקש מקדמה","צריך להוציא דרישה","יצאה דרישת תשלום","צריך להוציא חשבונית","יצאה חשבונית מס","פרוייקט סגור"];
const CREDIT=["","מיידי","שוטף 30","שוטף 45","שוטף 60","שוטף 75","שוטף 90"];
const S={people:{},projects:{},tasks:{},fin:{},suppliers:{},loaded:{p:false,t:false},admin:false,canWrite:true,db:null,tab:"tasks",
  f:{tWho:"",pQ:"",mtab:"in"},open:{}};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtD=s=>{if(!s)return"";const[y,m,d]=s.slice(0,10).split("-");return d+"/"+m+(y!==String(new Date().getFullYear())?"/"+y.slice(2):"")};
const money=n=>(n==null||n==="")?"—":"₪"+Math.round(+n).toLocaleString("he-IL");
const toast=(m,undo)=>{document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;if(undo){const b=document.createElement("button");b.textContent="ביטול";b.className="undo";b.onclick=()=>{t.remove();undo()};t.appendChild(b)}document.body.appendChild(t);setTimeout(()=>t.remove(),undo?6000:1800)};

/* ---------- tabs ---------- */
function tabs(){const list=[["tasks","עריכות"]];if(S.admin)list.push(["mtasks","משימות"]);list.push(["projects","פרויקטים"]);return list}
let pillAt=null;
function renderTabs(){const nav=$("#tabs");nav.innerHTML=`<span class="tabpill" aria-hidden="true"></span>`+tabs().map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${ICONS[k]||""}<span>${l}</span></button>`).join("");placePill()}
function placePill(){const nav=$("#tabs"),pill=nav&&nav.querySelector(".tabpill"),on=nav&&nav.querySelector('[aria-selected="true"]');if(!pill||!on)return;
  const to={l:on.offsetLeft,w:on.offsetWidth};if(!to.w)return;
  if(pillAt&&!matchMedia("(prefers-reduced-motion: reduce)").matches){pill.style.transition="none";pill.style.transform=`translateX(${pillAt.l}px)`;pill.style.width=pillAt.w+"px";void pill.offsetWidth;pill.style.transition=""}
  pill.style.transform=`translateX(${to.l}px)`;pill.style.width=to.w+"px";pillAt=to}
addEventListener("resize",()=>{pillAt=null;placePill()});
/* the tab bar changes width when the + button shows or hides: keep the pill on its tab */
if(window.ResizeObserver)new ResizeObserver(()=>{pillAt=null;placePill()}).observe($("#tabs"));$("#tabs").addEventListener("transitionend",e=>{if(e.target.id==="tabs"){pillAt=null;placePill()}});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;S.projView=null;S.tab=b.dataset.tab;ls.set("kinst.tab",S.tab);try{history.replaceState(null,"","#"+S.tab)}catch(_){}renderTabs();render()});

function vIn(){

  try{await S.db.doc(path).set(data);return true}
  catch(err){if(err&&err.code==="invalid_argument"){S.canWrite=false;render();toast("אין הרשאה לשמור")}else if(err&&err.code==="quota_exceeded")toast("המאגר מלא – צריך למחוק פריטים ישנים");else toast("השמירה נכשלה, נסו שוב");return false}}

async function setTaskStatus(id,n){if(!S.canWrite)return;const t=S.tasks[id];if(!t||t.status===n)return;

async function setTaskCombo(id,v){if(!S.canWrite)return;const t=S.tasks[id];if(!t||comboOf(t)===v)return;
  const patch=v==="לא התחלנו"||v==="לא בוצע"?{status:"לא התחלתי"}:v==="בטיפול"?{status:"בתהליך"}:v==="אצלנו"?{status:"בתהליך",waitingOn:"קינסט"}:v==="אצל הלקוח"?{status:"בתהליך",waitingOn:"לקוח"}:{status:"הושלם"};
  const nt={...t,...patch,completedAt:patch.status==="הושלם"?new Date().toISOString():null,updatedAt:new Date().toISOString()};if(v==="אצל הלקוח")nt.clientSince=new Date().toISOString();

  if(c==="selection_required")return "יש יותר מחיבור נושן אחד. צריך לבחור אחד בחלון שקופץ.";
  if(c==="blocked_by_policy")return "הארגון חוסם את הגישה לנושן מהאתר.";

async function nCall(tool,input){const r=await S.mcp.callTool(NOTION,tool,input,{cache:false});let p=r&&r.payload;

  const rows=p&&(p.results||(p.data&&p.data.results));if(!Array.isArray(rows))throw {code:"bad_shape",message:"תשובה לא צפויה"};return {rows,more:!!(p.has_more)}}

async function nCreate(ds,props,titleKey,url,cols,extra){
  const known=new Set([...Object.keys(S.projects),...Object.keys(S.suppliers),N_PROJ_DS.replace(/-/g,""),N_SUP_DS.replace(/-/g,""),...(extra||[])]);
  const res=await nCall(NT.c,{parent:{type:"data_source_id",data_source_id:ds},pages:[{properties:props}],allow_async:false});
  const ids=[...new Set((JSON.stringify(res||"").match(/[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}/g)||[]).map(x=>x.replace(/-/g,"")))].filter(x=>!known.has(x));
  if(ids.length===1)return ids[0];
  const {rows}=await nQuery(url,cols);
  const c=rows.map(r=>({id:pageId(r.url),t:r[titleKey],at:String(r.createdTime||"")})).filter(r=>r.id&&!known.has(r.id)&&r.t===props[titleKey]).sort((a,b)=>b.at.localeCompare(a.at));
  if(!c.length)throw {code:"bad_shape",message:"הדף נוצר אבל לא מצאתי אותו"};return c[0].id}

  for(const x of Object.values(S.suppliers)){if(x.projectId===oldId){await write("suppliers/"+x.id,strip({...x,projectId:newId}));if(isNid(x.id))await nUpdate(x.id,{"פרויקטים":[newId]})}}
  await del("projects/"+oldId);await del("fin/"+oldId)}
async function saveProjectNotion(pid,data,fd){
  if(isNid(pid)){await nUpdate(pid,projProps(data,fd));return pid}
  return await nCreate(N_PROJ_DS,projProps(data,fd),"שם הפרויקט",N_PROJ,PCOLS)}

async function backupTasks(){if(!S.admin||!notionReady()||!S.loaded.t||!S.loaded.m||!S.loaded.y)return;if(bkRun){bkAgain=true;return}bkRun=true;

  try{
    for(const t of Object.values(S.tasks)){const M=isM(t.id);const props=taskProps(t,M);const sig=JSON.stringify(props);
      let nid=t.nid||(!M&&isNid(t.id)?t.id:"");if(nid&&t.nsig===sig&&t.nid)continue;
      const mk=()=>nCreate(M?N_MT_DS:N_T_DS,props,"המשימה","collection://"+(M?N_MT_DS:N_T_DS),`url, createdTime, "המשימה"`,[...allN(),N_T_DS.replace(/-/g,""),N_MT_DS.replace(/-/g,"")]);
      try{if(nid){try{await nUpdate(nid,props)}catch(e){if(e&&["server_not_connected","needs_reauth","approval_required","consent_required","not_in_manifest","blocked_by_policy"].includes(e.code))throw e;nid=await mk()}}else nid=await mk()}
      catch(e){if(e&&e.code&&e.code!=="bad_shape")throw e;console.warn("backup task",t.id,e);continue}
      const cur=S.tasks[t.id];if(!cur)continue;cur.nid=nid;cur.nsig=sig;await write(tpath(t.id),{...strip(cur),nid,nsig:sig})}
    const live=new Set(allN());const prev=((S.sync||{}).ntasks||{}).nids||[];
    for(const n of prev){if(!live.has(n)){try{await nTrash(n)}catch(_){}}}
    if(JSON.stringify([...live].sort())!==JSON.stringify([...prev].sort()))await write("sync/ntasks",{nids:[...live],at:new Date().toISOString()});

async function notionSync(){
  if(!S.admin||!S.mcp||S.notion.state==="loading")return;
  S.notion={...S.notion,state:"loading"};render();
  try{
    const [pq,sq]=await Promise.all([nQuery(N_PROJ,PCOLS),nQuery(N_SUP,SCOLS)]);
    const NP={},NS={};pq.rows.forEach(r=>{const x=mapNP(r);if(x.id)NP[x.id]=x});sq.rows.forEach(r=>{const x=mapNS(r);if(x.id)NS[x.id]=x});
    if(!S.canWrite){S.notion={state:"ok",msg:"",at:Date.now()};render();return}
    // פרויקטים
    for(const x of Object.values(NP)){const p=S.projects[x.id];
      if(!p){await write("projects/"+x.id,{name:x.name,status:x.status,endDate:x.endDate,notes:"",createdAt:x.createdAt||new Date().toISOString()});
        if((x.createdAt||"")>="2026-11-15T19:00"&&!allTasksOf(x.id).length)await addEdit(x.id,"סרטון 1")}
      else{if(p.name!==x.name||(p.endDate||"")!==x.endDate)await write("projects/"+x.id,strip({...p,name:x.name,endDate:x.endDate}));
        if(p.status&&p.status!==x.status)await nUpdate(x.id,{"סטטוס":p.status})}
      const nf=finOf(x);if(!same(finOf(S.fin[x.id]||{}),nf))await write("fin/"+x.id,nf)}
    for(const p of Object.values(S.projects)){if(NP[p.id])continue;
      if(isNid(p.id)){if(!pq.more){await del("projects/"+p.id);await del("fin/"+p.id)}}
      else{const nid=await saveProjectNotion(p.id,p,finOf(S.fin[p.id]||{}));await write("projects/"+nid,strip(p));await write("fin/"+nid,finOf(S.fin[p.id]||{}));await rekeyProject(p.id,nid)}}
    // ספקים
    for(const x of Object.values(NS)){const s=S.suppliers[x.id];
      if(!s||!same(supOf(s),supOf(x)))await write("suppliers/"+x.id,{...(s?strip(s):{}),...supOf(x),createdAt:(s&&s.createdAt)||x.createdAt})}
    for(const s of Object.values(S.suppliers)){if(NS[s.id])continue;
      if(isNid(s.id)){if(!sq.more)await del("suppliers/"+s.id)}
      else{const nid=await saveSupplierNotion(s.id,s);await write("suppliers/"+nid,strip(s));await del("suppliers/"+s.id)}}
    // משימות שנפתחו מהפעמון באתרים האחרים (תסריטים, הצעות…) – נכנסות ל"משימות"
    try{const mrec=(r,n,nid)=>{const who=PEOPLE.find(p=>n.includes(p));return {title:r["המשימה"]||r.title||"תזכורת",status:"לא התחלתי",owners:who?[who]:[],notes:"",due:String(r["date:תאריך יעד:start"]||r.due||"").slice(0,10),createdAt:String(r.createdTime||r.createdAt||"").replace(" ","T")||new Date().toISOString(),...(nid?{nid}:{})}};
      // שתיים שכבר נכנסו בטעות לעריכות – עוברות למשימות
      for(const t of Object.values(S.tasks)){if(isM(t.id)||!String(t.notes||"").startsWith("נוצר מאתר"))continue;
        const k=String(t.id);if(await write("mtasks/"+k,{...mrec(t,String(t.notes)),status:t.status||"לא התחלתי",owners:t.owners||[]}))await del("tasks/"+k)}
      for(const t of Object.values(S.tasks)){if(isM(t.id)&&String(t.notes||"").startsWith("נוצר מאתר"))await write(tpath(t.id),strip({...t,notes:""}))}
      const known=new Set(Object.values(S.tasks).flatMap(t=>[t.nid,String(t.id).replace(/^m:/,"")]).filter(Boolean));
      for(const ds of [N_MT_DS,N_T_DS]){const tu="collection://"+ds;
        const tp=await nCall(NT.q,{data:{data_source_urls:[tu],query:`SELECT url, createdTime, "המשימה", "הערות", "date:תאריך יעד:start" FROM "${tu}" WHERE "הערות" LIKE 'נוצר מאתר%' ORDER BY createdTime DESC LIMIT 100`}});
        const rows=(tp&&(tp.results||(tp.data&&tp.data.results)))||[];
        for(const r of rows){const id=pageId(r.url);if(!id||known.has(id))continue;known.add(id);
          const legacy=ds===N_T_DS;if(await write("mtasks/"+id,mrec(r,String(r["הערות"]||""),legacy?null:id))&&legacy){try{await nTrash(id)}catch(_){}}}}
    }catch(e){console.warn("bell tasks",e)}
    S.notion={state:"ok",msg:"",at:Date.now()};scheduleBackup();
  }catch(e){S.notion={state:"error",msg:nErr(e),code:e&&e.code,at:S.notion.at}}
  render()}

    ${ppl.map(item).join("")}</div>`,el=>{el.querySelectorAll("[data-wclose]").forEach(a=>a.addEventListener("click",()=>setTimeout(closeSheet,300)))})}
function waAsk(id,person){const u=waUrl(id,person);if(u){const w=window.open(u,"_blank","noopener");if(!w)location.href=u;return}
  phoneSheet(id,person)}
function phoneSheet(id,person){const first=person.split(" ")[0];
  openSheet(`<h3>המספר של ${esc(first)}</h3><div class="hint">צריך להכניס פעם אחת. אחר כך לחיצה על העיגול של ${esc(first)} תפתח וואטסאפ עם שאלה על הסטטוס.</div>
    <div class="fld"><input id="ph" type="tel" inputmode="tel" placeholder="050-0000000" value="${esc((S.people[pk(person)]||{}).phone||"")}"></div>
    <div class="actions" id="phAct"><button class="btn" id="ph_save">שמירה</button><div class="spacer"></div><button class="btn ghost" id="ph_x">ביטול</button></div>`,el=>{

function remindSheet(id){const t=S.tasks[id];if(!t)return;const p=x=>String(x).padStart(2,"0");const loc=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  const in3=()=>{const d=new Date();d.setHours(d.getHours()+3);d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0);return loc(d)};
  const tom=()=>{const d=new Date();d.setDate(d.getDate()+1);d.setHours(10,0,0,0);return loc(d)};
  const mr=myRem(t)||{};let mode=mr.at?"other":"tom";
  openSheet(`<div class="rhd"><span class="rbi">${ICONS.bell}</span><div class="rm"><b>תזכורת</b><small>${esc(t.title||"")}</small></div><button type="button" class="rxx" id="r_x" aria-label="סגירה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="rq"><button type="button" data-rq="h3">בעוד 3 שעות</button><button type="button" data-rq="tom">מחר 10:00</button><button type="button" data-rq="other">תאריך אחר</button></div>

    el.classList.add("rsheet");const at=el.querySelector("#r_at");
    const paint=()=>{el.querySelectorAll("[data-rq]").forEach(b=>b.classList.toggle("on",b.dataset.rq===mode));at.hidden=mode!=="other"};paint();
    el.querySelectorAll("[data-rq]").forEach(b=>b.onclick=()=>{mode=b.dataset.rq;paint();if(mode==="other")at.focus()});
    el.querySelector("#r_x")?.addEventListener("click",closeSheet);
    const go=async v=>{el.querySelectorAll("button").forEach(b=>b.disabled=true);const data={...strip(t)};let msg="",ev=null;
      try{ev=await calSync(mr,v,data)}catch(e){msg=calErr(e);if(v){el.querySelectorAll("button").forEach(b=>b.disabled=false);toast(msg);return}}
      setMyRem(data,v,ev);
      if(await write(tpath(id),data)){closeSheet();toast(msg||(v?"נוסף ליומן":"התזכורת נמחקה"))}else el.querySelectorAll("button").forEach(b=>b.disabled=false)};
    el.querySelector("#r_save").onclick=()=>{const v=mode==="h3"?in3():mode==="tom"?tom():at.value;if(!v)return;if(new Date(v).getTime()<Date.now()){toast("הזמן שבחרת כבר עבר");return}go(v)};
    el.querySelector("#r_del")?.addEventListener("click",()=>go(""))})}
async function calRemove(t){const ev=t&&(myRem(t)||{}).event;if(!ev||!ev.id||!S.mcp)return;
  try{await S.mcp.callTool(GCAL,"delete_event",{eventId:ev.id,notificationLevel:"NONE"},{cache:false})}catch(_){}}

(function(){const h=(location.hash||"").slice(1);S.tab=h||ls.get("kinst.tab","tasks");S.f.tWho=ls.get("kinst.who","");S.f.tSt=ls.get("kinst.tst","");S.f.tSort=ls.get("kinst.tSort","");S.f.mSort=ls.get("kinst.mSort","");S.f.pSort=ls.get("kinst.pSort","")})();

function sub(col,key,flag){

S._tk={"":{},"m:":{}};
function subTasks(col,pre,flag){
  S.db.collection(col).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists)m[pre+d.id]={...d.data(),id:pre+d.id}});S._tk[pre]=m;S.tasks={...S._tk[""],...S._tk["m:"]};S.loaded[flag]=true;render();maybeNotion();scheduleBackup()},
    err=>{S.loaded[flag]=true;if(!S.loadErr){S.loadErr=true;toast("בעיה בטעינת הנתונים")}render()})}
(async()=>{
  if(!window.claude){render();return}

  renderTabs();
  if(!db){render();return}
  sub("projects","projects","p");sub("people","people","pp");subTasks("tasks","",'t');
  if(S.admin){subTasks("mtasks","m:","m");sub("fin","fin","f");sub("suppliers","suppliers","s");sub("sync","sync","y");maybeNotion()}
  if(S.mcp===undefined){try{S.mcp=await claude.use("mcp")}catch(_){S.mcp=null}maybeNotion()}
  render();
})();

  document.addEventListener("click",e=>{if(moved&&e.target.closest(sel)){e.stopPropagation();e.preventDefault();moved=false}
    else if(cur&&e.target.closest(".ksw-row")===cur.row){e.stopPropagation();e.preventDefault();close()}},true);
  document.addEventListener("touchmove",e=>{if(lock==="x")e.preventDefault()},{passive:false});
};
window.kHide=new Set();
window.kUndo=function(msg,onUndo,onCommit,ms=5000){document.querySelectorAll(".toast").forEach(x=>x.remove());
  const t=document.createElement("div");t.className="toast ksw-t";t.setAttribute("role","status");
  const sp=document.createElement("span");sp.textContent=msg;const b=document.createElement("button");b.type="button";b.textContent="ביטול";
  t.append(sp,b);document.body.appendChild(t);let done=false;
  const fin=u=>{if(done)return;done=true;clearTimeout(tm);t.remove();window.removeEventListener("pagehide",ph);u?onUndo&&onUndo():onCommit&&onCommit()};
  const ph=()=>fin(false);window.addEventListener("pagehide",ph);
  b.onclick=e=>{e.stopPropagation();fin(true)};const tm=setTimeout(()=>fin(false),ms)};
window.kSwipeClose=()=>close(false);
})();

/* ---------- swipe on project rows ---------- */
async function swipeDupProject(id){const p=S.projects[id];if(!p)return;
  const data={...strip(p),name:(p.name||"פרויקט")+" (עותק)",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),doneAt:null};delete data.id;
  const f=fin(id);const fd={...finOf(f),paid:null,payStatus:f.budget!=null&&f.budget!==""?"להוציא דרישה":"",credit:""};
  let nid=S.db.collection("projects").doc().id;
  if(S.admin&&notionReady()){try{nid=await saveProjectNotion(nid,data,fd)}catch(e){toast(nErr(e));return}}
  if(await write("projects/"+nid,data)){if(S.admin)await write("fin/"+nid,finOf(fd));render();toast("שוכפל")}}
function swipeDelProject(id){const p=S.projects[id];if(!p)return;
  if(isNid(id)&&!notionReady()){toast("כדי למחוק פרויקט צריך חיבור לנושן");return}
  openSheet(`<h2 class="h3">למחוק את ״${esc(p.name||"פרויקט")}״?</h2>${isNid(id)?`<p class="hint" style="margin:6px 0 16px">הפרויקט יימחק גם מנושן.</p>`:`<div style="height:12px"></div>`}<div class="actions"><button class="btn danger" id="kdOk">מחיקה</button><button class="btn ghost" id="kdX">ביטול</button></div>`,sc=>{
    sc.querySelector("#kdX").onclick=closeSheet;sc.querySelector("#kdOk").onclick=()=>{closeSheet();swipeDelNow(id)}})}
function swipeDelNow(id){const p=S.projects[id];if(!p)return;
  kHide.add(id);render();
  toast(`״${p.name||"פרויקט"}״ נמחק`,()=>{clearTimeout(t);kHide.delete(id);render()});
  const t=setTimeout(async()=>{
    if(isNid(id)){try{await nTrash(id)}catch(e){kHide.delete(id);render();toast(nErr(e));return}}
    await del("projects/"+id);await del("fin/"+id);kHide.delete(id);render()},5000)}
kSwipe(".row.pj2[data-project]",{id:r=>r.dataset.project,when:()=>S.admin&&S.canWrite,onDel:swipeDelProject,onDup:swipeDupProject});
