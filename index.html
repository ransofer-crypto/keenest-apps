<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Keenest · האתרים</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keenest"><link rel="apple-touch-icon" href="shared/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap">
<style>
:root{--bg:#E6E9EC;--ink:#00203F;--sub:#5b6b7b;--line:#d3d9df;--blue:#06B3E5;--pink:#FA1664}
[data-theme=dark]{--bg:#0b1622;--ink:#E6E9EC;--sub:#8798a8;--line:#1e3042}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1622;--ink:#E6E9EC;--sub:#8798a8;--line:#1e3042}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 40px}
.top{display:flex;align-items:center;justify-content:center;position:relative;height:64px;max-width:560px;margin:0 auto}
.top img{height:26px}
html[data-dark] .top img{filter:brightness(0) invert(1)}
.tg{position:absolute;left:20px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:8px 24px}
h1{font-size:26px;font-weight:600;margin:18px 0 28px}
h2{font-size:13px;font-weight:500;color:var(--sub);margin:30px 0 6px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--sub)}
a.row,div.row{display:flex;align-items:center;justify-content:space-between;padding:16px 2px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;transition:background .25s ease}
a.row:active{background:rgba(6,179,229,.08)}
.nm{font-size:18px;font-weight:500}
.ad{font-size:13px;color:var(--sub);margin-top:3px;direction:ltr;text-align:right}
.go{color:var(--blue);font-size:20px}
.soon{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
div.row .nm{color:var(--sub)}
.ic{display:flex;align-items:center;gap:14px}
.cp{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .25s ease}
.cp:active{background:rgba(6,179,229,.12)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;background:#FFF3B8;color:#4a3d00;border-radius:999px;padding:8px 18px;font-size:14px;white-space:nowrap;pointer-events:none;transition:opacity .35s ease,transform .35s ease}
.toast.in{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<header class="top"><button class="tg" id="tg" aria-label="מצב תצוגה"></button><img src="shared/logo.png" alt="Keenest"></header>
<main><h1>האתרים של קינסט</h1><div id="list"></div></main>
<script>
/* The list of sites. live:true = already on app.keenest.co.il */
const SITES=[
 {g:"עבודה",items:[
  {n:"לוח עבודה",u:"board/",live:true},
  {n:"הצעות מחיר",u:"quotes/",live:true},
  {n:"לידים",u:"leads/",live:true},
  {n:"תזרים קינסט",u:"tazrim/",live:true},
  {n:"שעון נוכחות",u:"https://keenest.co.il/clock/",live:true}]},
 {g:"הפקה",items:[
  {n:"תסריטים",u:"scripts/",live:true},
  {n:"סטוריבורד",u:"storyboard/",live:true},
  {n:"הפקת AI",u:"prod/",live:true},
  {n:"עורך קינסט",u:"editor/",live:true}]},
 {g:"בית",items:[
  {n:"תזרים הבית",u:"tazrim-bayit/",live:true},
  {n:"המשימות שלי",u:"mytasks/",live:true},
  {n:"לילה טוב",u:"sleep/",live:true}]}
];
const full=u=>u.startsWith("http")?u:"https://app.keenest.co.il/"+u;
const show=u=>full(u).replace(/^https:\/\//,"").replace(/\/$/,"");
document.getElementById("list").innerHTML=SITES.map(s=>`<h2>${s.g}</h2>`+s.items.map(i=>i.live
 ?`<a class="row" href="${full(i.u)}"><div><div class="nm">${i.n}</div><div class="ad">${show(i.u)}</div></div><span class="ic"><button class="cp" data-cp="${full(i.u)}" aria-label="העתקת קישור"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button><span class="go">‹</span></span></a>`
 :`<div class="row"><div><div class="nm">${i.n}</div><div class="ad">${show(i.u)}</div></div><span class="soon">בקרוב</span></div>`).join("")).join("");
/* copy a site's link (the button sits inside the row, so it must not open the site) */
const toastEl=document.createElement("div");toastEl.className="toast";document.body.appendChild(toastEl);let toastT;
function toast(t){toastEl.textContent=t;toastEl.classList.add("in");clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove("in"),1800)}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement("textarea");a.value=t;a.setAttribute("readonly","");a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}a.remove();return ok}}
document.getElementById("list").addEventListener("click",async e=>{const b=e.target.closest(".cp");if(!b)return;e.preventDefault();e.stopPropagation();toast(await copyText(b.dataset.cp)?"הקישור הועתק":"לא הצלחתי להעתיק")});
/* light / dark: follows the phone, with a manual switch */
const root=document.documentElement,moon='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',sun='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function isDark(){const t=root.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme:dark)").matches}
function paint(){const d=isDark();root.toggleAttribute("data-dark",d);document.getElementById("tg").innerHTML=d?sun:moon}
try{const t=localStorage.getItem("keenest.theme");if(t)root.setAttribute("data-theme",t)}catch(e){}
document.getElementById("tg").onclick=()=>{const n=isDark()?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem("keenest.theme",n)}catch(e){}paint()};
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",paint);paint();
/* no pinch / double-tap zoom */
["gesturestart","gesturechange"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
let lt=0;document.addEventListener("touchend",e=>{const n=Date.now();if(n-lt<300)e.preventDefault();lt=n},{passive:false});
</script></body></html>
