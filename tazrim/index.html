/* ---------- dates & money ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d||1)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const eom=s=>{const d=parse(s);return iso(new Date(d.getFullYear(),d.getMonth()+1,0))};
const ym=s=>s.slice(0,7);
const nowYm=()=>today().slice(0,7);
const addM=(m,n)=>{let[y,mm]=m.split("-").map(Number);mm+=n;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+"-"+pad(mm)};
const mName=m=>MONTHS[+m.slice(5)-1];
const nf=new Intl.NumberFormat("he-IL",{maximumFractionDigits:0});
const money=v=>(v<0?"−":"")+"₪"+nf.format(Math.abs(Math.round(v||0)));
/* shrink ₪ and +/− inside amounts so the eye lands on the digits */
const SYM=/[₪+−]/;
const decor=root=>{if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>SYM.test(n.nodeValue)&&n.parentElement&&n.parentElement.closest(".num")&&!n.parentElement.closest(".sym,.rc,.roll,.sg")?1:3});
  const list=[];while(w.nextNode())list.push(w.currentNode);
  list.forEach(n=>{const f=document.createDocumentFragment();n.nodeValue.split(/([₪+−])/).forEach(part=>{if(!part)return;if(SYM.test(part)&&part.length===1){const sp=document.createElement("span");sp.className="sym"+(part==="₪"?" cur":"");sp.textContent=part;f.appendChild(sp)}else f.appendChild(document.createTextNode(part))});n.replaceWith(f)})};
const moneyHTML=v=>{const t=money(v);return t.replace(/₪/g,'<span class="sym cur">₪</span>').replace(/([+−])/g,'<span class="sym">$1</span>')};
const fmtD=s=>{if(!s)return"";const[y,m,d]=s.slice(0,10).split("-");return d+"/"+m+(y!==String(new Date().getFullYear())?"/"+y.slice(2):"")};
const kfmt=v=>Math.abs(v)>=1000?(v/1000).toFixed(Math.abs(v)%1000?1:0)+"K":String(Math.round(v));

/* ---------- theme ---------- */
const isDark=()=>{const t=document.documentElement.getAttribute("data-theme");if(t)return t==="dark";return !(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)};
document.addEventListener("click",e=>{if(!e.target.closest("#thmBtn"))return;const nt=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",nt);ls.set("keenest.theme",nt);render()});
try{matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>{if(!document.documentElement.getAttribute("data-theme"))render()})}catch(_){}
/* ---------- tabs ---------- */
const TABS=[["overview","בית"],["tx","תנועות"],["forecast","פרויקטים"],["sal","משכורות"],["ai","Claude"]];
const TAB_IC={forecast:'<path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/>',sal:'<path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/><circle cx="9" cy="7.5" r="3.5"/><path d="M22 20v-1.5a4 4 0 0 0-3-3.9M16 4.1a3.5 3.5 0 0 1 0 6.8"/>',ai:'<path d="M12 2.5l1.7 6.3 6.3-1.8-4.6 4.6 6.1 1.9-6.3 1.4 1.6 6.6-4.8-4.5-4.8 4.5 1.6-6.6L2.5 13.5l6.1-1.9L4 7l6.3 1.8z"/>',overview:'<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',tx:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',rec:'<path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',rules:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>'};
function renderTabs(){let n=0;try{n=openReviews().length}catch(_){}$("#tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}" aria-label="${l}" title="${l}">${k==="ai"?'<i class="cmark nav"></i>':`<svg viewBox="0 0 24 24">${TAB_IC[k]||""}</svg>`}${k==="ai"&&n&&S.tab!=="ai"?'<i class="ndot"></i>':""}</button>`).join("")}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;S.tab=b.dataset.tab;ls.set("cf.tab",S.tab);render();scrollTo({top:0})});

/* ---------- bank ledger logic ---------- */
const RN=n=>(S.catRen&&S.catRen[n])||n;
const BN=n=>{for(const b of BASE_CATS)if(RN(b.n)===n)return b.n;return n};
const allCats=()=>[...BASE_CATS.map(c=>({n:RN(c.n),k:c.k})),...S.customCats.map(c=>({n:c.n,k:c.k||"out"}))];
const kindOf=n=>{const r=RN(n);return(allCats().find(c=>c.n===r)||{k:n===UNK?"unk":"out"}).k};
function categorize(t){return RN(categorizeBase(t))}
function categorizeBase(t){
  const e=(S.edits[ym(t.d)]||{})[t.id];if(e&&e.c)return e.c;
  const c=categorize0(t);
  if(t.amt>0&&kindOf(c)==="out")return t.src==="bank"?"הכנסות מלקוחות":"החזרים והכנסות אחרות";
  return c}
function categorize0(t){
  const hay=(t.desc+" "+(t.memo||"")).toLowerCase();
  for(const r of S.rules)if(r.m&&hay.includes(r.m.toLowerCase()))return r.c;
  for(const[re,c,only]of BUILTIN){if(only&&t.src!==only)continue;if(re.test(hay))return c}
  if(t.fc&&FC_MAP[t.fc])return FC_MAP[t.fc];
  if(t.amt>0)return t.src==="bank"?"הכנסות מלקוחות":"החזרים והכנסות אחרות";
  return UNK}
function txnsIn(months){const out=[];for(const m of months){const doc=S.months[m];if(!doc)continue;
  for(const t of doc.txns||[]){const c=categorize(t);out.push({...t,owner:t.owner||(t.src!=="bank"?CARD_OWNERS[t.acct]:"")||"",cat:c,kind:kindOf(c)})}}return out}
function totals(list){let inn=0,out=0,sal=0,nIn=0,nOut=0;const salN=new Set();
  for(const t of list){if(t.kind==="int")continue;if(t.amt>0){inn+=t.amt;nIn++}else{out+=-t.amt;nOut++}
    if(t.cat===RN("משכורות")&&t.amt<0){sal+=-t.amt;salN.add(t.desc)}}
  return{inn,out,net:inn-out,sal,nIn,nOut,salN:salN.size}}
function periodMonths(){const a=S.anchor;if(S.mode==="month")return[a];
  if(S.mode==="quarter"){const[y,m]=a.split("-").map(Number);const q0=Math.floor((m-1)/3)*3+1;return[0,1,2].map(i=>y+"-"+pad(q0+i))}
  const y=a.slice(0,4);return Array.from({length:12},(_,i)=>y+"-"+pad(i+1))}
function periodLabel(){const[y,m]=S.anchor.split("-").map(Number);
  if(S.mode==="month")return MONTHS[m-1]+" "+y;if(S.mode==="quarter")return"רבעון "+(Math.floor((m-1)/3)+1)+" · "+y;return"שנת "+y}
const periodBar=()=>`<div class="period"><div class="seg" role="group" aria-label="תקופה">${[["month","חודש"],["quarter","רבעון"],["year","שנה"]].map(([k,l])=>`<button data-mode="${k}" aria-pressed="${S.mode===k}">${l}</button>`).join("")}</div>
  <div class="stepper"><button data-step="-1" aria-label="תקופה קודמת">›</button><strong>${periodLabel()}</strong><button data-step="1" aria-label="תקופה הבאה">‹</button></div></div>`;
const demoBanner=()=>S.demo?`<div class="banner">נתונים לדוגמה<span>התנועות האמיתיות מהפועלים ומהכרטיסים ייטענו מ־Financy בפתיחה הראשונה שלך עם החיבור.</span></div>`:"";

/* ---------- Notion forecast data ---------- */
const pageId=u=>{const m=String(u||"").replace(/-/g,"").match(/[0-9a-f]{32}/g);return m?m[m.length-1]:null};
const jarr=v=>{if(Array.isArray(v))return v;try{const a=JSON.parse(v||"[]");return Array.isArray(a)?a:[]}catch(_){return[]}};
const nnum=v=>v===""||v==null||isNaN(+v)?null:+v;
const mapP=r=>({id:pageId(r.url),name:r["שם הפרויקט"]||"",status:r["סטטוס"]||"",pay:r["סטטוס תשלום"]||"",budget:nnum(r["תקציב (ללא מע״מ)"]),paid:nnum(r["כמה שולם"]),
  end:String(r["date:סיום הפרויקט:start"]||"").slice(0,10),credit:(jarr(r["קרדיט"])[0]||(typeof r["קרדיט"]==="string"&&!r["קרדיט"].startsWith("[")?r["קרדיט"]:"")||"").replace(/ֿ/g,""),created:String(r.createdTime||"").slice(0,10)});
const mapS=r=>({id:pageId(r.url),name:r["שם הספק"]||"",project:pageId(jarr(r["פרויקטים"])[0])||"",amount:nnum(r["תקציב"]),paid:r["שולם"]==="__YES__",created:String(r.createdTime||"").slice(0,10)});
function nErr(e){const c=e&&e.code;
  if(c==="server_not_connected")return"נושן לא מחובר לחשבון ה-Claude שלך. מחברים בהגדרות של Claude, תחת Connectors.";
  if(c==="needs_reauth")return"החיבור לנושן פג. צריך לחבר אותו מחדש בהגדרות של Claude, תחת Connectors.";
  if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required")return"האתר צריך את האישור שלך כדי לקרוא מנושן.";
  if(c==="selection_required")return"יש יותר מחיבור נושן אחד. צריך לבחור אחד בחלון שקופץ.";
  if(c==="blocked_by_policy")return"הארגון חוסם את הגישה לנושן מהאתר.";
  if(c==="server_unavailable")return"נושן לא עונה כרגע. נסו שוב בעוד רגע.";
  return"לא הצלחתי לקרוא מנושן. נסו שוב בעוד רגע."}
async function nQuery(url,cols){const r=await mcp.callTool(NOTION,"notion-query-data-sources",{data:{data_source_urls:[url],query:`SELECT ${cols} FROM "${url}" LIMIT 1000`}},{cache:false});
  let p=r&&r.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(_){}}
  const rows=p&&(p.results||(p.data&&p.data.results));if(!Array.isArray(rows))throw{code:"bad_shape",message:"תשובה לא צפויה מנושן"};return rows}
let nBusy=false;
async function loadNotion(retried){
  if(!mcp||nBusy)return;nBusy=true;S.notion.state="loading";render();
  try{const[pr,sr]=await Promise.all([nQuery(N_PROJ,PCOLS),nQuery(N_SUP,SCOLS)]);
    S.notion.projects=pr.map(mapP).filter(p=>p.id);S.notion.suppliers=sr.map(mapS).filter(s=>s.id);
    S.notion.at=new Date().toISOString();S.notion.state="ok";S.notion.msg="";render();saveSnapshot();setTimeout(()=>repairMatches().then(autoMatch),500)}
  catch(e){if(e&&e.retryable&&!retried){nBusy=false;setTimeout(()=>loadNotion(true),(e.retryAfterMs||1500)+Math.random()*800);return}
    S.notion.state="err";S.notion.msg=nErr(e);render()}
  finally{nBusy=false}}
let lastSnap="";
async function saveSnapshot(){if(!db||!S.canWrite)return;
  const body={projects:S.notion.projects,suppliers:S.notion.suppliers};const key=JSON.stringify(body);if(key===lastSnap)return;
  try{await db.doc("notion/snapshot").set({...body,at:S.notion.at});lastSnap=key}catch(e){}}

/* estimate when a project's remaining money arrives */
const creditDays=c=>{if(!c)return null;if(c.startsWith("מיידי"))return 0;const m=c.match(/\d+/);return m?+m[0]:null};
function estimateIn(p){
  const n=30;const t=today();
  const sent=p.pay==="יצאה דרישת תשלום"||p.pay==="יצאה חשבונית מס";
  let base;
  if(sent) base=p.end&&p.end<t?p.end:t;
  else if(p.end) base=p.end<t?t:p.end;
  else base=addDays(t,p.status==="לא התחיל"?45:21);
  const d=n===0?(sent?base:addDays(base,7)):addDays(eom(base),n);
  return{d,why:(sent?"יצאה דרישה · ":p.end?"לפי תאריך סיום · ":"אין תאריך סיום · ")+"שוטף 30"}}
function estimateOut(s,proj){const t=today();
  if(proj&&proj.status==="הושלם")return{d:eom(t),why:"הפרויקט הסתיים"};
  if(proj&&proj.end&&proj.end>t)return{d:eom(proj.end),why:"סוף חודש הסיום"};
  return{d:eom(addM(nowYm(),1)+"-01"),why:"הנחה: סוף החודש הבא"}}

function forecastItems(){
  S._mp=matchedPaid();const P=S.notion.projects,byId=Object.fromEntries(P.map(p=>[p.id,p])),t=today();
  const ins=[];
  for(const p of P){
    if(!p.budget||p.budget<=0||p.pay==="פרוייקט סגור")continue;
    const mp=(S._mp||{})[p.id];const got=mp?mp.ok+mp.pend:0;
    const rem=p.budget-Math.max(p.paid||0,got);if(rem<=0.5)continue;
    const o=S.fc[p.id]||{};const e=estimateIn(p);
    const amt=rem*(S.vat?1+VAT:1);const d=o.date||e.d;
    ins.push({id:p.id,kind:"in",name:p.name,p,amt,base:rem,d,est:!o.date,why:e.why,skip:!!o.skip,late:d<t})}
  const outs=[];

function fixedMonthly(){
  if(S.fcfg.monthlyFixed!=null&&S.fcfg.monthlyFixed!=="")return{v:+S.fcfg.monthlyFixed,manual:true};
  const cur=nowYm();const ms=[1,2,3].map(i=>addM(cur,-i)).filter(m=>S.months[m]);
  if(!ms.length)return{v:0,manual:false,n:0};
  let sum=0;for(const m of ms)for(const t of txnsIn([m])){if(t.kind==="int"||t.amt>=0||t.cat==="פרילנסרים וספקים")continue;sum+=-t.amt}
  return{v:sum/ms.length,manual:false,n:ms.length}}

function fChart(rows,bal0){
  const W=640,H=230,L=8,R=56,T=12,B=26;
  const vals=rows.flatMap(r=>[r.in,r.sup+r.fix,r.bal,0]);
  let hi=Math.max(...vals),lo=Math.min(...vals);if(hi===lo)hi=lo+1;
  const step=(()=>{const raw=(hi-lo)/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const k of[1,2,2.5,5,10])if(k*p>=raw)return k*p;return 10*p})();
  hi=Math.ceil(hi/step)*step;lo=Math.floor(lo/step)*step;
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));const n=rows.length,pw=(W-L-R)/n;const x=i=>W-R-(i+1)*pw;
  let g="";for(let v=lo;v<=hi+1e-6;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${W-R+6}" y="${y(v)+3}">${kfmt(v)}</text>`}
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/>`;
  const bw=Math.min(22,(pw-14)/2);const pts=[];
  rows.forEach((r,i)=>{const cx=x(i)+pw/2;
    g+=`<rect x="${cx+1}" y="${y(r.in)}" width="${bw}" height="${Math.max(0,y(0)-y(r.in))}" rx="2" fill="var(--ok)"><title>${mName(r.m)}: נכנס ${money(r.in)}</title></rect>`;
    g+=`<rect x="${cx-1-bw}" y="${y(r.fix)}" width="${bw}" height="${Math.max(0,y(0)-y(r.fix))}" rx="2" fill="var(--amber)"><title>קבועות ${money(r.fix)}</title></rect>`;
    g+=`<rect x="${cx-1-bw}" y="${y(r.fix+r.sup)}" width="${bw}" height="${Math.max(0,y(r.fix)-y(r.fix+r.sup))}" fill="var(--rec)"><title>ספקים ${money(r.sup)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${r.m.slice(5)}/${r.m.slice(2,4)}</text>`;pts.push([cx,y(r.bal)])});
  g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===n-1?4.5:3}" fill="${rows[i].bal<0?"var(--rec)":"var(--surface)"}" stroke="var(--ink)" stroke-width="1.5"><title>${bal0==null?"מצטבר":"יתרה"} ${money(rows[i].bal)}</title></circle>`});
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="צפי תזרים לפי חודש">${g}</svg>`}

function fxAverages(){const cur=nowYm();const ms=[1,2,3,4].map(i=>addM(cur,-i)).filter(m=>S.months[m]);const n=ms.length||1;
  const sum={},now={};for(const [k] of FX_BUCKETS){sum[k]=0;now[k]=0}
  const pick=t=>{if(t.src!=="bank"||t.amt>=0)return null;for(const [k,,f] of FX_BUCKETS)if(f(t))return k;return null};
  const days={};for(const m of ms)for(const t of txnsIn([m])){const k=pick(t);if(k){sum[k]+=-t.amt;(days[k]=days[k]||[]).push(+t.d.slice(8,10))}}
  for(const t of txnsIn([cur])){const k=pick(t);if(k)now[k]+=-t.amt}
  return FX_BUCKETS.map(([k,l])=>{const o=S.fcfg["fx_"+k];const avg=sum[k]/n;const dd=(days[k]||[]).sort((a,b)=>a-b);return{k,l,avg,v:o!=null&&o!==""?+o:avg,manual:o!=null&&o!=="",now:now[k],day:dd.length?dd[Math.floor(dd.length/2)]:10}}).filter(b=>b.v>0||b.manual)}

const AI_RULES=`אתה העוזר הפיננסי בתוך האתר "תזרים" של קינסט — חברת הפקות וידאו של רן וצפריר. זה חשבון העסק (בנק הפועלים וכרטיסי ישראכרט ומקס), לא חשבון בית. forecast מכיל כסף צפוי מפרויקטים פתוחים בנושן וכסף שעוד צריך לשלם לספקים. ענה בעברית ובמספרים ב־₪. הסתמך רק על הנתונים שבהודעה הזו; אם חסר מידע, אמור זאת. merchantInfo מכיל מידע שנאסף מראש מחיפוש באינטרנט על כל בית עסק (מה הוא ואיפה) — השתמש בו כשמבקשים לדעת מה חיוב מסוים.
קישורים: כשאתה מזכיר בית עסק או חיוב מסוים שאפשר לראות ברשימת התנועות, כתוב אותו כך: [[הטקסט שמוצג|מילת חיפוש|YYYY-MM]] — מילת החיפוש היא חלק קצר משם בית העסק בדיוק כפי שמופיע בנתונים (באותיות ובשפה של הנתונים), והחודש הוא החודש שבו החיוב מופיע. עד 3 קישורים בתשובה, רק כשזה עוזר.
סגנון: התשובה מוצגת על מסך טלפון קטן. לעולם אל תכתוב שמות שדות מהנתונים (כמו bankIncomeWithoutProject). אם המידע נמצא בנתונים — השתמש בו ואל תגיד שאין לך גישה. פתח במשפט אחד שעונה ישר על השאלה. אחריו, אם צריך, עד 3–5 נקודות קצרות (שורה אחת כל אחת), כל אחת עם המספר הרלוונטי. בלי הקדמות, בלי לחזור על השאלה, בלי סיכום בסוף. בדרך כלל עד כ־80 מילים. קצר לא אומר שטחי: חשוב בכל הכוח, ואל תשמיט מספר או אזהרה חשובים. אם יש עוד מה לפרט, סיים בשורה קצרה כמו "רוצים פירוט לפי חודשים?".
