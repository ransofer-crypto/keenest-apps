<title>Keenest – תזרים</title><link rel="manifest" href="manifest.webmanifest?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Keenest – תזרים"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-180.png?v=1"><link rel="icon" type="image/png" href="icons/icon-192.png?v=1">

<style>
/* Layout: home cash-flow, same shell as the Keenest sites — sticky top bar with tabs, one working column (max 1100px). Same tokens as לוח עבודה. */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --sunk:#e8ebe8; --line:#d5dad6;
  --ink:#16201c; --muted:#5d6a64; --accent:#06B3E5; --accent-ink:#04222c; --accent-text:#0784ad;--brand2:#FA1664;--brand2-ink:#ffffff;
  --rec:#d2352b; --amber:#b7791f; --ok:#2f7d4f; --info:#2d5fa0;
  --rec-bg:#fbe7e5; --amber-bg:#fbf0dc; --ok-bg:#e2f2e7; --info-bg:#e3ecf7; --neutral-bg:#eceeec;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18201d; --sunk:#0c110f; --line:#2a3531; --ink:#e7eeea; --muted:#93a39c;
  --accent:#06B3E5; --accent-ink:#04222c; --accent-text:#3cc8f2;--brand2:#FA1664;--brand2-ink:#ffffff; --rec:#ff6b5f; --amber:#e3a94b; --ok:#6fcb93; --info:#79a7e6;
  --rec-bg:#3a1c19; --amber-bg:#36291a; --ok-bg:#183223; --info-bg:#1a2738; --neutral-bg:#222b28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201d; --sunk:#0c110f; --line:#2a3531; --ink:#e7eeea; --muted:#93a39c;
  --accent:#06B3E5; --accent-ink:#04222c; --accent-text:#3cc8f2;--brand2:#FA1664;--brand2-ink:#ffffff; --rec:#ff6b5f; --amber:#e3a94b; --ok:#6fcb93; --info:#79a7e6;
  --rec-bg:#3a1c19; --amber-bg:#36291a; --ok-bg:#183223; --info-bg:#1a2738; --neutral-bg:#222b28; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink);overflow-x:hidden;max-width:100%;overscroll-behavior-x:none;overflow-anchor:none}
body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
.brand{flex-wrap:wrap}
#syncText{overflow:hidden;text-overflow:ellipsis;min-width:0}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding-block:8px 2px;flex-wrap:wrap}
.brand{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.btitle{font-family:var(--f-display);font-size:22px;white-space:nowrap}
.brand img{display:block;height:30px;width:auto;margin-inline-start:auto}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:999px;padding:4px 11px;white-space:nowrap;max-width:100%;min-width:0;overflow:hidden}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.old{background:var(--amber)}.dot.err{background:var(--rec)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:8px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:12px 20px;display:flex;flex-direction:column;gap:14px}
main.home{gap:10px}
h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;text-wrap:balance}
h2.h3{font-size:17px}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h .count{color:var(--muted);font-family:var(--f-data);font-size:13px}
.sec-h .spacer{flex:1}
.hint{color:var(--muted);font-size:13px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--rec)}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--brand2);color:var(--brand2-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.sm{padding:5px 12px;font-size:13px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--neutral-bg);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.late{background:var(--rec-bg);color:var(--rec)}.pill.warn{background:var(--amber-bg);color:var(--amber)}.pill.info{background:var(--info-bg);color:var(--info)}
.banner{background:var(--amber-bg);color:var(--amber);border-radius:var(--r);padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{font-weight:500;color:var(--ink)}
.empty{padding:22px;color:var(--muted);text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

.period{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:18px;line-height:1;cursor:pointer}
.stepper strong{min-width:150px;text-align:center;font-family:var(--f-display);font-weight:400;font-size:18px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .l{color:var(--muted);font-size:13px;letter-spacing:.02em}
.kpi .v{font-family:var(--f-data);font-size:22px;margin-top:2px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12.5px}
.kpi.hero{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
svg.chart text{font-family:var(--f-data);font-size:10px;fill:var(--muted)}
.cats{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.card .lbl{font-size:12.5px;color:var(--muted)}
.balc{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.huge{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:24px;line-height:1.2}
.balc .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.diffl{font-size:12.5px;font-weight:600;margin-top:2px}
.mhead{display:flex;align-items:center;justify-content:space-between}
.mhead strong{font-family:var(--f-display);font-weight:400;font-size:17px}
.mhead button{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:18px;line-height:1;cursor:pointer;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile.in{background:var(--ok-bg);color:var(--ok)}.tile.out{background:var(--rec-bg);color:var(--rec)}
.tile .big{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:22px;color:var(--ink);direction:ltr;text-align:right}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px}
.moreb{border:0;background:none;color:var(--accent-text);font-weight:700;font-size:13px;padding:4px 4px 0;cursor:pointer}
.sec-t .num{font-weight:500;color:var(--muted);font-size:13px}
.rank{display:flex;flex-direction:column;gap:0;margin-top:4px}
.rk{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:3px 8px;align-items:center;font-size:14.5px;border:0;background:none;padding:3px 4px;border-radius:8px;text-align:start;cursor:pointer;width:100%}
.rk:hover{background:var(--sunk)}
.rk i{font-style:normal;color:var(--muted);font-family:var(--f-data);font-size:12px}
.rk .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .rkbar{grid-column:2/-1;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.rk .rkbar span{display:block;height:100%;border-radius:3px}
.rk .rkbar .o{background:var(--rec)}.rk .rkbar .i{background:var(--ok)}
.rk.unk .n{color:var(--amber)}.rk.unk .rkbar span{background:var(--amber)}
.rk .pc{color:var(--muted);font-size:12px;margin-inline-start:6px}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;border:0;background:none;padding:5px 6px;border-radius:7px;text-align:start;cursor:pointer}
.catrow:hover{background:var(--sunk)}
.catrow[aria-pressed="true"]{background:var(--info-bg)}
.catrow .n{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .a{font-size:13px}
.catrow .track{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.catrow .fill{height:100%;background:var(--rec);border-radius:3px;opacity:.8}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input[type=search],.tools select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.tools input[type=search]{flex:1 1 200px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.tools .count{margin-inline-start:auto;font-size:13px;color:var(--muted)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lrow{display:grid;grid-template-columns:78px minmax(0,1fr) 92px 180px 110px;gap:12px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lhead{background:var(--sunk);font-size:13px;color:var(--muted);font-weight:600}
.lhead button{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:inherit}
.lrow .d{font-family:var(--f-data);font-size:13px;color:var(--muted)}
.lrow .desc{min-width:0}
.lrow .desc b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .desc small{color:var(--muted);font-size:13px}
.lrow .amt{text-align:end;font-weight:600}
.lrow.internal{opacity:.55}
.src{font-size:12.5px;border-radius:999px;padding:1px 9px;justify-self:start;background:var(--neutral-bg);color:var(--muted);font-weight:600;white-space:nowrap}
.src.bank{background:var(--info-bg);color:var(--info)}
.catsel{width:100%;border:1px solid transparent;border-radius:999px;background:var(--neutral-bg);padding:4px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.catsel:hover{border-color:var(--line)}
.catsel.unk{background:var(--amber-bg);color:var(--amber)}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--sunk);padding:10px;color:var(--accent-text);font-weight:700;cursor:pointer}
@media (max-width:680px){
  .lhead{display:none}
  .lrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"desc amt" "src cat";gap:5px 10px}
  .lrow .d{display:none}.lrow .desc{grid-area:desc}.lrow .amt{grid-area:amt}.lrow .src{grid-area:src}.lrow .catcell{grid-area:cat;width:170px}
}

/* forecast rows */
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .sub{grid-column:1/2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.frow .amt{font-weight:700;text-align:end}
.frow .when{grid-row:span 2;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.frow input[type=date]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px;font-family:var(--f-data);font-size:13px;width:140px}
.frow input[type=date].est{border-style:dashed;color:var(--muted)}
.frow .est-l{font-size:11.5px;color:var(--muted)}
.frow.skip{opacity:.45}
.frow.skip .t{text-decoration:line-through}
.frow .x{border:0;background:none;color:var(--muted);font-size:12.5px;cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.gh{background:var(--sunk);padding:7px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;border-top:1px solid var(--line)}
.gh:first-child{border-top:0}
.gh .num{font-weight:600;color:var(--muted)}
@media (max-width:560px){.frow{grid-template-columns:minmax(0,1fr) auto}.frow .when{grid-row:auto;grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px;border-top:0;background:var(--sunk)}
td.n,th.n{text-align:left}
tfoot td,tr.tot td{font-weight:700;background:var(--sunk)}
.fixed-in{display:inline-flex;align-items:center;gap:6px}
.fixed-in input{width:110px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px;font-family:var(--f-data);direction:ltr}

.rules{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:760px){.rules{grid-template-columns:minmax(0,1fr)}}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.rule:first-of-type{border-top:0}
.rule code{font-family:var(--f-data);font-size:13px;background:var(--sunk);padding:1px 6px;border-radius:4px;overflow-wrap:anywhere}
.form{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.form input,.form select{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 10px;flex:1 1 140px;min-width:0}
.linkbtn{border:0;background:none;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:13px;padding:4px}

.toast{display:flex;align-items:center;gap:12px;position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));right:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;z-index:30;font-weight:600;max-width:calc(100% - 32px);flex-wrap:wrap}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.tfoot{display:flex;justify-content:center;padding-block:4px 40px}
.themelink{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:6px 10px;text-decoration:underline;text-underline-offset:3px}
@media (max-width:480px){.btitle{font-size:20px}.brand img{height:24px}.stepper strong{min-width:110px;font-size:16px}.kpi .v{font-size:19px}}

/* ===== Night bank — one dark look for the whole site. Radius scale: 3 / 4 / 5 (squarer corners). ===== */
:root:root:root{
  --bg:#171717; --surface:#232323; --sunk:#1d1d1d; --line:#323232; --line2:#3a3a3a; --ink:#f2f2f2; --muted:#a3a3a3; --muted2:#6e6e6e;
  --accent:#06B3E5; --accent-ink:#0c1a24; --accent-text:#4fd6ff; --brand2:#06B3E5; --brand2-ink:#00203F;
  --rec:#FF3D7F; --amber:#ffb547; --ok:#4fd6ff; --info:#7aa7ff; --pos2:#5fdcff; --neg2:#ff6f9d;
  --rec-bg:#3a1424; --amber-bg:#3a2c16; --ok-bg:#0f3243; --info-bg:#1a2738; --neutral-bg:#2a2a2a;
  --g1:#0a7fb0; --g2:#11314a; --g3:#14202a; --lbl:#cfeefa; --hi:#ffffff;
  --acc-bg:#0d3346; --acc-line:#1f4a5e; --ok-ink:#00203F; --rec-ink:#3d0018; --rec-line:#4a2233; --cl-bg:#1c1c1c; --cl-tx:#f3cfc2; --cl-tx2:#e8b3a1;
  --bg-rgb:23 23 23; --surf-rgb:35 35 35; --acc-rgb:6 179 229; --ov:255 255 255;
  --f-display:"Rubik",system-ui,sans-serif; --f-body:"Rubik",system-ui,sans-serif; --f-data:"Rubik",system-ui,sans-serif;
  --r:4px; color-scheme:dark}
@media (prefers-color-scheme:light){:root:root:root:not([data-theme="dark"]){
  --bg:#E6E9EC; --surface:#ffffff; --sunk:#f1f3f5; --line:#d3d8dd; --line2:#c4cbd2; --ink:#00203F; --muted:#5d6b7a; --muted2:#97a2ad;
  --accent:#00203F; --accent-ink:#ffffff; --accent-text:#0784ad; --brand2:#00203F; --brand2-ink:#ffffff;
  --rec:#e0105a; --amber:#b7791f; --ok:#0a8fbd; --info:#2d5fa0; --pos2:#0a8fbd; --neg2:#e0105a;
  --rec-bg:#fde3ec; --amber-bg:#fbf0dc; --ok-bg:#dff3fa; --info-bg:#e3ecf7; --neutral-bg:#eceff2;
  --g1:#06B3E5; --g2:#8fd9f2; --g3:#d3eef8; --lbl:#00203F; --hi:#00203F;
  --acc-bg:#d9eef7; --acc-line:#a9d8eb; --ok-ink:#ffffff; --rec-ink:#ffffff; --rec-line:#f4b7cb; --cl-bg:#f7f8f9; --cl-tx:#a3471f; --cl-tx2:#a3471f;
  --bg-rgb:230 233 236; --surf-rgb:255 255 255; --acc-rgb:0 32 63; --ov:0 32 63; color-scheme:light}}
:root:root:root[data-theme="light"]{
  --bg:#E6E9EC; --surface:#ffffff; --sunk:#f1f3f5; --line:#d3d8dd; --line2:#c4cbd2; --ink:#00203F; --muted:#5d6b7a; --muted2:#97a2ad;
  --accent:#00203F; --accent-ink:#ffffff; --accent-text:#0784ad; --brand2:#00203F; --brand2-ink:#ffffff;
  --rec:#e0105a; --amber:#b7791f; --ok:#0a8fbd; --info:#2d5fa0; --pos2:#0a8fbd; --neg2:#e0105a;
  --rec-bg:#fde3ec; --amber-bg:#fbf0dc; --ok-bg:#dff3fa; --info-bg:#e3ecf7; --neutral-bg:#eceff2;
  --g1:#06B3E5; --g2:#8fd9f2; --g3:#d3eef8; --lbl:#00203F; --hi:#00203F;
  --acc-bg:#d9eef7; --acc-line:#a9d8eb; --ok-ink:#ffffff; --rec-ink:#ffffff; --rec-line:#f4b7cb; --cl-bg:#f7f8f9; --cl-tx:#a3471f; --cl-tx2:#a3471f;
  --bg-rgb:230 233 236; --surf-rgb:255 255 255; --acc-rgb:0 32 63; --ov:0 32 63; color-scheme:light}
:root:root:root[data-theme="dark"]{
  --bg:#171717; --surface:#232323; --sunk:#1d1d1d; --line:#323232; --line2:#3a3a3a; --ink:#f2f2f2; --muted:#a3a3a3; --muted2:#6e6e6e;
  --accent:#06B3E5; --accent-ink:#0c1a24; --accent-text:#4fd6ff; --brand2:#06B3E5; --brand2-ink:#00203F;
  --rec:#FF3D7F; --amber:#ffb547; --ok:#4fd6ff; --info:#7aa7ff; --pos2:#5fdcff; --neg2:#ff6f9d;
  --rec-bg:#3a1424; --amber-bg:#3a2c16; --ok-bg:#0f3243; --info-bg:#1a2738; --neutral-bg:#2a2a2a;
  --g1:#0a7fb0; --g2:#11314a; --g3:#14202a; --lbl:#cfeefa; --hi:#ffffff;
  --acc-bg:#0d3346; --acc-line:#1f4a5e; --ok-ink:#00203F; --rec-ink:#3d0018; --rec-line:#4a2233; --cl-bg:#1c1c1c; --cl-tx:#f3cfc2; --cl-tx2:#e8b3a1;
  --bg-rgb:23 23 23; --surf-rgb:35 35 35; --acc-rgb:6 179 229; --ov:255 255 255; color-scheme:dark}
body{font-family:var(--f-body)}
body::before{background:var(--bg)}
header.top{background:var(--bg);border-bottom-color:var(--line)}
.btitle{font-weight:600}
.sync{background:var(--surface);border-radius:3px}
nav.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink)}
.card,.panel,.list,.tbl-wrap,.kpi,.empty{border-radius:5px}
.banner{border-radius:4px}
.btn,.chip,.seg,.seg button,.stepper button,.tools input,.tools select,.form input,.form select,.catsel,.src,.pill{border-radius:3px}
.num{font-feature-settings:"tnum"}
/* home */
.balc{position:relative;overflow:hidden;border:0;box-shadow:none;border-radius:5px;padding:14px 16px;
  background:radial-gradient(120% 140% at 100% 0%,var(--g1) 0%,var(--g2) 38%,var(--g3) 100%)}
.balc::after{content:"";position:absolute;inset:auto -40px -70px auto;width:170px;height:170px;border-radius:50%;background:rgb(var(--ov) / .07);pointer-events:none}
.balc .lbl{color:var(--lbl)}
.balc .huge{font-size:30px;font-weight:700;letter-spacing:-.5px;color:var(--hi)}
.diffl{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:rgb(var(--ov) / .13);border-radius:3px;padding:3px 9px;font-weight:500;color:var(--hi)}
.diffl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.diffl.neg::before{background:var(--rec)}
.diffl.pos,.diffl.neg{color:var(--hi)}
.tiles{gap:8px}
.tile{border-radius:5px;background:var(--surface)!important;border:1px solid var(--line)}
.tile .lbl{font-size:12.5px}
.tile .big{font-size:21px;font-weight:600;color:var(--ink)}
.mhead strong{font-family:var(--f-body);font-weight:600;font-size:16px}
.mhead button{border-radius:3px;background:var(--surface);border-color:var(--line)}
.sec-t{font-size:14px;font-weight:600;color:var(--lbl)}
.rk{grid-template-columns:30px minmax(0,1fr) auto;padding:5px 2px;border-radius:3px}
.rk .cic{width:30px;height:30px;border-radius:3.5px;display:grid;place-items:center;grid-row:span 2}
.rk .cic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rk .n{font-size:14.5px}
.rk>.num{font-weight:600}
.rk .rkbar{height:4px;background:var(--line)}
.rk.unk .n{color:var(--amber)}
.moreb{color:var(--accent-text);font-weight:500}
.tile,.card,.balc{border-radius:5px}
.hugew{text-align:right}.hugew .huge{display:inline-block;direction:ltr;unicode-bidi:isolate}
.tile{flex-direction:row;align-items:center;gap:10px;padding:9px}
.tile .ib{width:38px;height:38px;border-radius:4px;display:grid;place-items:center;flex:none}
.tile.in .ib{background:var(--ok-bg);color:var(--ok)}.tile.out .ib{background:var(--rec-bg);color:var(--rec)}
.tile .ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tile>div{display:flex;flex-direction:column;min-width:0}
.tile .lbl{font-size:12px;color:var(--muted)}
.tile .big{font-size:18px;font-weight:600;text-align:right}
.mtag{display:flex;align-items:center;gap:8px}
main.home{gap:14px;position:relative;isolation:isolate}
main.home::before{content:"";position:absolute;z-index:-1;top:-16px;left:50%;width:100vw;transform:translateX(-50%);height:340px;pointer-events:none;background:radial-gradient(120% 100% at 75% 0%,var(--g1) 0%,var(--g2) 38%,rgb(var(--bg-rgb) / 0) 80%)}
main.home .balc .lbl{color:var(--lbl)}
main.home .balc{background:none!important;padding:14px 2px 10px;border:0}
main.home .balc::after{display:none}
main.home .balc .huge{font-size:40px;letter-spacing:-.8px;margin-top:4px}
main.home .tile{padding:14px 12px}
main.home .tile .ib{width:42px;height:42px}
main.home .tile .big{font-size:20px}
main.home .card{padding:16px 16px 12px}
main.home .rank{gap:6px;margin-top:10px}
main.home .rk{grid-template-columns:36px minmax(0,1fr) auto;gap:6px 12px;padding:6px 2px}
main.home .rk .cic{width:36px;height:36px}
main.home .rk .cic svg{width:18px;height:18px}
main.home .rk .n,main.home .rk>.num{font-size:15.5px}
main.home .moreb{padding:10px 4px 2px}
main.home .mhead button{background:none;border:0;width:36px;height:36px;font-size:22px;color:var(--muted)}
.mtag .pill{border-radius:3px;padding:2px 8px;font-size:13.5px;font-weight:600;direction:ltr;unicode-bidi:isolate}
.mtag .pill.pos{background:var(--ok-bg);color:var(--ok)}.mtag .pill.neg{background:var(--rec-bg);color:var(--rec)}
.rk .rkbar,.rk .rkbar span{border-radius:2px}

/* transactions screen (option 5) */
.txhero{border-radius:5px;padding:12px 14px 14px;background:radial-gradient(120% 140% at 100% 0%,var(--g1) 0%,var(--g2) 38%,var(--g3) 100%);display:flex;flex-direction:column;gap:10px}
.txhero .mhead button{background:none!important;border:0!important;color:var(--lbl);width:36px;height:36px;font-size:22px}
.txhero .mhead strong{color:var(--hi)}
.txhero .bot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.txhero small{font-size:12px;color:var(--lbl);display:block}
.txhero .big{font-size:26px;font-weight:700;color:var(--hi)}
.txhero .io{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13.5px;font-weight:600}
.txhero .io .pos{color:var(--pos2)}.txhero .io .neg{color:var(--neg2)}
.tbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tb{height:40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:5px;color:var(--muted);font-size:14px;cursor:pointer;position:relative;padding:0}
.tb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb.on{background:var(--acc-bg);border-color:var(--acc-line);color:var(--ink);font-weight:600}
.tb .fdot{position:absolute;top:6px;left:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tsearch{width:100%;height:40px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:0 12px}
.tfil{display:flex;gap:6px;align-items:center}
.tfil select{flex:1;min-width:0;height:40px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:0 10px}
.tcount{font-size:12.5px;color:var(--muted)}
.tlist{display:flex;flex-direction:column}
.tday{font-size:12px;color:var(--muted);padding:12px 2px 4px}
.trow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 2px;border-top:1px solid var(--line)}
.tday+.trow{border-top:0}
.trow .cic{width:36px;height:36px;border-radius:4px;display:grid;place-items:center;grid-row:span 2}
.trow .cic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trow .t{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .amt{font-size:15px;font-weight:600;text-align:left}
.trow .amt.neg{color:var(--rec)}
.trow .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.trow .tag{font-size:11px;color:var(--amber);text-align:left}
.trow.int .t,.trow.int .amt,.trow.int .tag{color:var(--muted)}
.trow .tag.chg{color:var(--muted)}
.trow .catsel{width:auto;max-width:150px;display:inline;background:none;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:0;font-size:12px;font-weight:500;color:var(--muted);-webkit-appearance:none;appearance:none}
.trow .catsel.unk{background:none;color:var(--amber)}
.tlist .more{border-radius:5px;margin-top:8px;border:1px solid var(--line)}

/* floating bottom nav (capsule, icons only) */
nav.tabs#tabs{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;height:58px;padding:0 7px;align-items:center;border-radius:29px;background:rgb(var(--surf-rgb) / .85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line2);box-shadow:0 10px 30px rgb(0 0 0 / .5);overflow:visible}
nav.tabs#tabs button{width:44px;height:44px;border-radius:22px;padding:0;border:0!important;display:grid;place-items:center;color:var(--muted);background:none}
nav.tabs#tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs#tabs button[aria-selected="true"]{background:var(--accent);color:var(--bg)}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
header.top{border-bottom:0}

/* no title bar; sync lives in the balance row; fade under the floating nav */
header.top{position:static;background:none!important;border:0}
header.top .bar{display:none}
#syncSlot .sync{background:none;padding:0;font-size:12.5px;color:var(--lbl);gap:6px;max-width:60vw}
#syncSlot .dot.ok{box-shadow:0 0 8px var(--ok)}
body::after{content:"";position:fixed;z-index:19;left:0;right:0;bottom:0;height:calc(120px + env(safe-area-inset-bottom,0px));pointer-events:none;background:linear-gradient(180deg,rgb(var(--bg-rgb) / 0),rgb(var(--bg-rgb) / .92) 55%,var(--bg))}
main{padding-top:max(16px,env(safe-area-inset-top,0px))}

/* transactions toolbar: text tabs + ghost icons */
.tbar2{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line)}
.ttabs2{flex:1;display:flex;gap:24px;padding-inline:4px}
.ttabs2 button{background:none;border:0;padding:9px 0 11px;font-size:15px;color:var(--muted);position:relative;cursor:pointer}
.ttabs2 button.on{color:var(--ink);font-weight:600}
.ttabs2 button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.gi{width:38px;height:38px;display:grid;place-items:center;background:none;border:0;color:var(--muted);cursor:pointer;position:relative;border-radius:19px}
.gi svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gi.on{color:var(--accent)}
.gi .fdot{position:absolute;top:7px;left:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* pull to refresh */
html,body{overscroll-behavior-y:none}
#ptr{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) - 30px);left:50%;transform:translate(-50%,0);width:40px;height:40px;border-radius:20px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 6px 20px rgb(0 0 0 / .45);display:grid;place-items:center;opacity:0;pointer-events:none;color:var(--muted)}
#ptr svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#ptr.ready{color:var(--accent)}
#ptr.spin svg{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}

/* home: monthly balance first */
main.home .mhead.hm strong{font-size:16px}
.sofar{color:var(--lbl);font-weight:400;font-size:13.5px}
.mhero{text-align:right;padding:4px 2px 0}
.mhero small{display:block;font-size:13px;color:var(--lbl)}
.mhero .mv{font-size:46px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin-top:4px}
.mhero .mv.p{color:var(--pos2)}.mhero .mv.n{color:var(--neg2)}
.vsb{display:flex;flex-direction:column;gap:12px;padding:4px 2px}
.vsb .r{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center}
.vsb .l{font-size:13.5px;color:var(--muted)}
.vsb .tr{height:12px;border-radius:3px;background:var(--line);overflow:hidden}
.vsb .tr span{display:block;height:100%;border-radius:3px}
.vsb b{font-weight:600;font-size:16px}
.bankc{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.bankc .row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);gap:8px}
.bankc .bv{font-size:28px;font-weight:700;letter-spacing:-.5px;text-align:right;align-self:flex-start}
.bankc #syncSlot .sync{color:var(--muted)}

/* home: bank strip on top, month section with month picker */
.bstrip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 2px 14px;border-bottom:1px solid rgb(var(--ov) / .12)}
.bstrip .bl{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--lbl);min-width:0}
.bstrip .bv{font-size:26px;font-weight:700;color:var(--hi);letter-spacing:-.4px}
.bstrip #syncSlot .sync{font-size:11.5px}
.msect{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.mlbl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--lbl)}
.msel{position:relative;display:inline-flex;align-items:center;gap:4px;background:rgb(var(--ov) / .1);border:1px solid rgb(var(--ov) / .16);border-radius:4px;padding:3px 8px 3px 6px;cursor:pointer}
.msel select{appearance:none;-webkit-appearance:none;background:none;border:0;color:var(--hi);font:inherit;font-weight:600;font-size:14.5px;padding:0;cursor:pointer}
.msel select option{background:var(--surface);color:var(--ink)}
.msel svg{width:14px;height:14px;fill:none;stroke:var(--hi);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.msect .mv{font-size:46px;font-weight:700;letter-spacing:-1px;line-height:1.1;text-align:right;align-self:flex-start}
.msect .mv.p{color:var(--pos2)}.msect .mv.n{color:var(--neg2)}
.msect .vsb{margin-top:8px}

.mdots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.mdots i{width:6px;height:6px;border-radius:3px;background:var(--line2);transition:width .2s}
.mdots i.on{width:18px;background:var(--accent)}
.mslide{display:flex;flex-direction:column;gap:6px;will-change:filter,opacity}
.mcar{will-change:transform}
.msect{overflow:hidden;margin-inline:-16px;padding-inline:16px}
@keyframes msl{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes msr{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}

.hpseg{display:flex;background:rgb(var(--ov) / .06);border-radius:5px;padding:3px;gap:2px}
.hpseg button{flex:1;border:0;background:none;color:var(--lbl);font:inherit;font-size:13px;padding:6px 0;border-radius:3px;cursor:pointer}
.hpseg button.on{background:rgb(var(--ov) / .14);color:var(--hi);font-weight:600}
.msect .mlbl{font-size:13px;color:var(--lbl)}
.mcar{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:14px;white-space:nowrap;margin-top:12px;-webkit-mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.mcar span{font-size:14px;color:var(--muted);overflow:hidden}
.mcar span:first-child{text-align:left}.mcar span:last-child{text-align:right}
.mcar b{font-size:16.5px;font-weight:600;color:var(--hi)}

/* month wheel */
.mcar{position:relative;height:30px;margin-top:14px;overflow:hidden;display:block!important;-webkit-mask:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.mtrack{position:absolute;inset:0;direction:ltr;will-change:transform}
.mtrack i{position:absolute;top:0;left:50%;width:36%;margin-left:-18%;text-align:center;font-style:normal;font-size:15px;color:var(--muted);white-space:nowrap;line-height:30px;direction:rtl;transform-origin:center}
.mtrack i[data-o="2"]{left:calc(50% - 72%)}.mtrack i[data-o="1"]{left:calc(50% - 36%)}.mtrack i[data-o="-1"]{left:calc(50% + 36%)}.mtrack i[data-o="-2"]{left:calc(50% + 72%)}
.mtrack i.c{color:var(--hi);font-weight:600}
#mvNum{will-change:filter,opacity}

.roll{display:inline-flex;direction:ltr}
.rc{display:inline-block;height:1.15em;line-height:1.15em;overflow:hidden;vertical-align:top;white-space:pre;text-align:center}
.rcol{display:flex;flex-direction:column;will-change:transform}
.rcol span{height:1.15em;line-height:1.15em;display:block;white-space:pre}
.msect .vsb b{min-width:5.4em;text-align:left}
#mvNum{font-variant-numeric:tabular-nums}
#mvNum{transition:color .3s cubic-bezier(.32,.72,0,1)}

.sym{font-size:.62em;font-weight:600;opacity:.75;margin-inline:.04em;vertical-align:.08em}
.rc.s{font-size:.62em;opacity:.8;height:1.85em;line-height:1.85em;vertical-align:top}
.rc.s .rcol span{height:1.85em;line-height:1.85em}

.sym.cur{margin-right:.22em}
#mvNum .sg{font-size:.62em;opacity:.8;margin-right:.04em}
#mvNum .sym{vertical-align:.12em}
.rc.cur{margin-right:.13em}
#mvNum{display:block;height:1.15em;line-height:1.15em;overflow:visible}
#mvNum .roll{display:inline-flex;align-items:flex-start;vertical-align:top;height:1.15em}

.msect .hpseg{margin-top:22px}
.msect .mcar{margin-top:12px}
.mlive{text-align:center;font-size:11.5px;color:var(--muted);height:16px;margin-top:-2px}

/* transactions screen top */
.bstrip.tbal{border:0;padding:6px 2px 0}
.tbig{display:block;text-align:right;font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1.1;color:var(--hi);padding:0 2px 6px}
.tmon{display:flex;flex-direction:column;gap:10px;will-change:transform,opacity}
.tmon .mt{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px}
.tmon .mt strong{font-size:20px;font-weight:600;white-space:nowrap}.tmon .mt small{font-size:12px;color:var(--muted);white-space:nowrap}
.tpair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.tt{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:12px 10px;display:flex;align-items:center;gap:10px;min-width:0}
.tt .ib{width:38px;height:38px;border-radius:4px;display:grid;place-items:center;flex:none}
.tt .ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.tt.in .ib{background:var(--ok);color:var(--ok-ink);box-shadow:0 0 14px -2px rgb(94 240 164 / .55)}
.tt.out .ib{background:var(--rec);color:var(--rec-ink);box-shadow:0 0 14px -2px rgb(255 125 138 / .55)}
.tt div{display:flex;flex-direction:column;min-width:0}.tt small{font-size:12px;color:var(--muted)}.tt b{font-size:18px;font-weight:600}
.tdots{margin-top:0}
.tday{display:flex;justify-content:space-between;align-items:baseline}
.tday .eb{color:var(--lbl);font-size:11.5px}

main.txv{position:relative;isolation:isolate}
main.txv::before{content:"";position:absolute;z-index:-1;top:-16px;left:50%;width:100vw;transform:translateX(-50%);height:340px;pointer-events:none;background:radial-gradient(120% 100% at 75% 0%,var(--g1) 0%,var(--g2) 38%,rgb(var(--bg-rgb) / 0) 80%)}
main.txv .bstrip .bl{color:var(--lbl)}

/* fixed charges */
.glbl{font-size:13px;color:var(--lbl);padding:6px 2px 0}
.gsub{font-size:12.5px;color:var(--lbl);padding:0 2px}
.fxbar{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;margin-top:4px}
.fxleg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.fxleg div{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--lbl);min-width:0}
.fxleg i{width:9px;height:9px;border-radius:2px;flex:none}.fxleg b{margin-inline-start:auto;font-weight:600;color:var(--ink)}
.fxmon{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:2px 2px 0}.fxmon b{color:var(--ink);font-weight:600}
.fxg{background:var(--surface);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.fxgh{width:100%;display:grid;grid-template-columns:4px minmax(0,1fr) auto 16px;gap:10px;align-items:center;padding:12px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:start;cursor:pointer}
.fxg>.fxgh:first-child{border-top:0}
.fxgh i{height:30px;border-radius:2px}.fxgh .n{font-size:14.5px;font-weight:500}.fxgh .c{font-size:11.5px;color:var(--muted)}.fxgh .a{font-weight:600;font-size:15px}
.fxgh .chev{color:var(--muted);transition:transform .25s cubic-bezier(.32,.72,0,1)}.fxgh .chev.o{transform:rotate(-90deg)}
.fxitems{padding:0 12px 6px 12px;padding-inline-start:26px;padding-inline-end:38px;background:rgb(var(--ov) / .015)}
.fxi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.fxitems .fxi:first-child{border-top:0}
.fxi .n{font-size:14px}.fxi .s{font-size:11.5px;color:var(--muted)}.fxi .a{font-weight:600;font-size:14px}
.fxal{background:linear-gradient(180deg,rgb(255 125 138 / .06),transparent),var(--surface);border:1px solid var(--rec-line);border-radius:5px;padding:8px 12px}
.fxal .h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--lbl)}
.fxal .fxi:nth-child(2){border-top:0}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:3px;font-weight:600;white-space:nowrap}
.tag.up{background:var(--rec-bg);color:var(--rec)}.tag.miss{background:var(--amber-bg);color:var(--amber)}
/* Claude page */
.aihdr{display:flex;align-items:center;gap:10px;padding:6px 2px 0}.aihdr b{font-size:18px;font-weight:600;flex:1}

.astar{width:30px;height:30px;display:grid;place-items:center;flex:none}.astar .cmark{width:26px;height:26px}
.aask{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--acc-line);border-radius:22px;padding:6px 6px 6px 8px;box-shadow:0 0 0 4px rgb(var(--acc-rgb) / .06)}
.aask textarea{flex:1;resize:none;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;padding:7px 8px;max-height:140px;outline:none}
.aask button{width:36px;height:36px;border-radius:18px;border:0;background:var(--accent);display:grid;place-items:center;flex:none;cursor:pointer}
.aask button[disabled]{opacity:.4}
.aask svg{width:17px;height:17px;fill:none;stroke:var(--bg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.aideas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aidea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 10px;display:flex;flex-direction:column;gap:4px;text-align:start;color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.aidea small{font-size:11px;font-weight:600}.aidea span{font-size:13.5px;line-height:1.35}
.athread{display:flex;flex-direction:column;gap:8px}
.amsg{max-width:90%;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.amsg.me{align-self:flex-start;background:rgb(var(--acc-rgb) / .16);border:1px solid rgb(var(--acc-rgb) / .26);border-bottom-right-radius:4px}
.amsg.cl{align-self:flex-end;background:var(--cl-bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.aglass{height:38px;min-width:38px;border-radius:19px;border:1px solid rgb(var(--ov) / .14);background:rgb(var(--ov) / .08);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;color:var(--ink);flex:none;cursor:pointer;padding:0;font:inherit}
.aglass svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.aglass.txt{display:flex;gap:5px;padding:0 13px 0 11px;font-size:13px;color:var(--lbl)}.aglass.txt svg{width:15px;height:15px}
.acont{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--acc-line);border-radius:12px;padding:11px 12px;color:var(--ink);font:inherit;cursor:pointer}
.acont .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.acont small{font-size:12px;color:var(--lbl)}.acont span.q{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acont svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.alink{display:inline;border:0;background:rgb(var(--acc-rgb) / .14);color:var(--lbl);font:inherit;padding:0 5px;border-radius:5px;cursor:pointer;text-decoration:underline;text-decoration-color:rgb(var(--acc-rgb) / .5);text-underline-offset:3px}
#backChat{position:fixed;z-index:21;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 12px;border-radius:20px;border:1px solid rgb(var(--acc-rgb) / .4);background:rgb(var(--surf-rgb) / .92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--lbl);font:inherit;font-size:13.5px;box-shadow:0 8px 24px rgb(0 0 0 / .4);cursor:pointer}
#backChat .cmark{width:16px;height:16px}
.aprop{margin-top:8px;border:1px solid var(--acc-line);border-radius:6px;padding:9px 10px;background:rgb(var(--acc-rgb) / .06);display:flex;flex-direction:column;gap:5px;white-space:normal}
.aprop .h{font-size:12px;color:var(--lbl);font-weight:600}.aprop .ai1{font-size:13px}
.abtn{display:flex;gap:6px;margin-top:4px}.abtn button{flex:1;padding:7px 0;border-radius:4px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.abtn .ok{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.achips{display:flex;flex-wrap:wrap;gap:6px}.achips button{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:15px;border:1px solid var(--line);background:rgb(var(--ov) / .03);color:var(--lbl);cursor:pointer;text-align:start}
.ajars{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:10px 12px;display:flex;flex-direction:column}
.ajars .h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--lbl);margin-bottom:4px}
.afree{display:flex;justify-content:space-between;font-size:13px;color:var(--lbl);padding:4px 0 8px}.afree b{font-weight:600;color:var(--hi)}
.ajar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.ajar .n{font-size:14px;font-weight:500}.ajar .a{font-weight:600}.ajar .s{font-size:11.5px;color:var(--muted)}
.ajar .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.ajar .bar span{display:block;height:100%;background:var(--accent);border-radius:3px}
.thm{width:32px;height:32px;flex:none;border-radius:16px;border:1px solid rgb(var(--ov) / .18);background:rgb(var(--ov) / .08);color:var(--hi);display:grid;place-items:center;padding:0;cursor:pointer;align-self:center}.thm svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bstrip .bvw{margin-inline-start:auto}
.bvw{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.bfree{font-size:11.5px;color:var(--lbl)}.bfree b{font-weight:600;color:var(--hi)}

/* sort page */
.sec2{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--lbl);padding:6px 2px 0}.sec2 span:last-child{font-weight:500;color:var(--muted)}
.remt{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;padding:0 2px;cursor:pointer;text-align:start}
.remt .sw{width:28px;height:17px;border-radius:9px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.remt .sw::after{content:"";position:absolute;top:2px;right:2px;width:13px;height:13px;border-radius:50%;background:var(--hi);transition:transform .25s cubic-bezier(.32,.72,0,1)}
.remt .sw.on{background:var(--accent)}.remt .sw.on::after{transform:translateX(-11px)}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 12px}
.sm{padding:11px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;transition:opacity .25s,transform .26s cubic-bezier(.32,.72,0,1),max-height .26s;max-height:600px;overflow:hidden}
.sm:first-child{border-top:0}
.sm.gone{opacity:0;transform:translateX(-30px);max-height:0;padding:0}
.smt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.smt .n{font-size:14.5px;font-weight:500}.smt .s{font-size:11.5px;color:var(--muted)}.smt .a{font-weight:600;font-size:14px}
.schips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.schips::-webkit-scrollbar{display:none}.schips.wrap{flex-wrap:wrap;overflow:visible;justify-content:flex-start}
.schips button{flex:none;font:inherit;font-size:12.5px;padding:6px 11px;border-radius:15px;border:1px solid var(--line);background:rgb(var(--ov) / .03);color:var(--lbl);cursor:pointer;white-space:nowrap}
.schips button:active{background:var(--acc-bg,var(--acc-bg));color:var(--hi)}
.schips .more{color:var(--muted)}.schips .ni{border-style:dashed}
.ilbl{font-size:11.5px;color:var(--muted);margin-bottom:-3px}
.remt.sm2{margin-top:-2px}
.snote{font-size:12px;color:var(--muted);line-height:1.55;padding:0 4px}.snote b{color:var(--lbl);font-weight:600}
.fold2{display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;font-size:13px;color:var(--lbl);padding:12px;border:1px solid var(--line);border-radius:5px;background:var(--surface);cursor:pointer}
.fold2 .chev{color:var(--muted);transition:transform .25s cubic-bezier(.32,.72,0,1)}.fold2 .chev.o{transform:rotate(-90deg)}
.rules.adm{grid-template-columns:minmax(0,1fr)}
.askc{display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:none;color:var(--lbl);font:inherit;font-size:12.5px;padding:6px;cursor:pointer}
.astar.xs{width:18px;height:18px;display:inline-grid;align-self:center;vertical-align:middle}.astar.xs .cmark{width:17px;height:17px}

/* home: tighter label/sync */
.bstrip .bl{gap:0!important;line-height:1.25}
.bstrip #syncSlot .sync{padding:0!important;line-height:1.25;margin-top:1px}
/* tx: amount row with sync opposite */
.tbrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 2px 6px}
.tbrow #syncSlot{min-width:0;flex:0 1 auto}.tbrow #syncSlot .sync{max-width:100%}
.tbrow .tbig{padding:0}
.tbrow #syncSlot .sync{font-size:12px;color:var(--lbl)}

.fxseg{margin-top:4px}
.fxstrip{display:flex;justify-content:space-between;font-size:12.5px;color:var(--lbl);padding:8px 2px 2px;border-top:1px solid rgb(var(--ov) / .12)}.fxstrip b{font-weight:600;color:var(--hi)}
.fxgh.nob{cursor:default}
.vtag{font-size:10.5px;color:var(--amber);background:var(--amber-bg);border-radius:3px;padding:0 5px;margin-inline-start:6px;font-weight:600;vertical-align:1px}

.rule .rbtns{display:inline-flex;gap:10px;justify-content:flex-end}
.rule input#renIn{grid-column:1/2;background:var(--bg);border:1px solid var(--accent);border-radius:4px;padding:6px 8px;color:var(--ink);font:inherit;min-width:0}

.fxr{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.fxr .st{font-size:10.5px;font-weight:600;padding:0 6px;border-radius:3px}
.fxr .st.ok{color:var(--ok);background:var(--ok-bg)}.fxr .st.late{color:var(--amber);background:var(--amber-bg)}.fxr .st.wait{color:var(--muted);background:rgb(var(--ov) / .05)}

/* Claude noticed */
.rvpill{display:flex;align-items:center;gap:8px;width:100%;background:rgb(217 119 87 / .12);border:1px solid rgb(217 119 87 / .35);border-radius:20px;padding:7px 10px 7px 12px;font:inherit;font-size:13px;color:var(--cl-tx);cursor:pointer;text-align:start}
.rvpill span:nth-child(2){flex:1}.rvpill .c{background:#d97757;color:#fff;border-radius:10px;padding:0 7px;font-size:12px;font-weight:600}
.rvh{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--cl-tx2);padding:2px}
.rvl{display:flex;flex-direction:column;gap:8px}
.rvi{background:var(--surface);border:1px solid var(--acc-line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:9px}
.rvi .t{font-size:14px;line-height:1.5}.rvi .t b{font-weight:600}
.rvb{display:flex;flex-wrap:wrap;gap:6px}
.rvb button{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:5px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.rvb .ok{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.rvb .talk{border-color:rgb(217 119 87 / .45);color:var(--cl-tx)}
.rvb .later{border:0;color:var(--muted);margin-inline-start:auto}
.rvi{position:relative;touch-action:pan-y}.rvi .t{padding-left:30px}
.smt{align-items:center}.smt>div:first-child{flex:1;min-width:0}
.mi{font-size:12px;color:var(--lbl);margin-top:2px;line-height:1.35}.smt .s b{font-weight:500;color:var(--lbl)}
.trow .tag{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.txq{width:26px;height:24px;flex:none;border-radius:6px;border:1px solid rgb(217 119 87 / .4);background:none;color:var(--cl-tx);display:grid;place-items:center;padding:0;cursor:pointer}.txq svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.txq.ghost{border-color:transparent;color:var(--muted2)}
.whatq{width:30px;height:30px;flex:none;border-radius:8px;border:1px solid rgb(217 119 87 / .4);background:none;color:var(--cl-tx);display:grid;place-items:center;padding:0;cursor:pointer;margin-inline-start:8px}.whatq svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rvx{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:13px;border:0;background:rgb(var(--ov) / .07);color:var(--muted);display:grid;place-items:center;padding:0;cursor:pointer}
.rvx svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.rvb{flex-wrap:nowrap;align-items:center}.rvb button{white-space:nowrap}.rvsp{flex:1}
.rvb .talk{width:34px;height:auto;align-self:stretch;padding:0;display:grid;place-items:center;flex:none}
.rvb .talk svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs#tabs button{position:relative}
.cmark.nav{width:23px;height:23px;background:currentColor}
.ndot{position:absolute;top:7px;left:9px;width:9px;height:9px;border-radius:50%;background:#d97757;border:2px solid var(--surface)}

body.aichat::after{display:none}
/* chat mode: app-like fixed layout */
body.aichat{overflow:hidden;overscroll-behavior:none}
body.aichat main#view{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh);margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overflow:hidden}
body.aichat main#view>.aihdr{flex:none}
body.aichat .athread{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:6px!important;mask-image:linear-gradient(to bottom,transparent 0,#000 14px)}
body.aichat .aask.bottom{position:static;flex:none;margin:0;box-shadow:0 0 0 4px rgb(var(--acc-rgb) / .06)}
body.aichat.kb main#view{padding-bottom:10px}
body.aichat.kb.ios main#view{padding-bottom:calc(var(--kb,0px) + 6px)}
body.aichat.kb #tabs{display:none}

.aask.bottom{position:fixed;z-index:25;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:1068px;margin:0 auto;background:var(--surface);box-shadow:0 -14px 24px 6px var(--bg),0 0 0 4px rgb(var(--acc-rgb) / .06)}
body.aichat .athread{padding-bottom:84px}

html{touch-action:manipulation;-webkit-text-size-adjust:100%}
input,textarea,select{font-size:16px!important}


/* projects & payments matching */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start}
@media (max-width:640px){.mgrid{grid-template-columns:minmax(0,1fr)}}
.msec{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;cursor:pointer;padding:4px 0 8px}
.msec::before{content:"";width:6px;height:6px;border-radius:3px;background:var(--accent);flex:none}.msec .h3{margin:0}.msec .count{margin-inline-start:0}.msec .chev{margin-inline-start:auto;color:var(--muted);font-size:13px}
.mpc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.mpc.pend{border-color:rgb(255 181 71 / .45)}
.mp1{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;font-weight:500;align-items:baseline}
.mp1>span:first-child{min-width:0;overflow-wrap:anywhere}
.mp1 .num{white-space:nowrap;color:var(--muted);font-weight:400;font-size:13px}.mp1 .num.pos{color:var(--ok);font-weight:600;font-size:14.5px}
.mbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex;gap:2px}
.mbar i{display:block;height:100%;background:var(--ok);flex:none}.mbar i.w{background:var(--amber)}
.mpays{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.mpr{display:flex;justify-content:space-between;gap:10px}.mpr>span:first-child{min-width:0;overflow-wrap:anywhere}.mpr .num{white-space:nowrap;direction:ltr}
.mpr.w{color:var(--amber)}.mpr.left{color:var(--rec)}.mpr.tot{border-top:1px solid var(--line);padding-top:4px;color:var(--ink)}
.mpc .mpays .mpr b{font-weight:500}
.mhint{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.mnu{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--amber);background:rgb(255 181 71 / .08);border-radius:6px;padding:5px 8px}
.mpc .row{display:flex;gap:6px;flex-wrap:wrap}
.mpick{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.mplist{max-height:260px;overflow:auto;display:flex;flex-direction:column}
.mpo{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer}
.mpo .num{direction:ltr;color:var(--muted)}

/* forward cash-flow home */
.fverd{font-size:14px;color:var(--muted);padding:2px 2px 4px;line-height:1.45}
.fverd.bad{color:var(--rec)}
.ftab{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.fhead,.frow{display:grid;grid-template-columns:minmax(0,1.15fr) repeat(3,minmax(0,1fr));gap:6px;align-items:center;padding:10px 12px}
.fhead{font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.fhead span:not(:first-child),.frow .num{text-align:left}
.frow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1.15fr) repeat(3,minmax(0,1fr));gap:6px;align-items:center;padding:12px;cursor:pointer;width:100%;font-size:14px}
.fm+.fm{border-top:1px solid var(--line)}
.fm.on{background:rgb(var(--ov) / .03)}
.fmn{font-weight:600}.fmn .mut{font-weight:400;font-size:11.5px}
.frow .num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;font-size:13.5px}
.frow .fend{font-weight:600;font-size:14.5px}
.fdet{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.frw{display:flex;justify-content:space-between;font-size:13.5px}
.frw .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.fsub{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--muted);padding-inline-start:8px}
.fsub .late{color:var(--amber)}
.fnote{font-size:12px;color:var(--amber);background:rgb(255 181 71 / .08);border-radius:6px;padding:6px 8px}
.fnote.r{color:var(--rec);background:rgb(255 61 127 / .08)}
.mut{color:var(--muted)}
.fxc .fxr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.fxc .fxr input{width:110px;text-align:left;direction:ltr;font:inherit;font-size:16px;background:var(--sunk);border:1px solid var(--line);border-radius:3px;color:var(--ink);padding:5px 8px}

/* home: one row per month */
.fsec{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 0}
.fst{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}
.fst::before{content:"";width:6px;height:6px;border-radius:3px;background:var(--accent)}
.frows{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.frows .fm+.fm{border-top:1px solid var(--line)}
.frows .fm.on{background:rgb(var(--ov) / .03)}
.frows .frow{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:64px minmax(0,1fr) 96px;gap:5px 12px;align-items:center;padding:13px 12px}
.frows .fmn{grid-row:span 2;font-size:15px;font-weight:600}
.frows .fmn small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.fbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.fbar i{display:block;height:100%}.fbar .bi{background:var(--ok)}.fbar .bo{background:var(--rec)}.fbar .b0{width:100%;background:var(--sunk)}
.frows .fend{grid-row:span 2;font-size:17px;font-weight:600;text-align:left;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.fio{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.fio .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.fdet{padding:2px 12px 14px;display:flex;flex-direction:column;gap:12px}
.fgrp{display:flex;flex-direction:column}
.fgh{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);padding-bottom:5px;border-bottom:1px solid var(--line)}
.fgh .num{font-size:13.5px;font-weight:600;direction:ltr;unicode-bidi:isolate}
.fli{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:13.5px;border-bottom:1px solid rgb(var(--ov) / .05)}
.fli:last-child{border-bottom:0}.fli .n{min-width:0}.fli .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
.fli.mut{color:var(--muted);font-size:12.5px}
.ftag{font-size:10.5px;color:var(--amber);border:1px solid rgb(255 181 71 / .4);border-radius:999px;padding:0 6px;margin-inline-start:6px;white-space:nowrap}
.fsum{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;padding-top:8px;border-top:1px solid var(--line)}
.fsum .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.fsum .num:first-child{color:var(--muted);font-weight:400}

/* home v3: status, month strip, selected month, what's next */
.hstat{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:2px 2px 2px}
.hbadge{font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;background:rgb(79 214 255 / .16);color:var(--ok)}
.hbadge.w{background:rgb(255 181 71 / .18);color:var(--amber)}.hbadge.r{background:rgb(255 61 127 / .16);color:var(--rec)}
.hsub{font-size:13.5px;color:var(--lbl)}
.hlab{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);padding:6px 2px 0}
.hlab b{color:var(--ink);font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}
.hlab b::before{content:"";width:6px;height:6px;border-radius:3px;background:var(--accent)}
.mstrip{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 30px) / 4);gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 5px;scrollbar-width:none;padding:5px 5px 4px;margin:0 -5px}
.mstrip::-webkit-scrollbar{display:none}
.mblk{all:unset;box-sizing:border-box;scroll-snap-align:start;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.mblk .v{white-space:nowrap;width:100%;height:58px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.mblk.p .v{background:rgb(79 214 255 / .14);color:var(--ok)}.mblk.n .v{background:rgb(255 61 127 / .13);color:var(--rec)}
.mblk.on .v{outline:2px solid var(--accent);outline-offset:2px}
.mblk .m{font-size:12px;color:var(--muted)}.mblk.on .m{color:var(--ink);font-weight:600}
.hsel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hsum{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:baseline;padding:14px}
.hsum>span:first-child{font-size:13.5px;color:var(--muted)}
.hsum b{font-size:24px;font-weight:600;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.hio{grid-column:1/-1;display:flex;gap:14px;font-size:12.5px;color:var(--muted);align-items:center}
.hio .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.hio .chev{margin-inline-start:auto;font-size:12.5px}
.hsel .fdet{border-top:1px solid var(--line);padding-top:10px}
.hnext{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2px 14px}
.hev{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgb(var(--ov) / .06)}
.hev:first-child{border-top:0}
.hev .d{font-size:11px;color:var(--muted);text-align:center;line-height:1.1}.hev .d b{display:block;font-size:17px;color:var(--ink);font-weight:600}
.hev .t{font-size:14px;min-width:0}.hev.late .t small{color:var(--amber)}
.hend{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}.hend span{font-size:13.5px;color:var(--muted)}.hend b{font-size:20px;font-weight:600;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}.hev .t small{display:block;font-size:11.5px;color:var(--muted)}
.hev .a{font-size:14.5px;font-weight:600;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.hfx{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hfxh{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;font-size:14px}
.hfxh .num{color:var(--muted);font-size:13px}
.hfxl{padding:0 14px 10px}
.hfxr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgb(var(--ov) / .06);font-size:13.5px}
.hfxr input{width:96px;text-align:left;direction:ltr;font:inherit;font-size:16px;background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;color:var(--ink);padding:2px 2px}
.hfxr input:focus{outline:none;border-bottom-color:var(--accent)}

/* home v4: months row, big number, grouped categories */
.hmon{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hmh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:10px 14px 2px}
.hmh span:first-child{color:var(--ink);font-weight:600;font-size:13.5px}
.hmr{display:grid;grid-auto-flow:column;grid-auto-columns:28.5%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hmr::-webkit-scrollbar{display:none}
.hmc{all:unset;box-sizing:border-box;scroll-snap-align:start;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 13px;position:relative}
.hmc+.hmc::before{content:"";position:absolute;right:0;top:14px;bottom:14px;width:1px;background:var(--line)}
.hmc .m{font-size:12.5px;color:var(--muted)}.hmc .m i{font-style:normal;font-size:10.5px;opacity:.7}
.hmc .v{font-size:16.5px;font-weight:600;white-space:nowrap;letter-spacing:-.2px}
.hmc.on{background:rgb(var(--ov) / .05)}
.hmc.on::after{content:"";position:absolute;left:28%;right:28%;bottom:5px;height:3px;border-radius:2px;background:var(--accent)}
.hmc.on .m{color:var(--ink);font-weight:600}
.hbig{display:flex;flex-direction:column;gap:8px;padding:6px 2px 4px}
.hbig .cap{font-size:13.5px;color:var(--muted)}
.hbig .mv{font-size:46px;font-weight:700;letter-spacing:-1px;line-height:1.05;color:var(--pos2);align-self:flex-start;direction:ltr;unicode-bidi:isolate}
.hbig .mv.n{color:var(--neg2)}.hbig .mv small{font-size:24px;opacity:.8;margin-inline-end:3px}
.vsb2{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.vsb2 .r{display:grid;grid-template-columns:42px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:13px}
.vsb2 .l{color:var(--muted)}
.vsb2 .tr{height:10px;border-radius:5px;background:rgb(var(--ov) / .08);overflow:hidden;display:flex}
.vsb2 .tr span{display:block;height:100%;border-radius:5px}
.vsb2 b{font-size:15px;font-weight:600;text-align:left;direction:ltr;unicode-bidi:isolate}
.hcat{display:flex;flex-direction:column;gap:10px}
.hrk{display:flex;flex-direction:column}
.hrkb{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%}
.hrkb .cic{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;grid-row:span 2}
.hrkb .cic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hrkb .n{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hrkb .n small{font-size:11.5px;color:var(--muted);margin-inline-start:6px}
.hrkb .a{font-size:15px;font-weight:600;text-align:left;direction:ltr;unicode-bidi:isolate;white-space:nowrap}.hrkb .a i{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:500;margin-inline-end:6px}
.hrkb .b{grid-column:2/4;height:4px;border-radius:2px;background:rgb(var(--ov) / .08);overflow:hidden;display:flex}

<script type="text/keenest-app">

const MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

const MGMT_URL="../board/";
const NOTION="Notion", N_PROJ="collection://30028b36-67ff-807f-bfe0-000ba9c922ed", N_SUP="collection://31c28b36-67ff-8003-b83e-000b05440f31";
const PCOLS=`url, createdTime, "שם הפרויקט", "סטטוס", "סטטוס תשלום", "תקציב (ללא מע״מ)", "כמה שולם", "date:סיום הפרויקט:start", "קרדיט"`;

  {n:"מיסים ומע״מ",k:"out"},{n:"ביטוח לאומי ופנסיה",k:"out"},{n:"רואה חשבון ומקצועי",k:"out"},{n:"עמלות בנק",k:"out"},{n:"החזר הלוואה",k:"out"},{n:"כללי",k:"out"},

  [/פז |סונול|דור אלון|ten |דלק|gett|yango|פנגו|pango|cellopark|רב.?קו|כביש 6|חניון/i,"רכב ונסיעות"],
  [/wolt|וולט|תן ביס|10bis|שופרסל|רמי לוי|סופר|קפה|aroma|ארומה|מסעדה/i,"אוכל והפקות"],
  [/פרטנר|סלקום|פלאפון|בזק|הוט|hot mobile|גולן טלקום|שכירות|ארנונה|חשמל/i,"משרד ותקשורת"],
  [/ksp|באג |איבורי|ivory|b&h|amazon|aliexpress|עלי אקספרס|השכרת ציוד|ציוד צילום/i,"ציוד והשכרות"]];

const S={tab:ls.get("cf.tab","overview"),mode:ls.get("cf.mode","month"),anchor:null,
  months:{},edits:{},rules:[],customCats:[],sync:null,realSync:null,demo:false,live:false,canWrite:true,
  f:{q:"",src:"",dir:"",cat:"",intl:false},sort:"date",hp:+(ls.get("cf.hp")||1)||1,sortRem:ls.get("cf.sortRem","1")!=="0",fxMode:ls.get("cf.fxm","out"),shown:150,
  notion:{state:"idle",msg:"",at:null,projects:[],suppliers:[]},fc:{},fcfg:{},vat:ls.get("cf.vat","1")==="1"};
