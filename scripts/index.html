:root{
  --bg:#F8F7F4;--card:#FFFFFF;--sub:#F2F1EC;--ink:#00203F;--ink2:#4D5E73;--ink3:#8592A3;
  --line:rgb(0 32 63 / .11);--sh:0 4px 14px rgb(0 32 63 / .06);--trk:#E6E9EC;
  --blue:#06B3E5;--navy:#00203F;--fuchsia:#FA1664;--graphite:#2F2F2F;
  --on:#00203F;--onfg:#FFFFFF;--onic:#06B3E5;--bb:#00203F;--bt:#FFFFFF;
  --sun1:#D9F3FC;--sun2:#BEE9F8;--pp:#FFFFFF;--ln:#E6E9EC;
  --pop:#FFFFFF;--navsh:0 12px 30px rgb(0 32 63 / .14);
  --c-draft-bg:rgb(0 32 63 / .06);--c-draft:#4D5E73;
  --c-hold-bg:rgb(0 32 63 / .09);--c-hold:#00203F;
  --c-sent-bg:rgb(6 179 229 / .14);--c-sent:#0480AB;
  --c-won-bg:rgb(46 158 98 / .14);--c-won:#1E7A3F;
  --c-lost-bg:rgb(250 22 100 / .12);--c-lost:#D80F55;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Heebo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#03080F;--card:#131C27;--sub:#0F1823;--ink:#F2F5F8;--ink2:#A2ABB6;--ink3:#6F7A87;
  --line:rgb(255 255 255 / .1);--sh:none;--trk:rgb(255 255 255 / .1);
  --on:#06B3E5;--onfg:#00203F;--onic:#00203F;--bb:#06B3E5;--bt:#00203F;
  --sun1:#0D3D62;--sun2:#0A2E4B;--pp:#174566;--ln:rgb(255 255 255 / .16);
  --pop:#18222F;--navsh:0 12px 30px rgb(0 0 0 / .5);
  --c-draft-bg:rgb(255 255 255 / .08);--c-draft:#A2ABB6;--c-hold-bg:rgb(255 255 255 / .1);--c-hold:#C9D3DE;
  --c-sent:#5FD3F5;--c-won:#6FDB9C;--c-lost:#FF6A9C;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#03080F;--card:#131C27;--sub:#0F1823;--ink:#F2F5F8;--ink2:#A2ABB6;--ink3:#6F7A87;
  --line:rgb(255 255 255 / .1);--sh:none;--trk:rgb(255 255 255 / .1);
  --on:#06B3E5;--onfg:#00203F;--onic:#00203F;--bb:#06B3E5;--bt:#00203F;
  --sun1:#0D3D62;--sun2:#0A2E4B;--pp:#174566;--ln:rgb(255 255 255 / .16);
  --pop:#18222F;--navsh:0 12px 30px rgb(0 0 0 / .5);
  --c-draft-bg:rgb(255 255 255 / .08);--c-draft:#A2ABB6;--c-hold-bg:rgb(255 255 255 / .1);--c-hold:#C9D3DE;
  --c-sent:#5FD3F5;--c-won:#6FDB9C;--c-lost:#FF6A9C;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--f);font-size:15px;line-height:1.45;direction:rtl;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
main{max-width:640px;margin:0 auto;padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
main.v-in{animation:vin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
.empty{padding:28px 18px;color:var(--ink2);text-align:center;background:var(--card);border-radius:18px;box-shadow:var(--sh)}
.wash{position:fixed;top:0;right:0;left:0;height:420px;pointer-events:none;z-index:-1;background:radial-gradient(70% 60% at 85% 8%,rgb(6 179 229 / .18),transparent 70%),radial-gradient(50% 45% at 8% 38%,rgb(250 22 100 / .08),transparent 70%)}
/* top */
.hbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.hbar .logo{height:28px;justify-self:center;display:block}
.rbtn{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh);color:var(--ink)}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:999px;background:var(--card);color:var(--ink3);box-shadow:var(--sh)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.search svg.i{width:19px;height:19px}
.ttl1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 2px 0}
/* numbers */
.cells{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0}
.cell+.cell::before{content:"";position:absolute;right:0;top:6px;bottom:6px;width:1px;background:var(--line)}
.cell b{font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.02em;transition:color .2s}
.cell span{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.cell.on b{color:var(--blue)}
.dot{display:none}
/* hero + cards */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:16px 18px;background:linear-gradient(135deg,var(--sun1),var(--sun2));display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px}
.hero .l{font-size:13px;color:var(--ink2)}.hero .v{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}.hero .s{font-size:12.5px;color:var(--ink2)}
.hero .l,.hero .v,.hero .s{justify-self:start}.hero .art{grid-column:2;grid-row:1/4;width:118px;margin:-6px -6px -14px 0;align-self:end}
.art .pp{fill:var(--pp)}.art .ln{fill:var(--ln)}.art .bb{fill:var(--bb)}.art .bt{stroke:var(--bt)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:14px 16px}
.mini{display:flex;align-items:center;gap:12px}.mini .tx{flex:1;min-width:0}.mini .tx span{display:block;font-size:12.5px;color:var(--ink2)}.mini .tx b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.spark{display:flex;align-items:flex-end;gap:4px;height:40px;width:96px}.spark i{flex:1;border-radius:3px;background:var(--blue);opacity:.35;min-height:3px}.spark i.on{opacity:1;background:var(--fuchsia)}
.sx{display:flex;align-items:baseline;gap:8px;padding:0 4px;margin-top:4px}.sx b{font-size:15.5px;font-weight:700;flex:none}.sx b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--fuchsia);margin-inline-end:8px;vertical-align:2px}.sx span{font-size:12px;color:var(--ink2)}
.sx .tot{margin-inline-start:auto;font-size:15px;font-weight:700;color:var(--ink)}
.sx.g b::before{background:#A3ABB8}
/* quote card */
.qc{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px 14px;display:flex;flex-direction:column;gap:6px;width:100%;text-align:right;cursor:pointer}
.qc .top{display:flex;align-items:baseline;gap:8px}.qc .t{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qc .p{font-size:15px;font-weight:700;display:inline-flex;align-items:baseline;gap:6px}
.was{text-decoration:line-through;color:var(--ink3);font-size:12.5px;font-weight:500}
.qc .bot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.qc .bot .age{color:var(--ink3)}.qc .bot .k{margin-inline-start:auto;white-space:nowrap}
.chip{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.c-draft{background:var(--c-draft-bg);color:var(--c-draft)}.c-hold{background:var(--c-hold-bg);color:var(--c-hold)}
.c-sent{background:var(--c-sent-bg);color:var(--c-sent)}.c-won{background:var(--c-won-bg);color:var(--c-won)}.c-lost{background:var(--c-lost-bg);color:var(--c-lost)}
.vtag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;font-size:11.5px;font-weight:700;background:var(--c-sent-bg);color:var(--c-sent)}
.vtag svg.i{width:13px;height:13px}
.lostlink{align-self:center;font-size:13px;font-weight:600;color:var(--ink2);padding:8px 14px}
/* nav */
.nav{position:fixed;z-index:20;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:calc(14px + env(safe-area-inset-right,0px));left:calc(88px + env(safe-area-inset-left,0px));max-width:560px;margin-inline-start:auto;height:64px;padding:5px;border-radius:999px;background:var(--card);display:flex;gap:2px;box-shadow:var(--navsh)}
body.nofab .nav{left:calc(14px + env(safe-area-inset-left,0px))}
.nav button{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:999px;font-size:11px;font-weight:500;color:var(--ink3);transition:color .25s,transform .2s}
.nav button svg.i{width:22px;height:22px}
.nav button.on{color:var(--onfg);font-weight:600}.nav button.on svg.i{color:var(--onic)}
.nav .pill{position:absolute;z-index:0;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--on);box-shadow:0 6px 16px rgb(0 32 63 / .25);transition:transform .42s cubic-bezier(.25,1,.5,1),width .42s cubic-bezier(.25,1,.5,1)}
.fab{position:fixed;z-index:20;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:calc(14px + env(safe-area-inset-left,0px));width:64px;height:64px;border-radius:50%;background:var(--blue);color:var(--navy);display:grid;place-items:center;box-shadow:var(--navsh);transition:transform .2s}
.fab svg.i{width:24px;height:24px;stroke-width:2.2}
body.nofab .fab,body.innav .nav,body.innav .fab{display:none}
/* quote screen */
.dbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}.dbar .ttl{text-align:center;font-size:16px;font-weight:700}
.dbar .saved{display:block;text-align:center;font-size:11.5px;color:var(--ink3);font-weight:500}
.qh{display:flex;flex-direction:column;gap:6px;padding:0 2px}.qh .cl{font-size:13px;color:var(--ink2)}.qh .nm{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.qh .tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qh .tags button.chip{cursor:pointer}
.qh .tags button.chip::after{content:"";width:6px;height:6px;border-inline-end:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin:-3px 2px 0 0;opacity:.7}
.ban{border-radius:16px;background:var(--c-lost-bg);color:var(--c-lost);padding:10px 12px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center}
.ban svg.i{width:18px;height:18px}.ban span{flex:1}
.ban .bsm{height:34px;padding:0 14px;border-radius:999px;background:var(--bb);color:var(--bt);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.ban .bsm svg.i{width:16px;height:16px}
.seg{display:flex;background:var(--trk);border-radius:999px;padding:3px}
.seg button{flex:1;text-align:center;padding:8px 0;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink2);transition:background .25s,color .25s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
:root[data-theme="dark"] .seg button.on{background:#1E2A38}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{background:#1E2A38}}
/* meta card */
.meta{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meta .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:12px;color:var(--ink2);font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--sub);border-radius:12px;padding:9px 12px;color:var(--ink);outline:none}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--blue)}
.fld textarea{resize:vertical;line-height:1.55;min-height:90px}
.fld input[type=date]{-webkit-appearance:none;appearance:none;min-height:42px;text-align:right}
/* client tab list */
.mc{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mc .r{display:flex;align-items:center;gap:10px}.mc .r b{flex:1;font-size:15px}
.mc a{color:var(--c-sent);font-weight:600;text-decoration:none}
.mdot{width:30px;height:30px;border-radius:9px;background:#2E9E62;color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.pl{height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;background:var(--trk);color:var(--ink2);white-space:nowrap}
.pl.ok{background:var(--c-won-bg);color:var(--c-won)}.pl.sbx{background:rgb(183 121 31 / .15);color:#a86c12}
.lst{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:right}.li+.li{border-top:.5px solid var(--line)}
.li .ic{width:34px;height:34px;border-radius:10px;background:var(--c-sent-bg);color:var(--c-sent);display:grid;place-items:center;flex:none}.li .ic svg.i{width:18px;height:18px}
.li .m{flex:1;min-width:0}.li .m b{display:block;font-size:15px;font-weight:600}.li .m span{display:block;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{font-weight:700}.li .ch{color:var(--ink3)}
/* popups */
.scrim{position:fixed;inset:0;z-index:40;background:rgb(10 20 35 / .32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fade .22s ease}
.pop{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(100vw - 28px),440px);max-height:calc(100dvh - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;overscroll-behavior:contain;background:var(--pop);border-radius:26px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px rgb(0 0 0 / .25);animation:popin .32s cubic-bezier(.25,1,.5,1)}
.pop.wide{width:min(calc(100vw - 20px),560px)}
@keyframes popin{from{opacity:0;transform:translate(-50%,-50%) scale(.92)}}
@keyframes fade{from{opacity:0}}
.pop h3{margin:0;font-size:18px;font-weight:800;text-align:center}.pop .sub{margin:-6px 0 0;font-size:12.5px;color:var(--ink2);text-align:center}
.pop .note{font-size:12px;color:var(--ink2);text-align:center;margin:0}
.pop .msg{font-size:13px;color:var(--ink2);min-height:0}.pop .msg.err{color:var(--c-lost);font-weight:600}
.stp{border-radius:16px;background:var(--sub);padding:12px;display:flex;flex-direction:column;gap:8px}
.stp .hd{display:flex;align-items:center;gap:10px}.stp .hd .no{width:24px;height:24px;border-radius:50%;background:var(--blue);color:var(--navy);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
.stp .hd b{flex:1;font-size:14.5px}.stp.off{opacity:.45;pointer-events:none}.stp.off .no{background:var(--trk);color:var(--ink2)}
.stp.done .no{background:#2E9E62;color:#fff}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2)}.kv b{color:var(--ink)}
.kv.t{border-top:.5px solid var(--line);padding-top:7px}.kv.t b,.kv.t span{color:var(--ink);font-weight:800;font-size:14px}
.kv.ds b{color:var(--c-lost)}
.ok2{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--c-won)}.ok2 svg.i{width:14px;height:14px}
.inp{width:100%;min-width:0;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:0 12px;color:var(--ink);outline:none}
.inp:focus{border-color:var(--blue)}
textarea.inp{height:auto;padding:9px 12px;line-height:1.5;resize:vertical}
.btns{display:flex;gap:8px}.btns>*{flex:1}
.bp{height:46px;border-radius:999px;background:var(--bb);color:var(--bt);font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.bp:disabled,.bs:disabled{opacity:.55;cursor:default}
.bs{height:46px;border-radius:999px;background:var(--trk);font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.bs.red{background:var(--c-lost-bg);color:var(--c-lost)}
.lnk{color:var(--c-sent);font-weight:600;font-size:13px;align-self:center;padding:4px}
.addd{align-self:flex-start;height:30px;padding:0 12px;border-radius:999px;background:var(--c-sent-bg);color:var(--c-sent);font-size:12.5px;font-weight:700}
.drow{display:flex;gap:8px;align-items:center}.drow .inp{flex:1;height:36px}
.ut{display:flex;background:var(--trk);border-radius:999px;padding:2px;flex:none}.ut button{width:34px;height:30px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink2)}.ut button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.xb{width:30px;height:30px;border-radius:50%;background:var(--trk);display:grid;place-items:center;color:var(--ink2);font-size:15px;flex:none}
.tg{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--sub)}
.tg .m{flex:1}.tg .m b{display:block;font-size:14px}.tg .m span{font-size:12px;color:var(--ink2)}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--trk);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .3);transition:right .2s}
.sw:checked{background:#34C759}.sw:checked::after{right:21px}
.wc{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--sub);border:1.5px solid transparent;text-align:right;width:100%}
.wc.on{border-color:var(--blue)}
.wc .drow,.wc .kv{width:100%}.wc .h{display:flex;gap:10px;align-items:center}.wc .ic{width:34px;height:34px;border-radius:10px;background:var(--c-sent-bg);color:var(--c-sent);display:grid;place-items:center;flex:none}.wc .ic svg.i{width:18px;height:18px}
.wc .m{flex:1}.wc .m b{display:block;font-size:14px}.wc .m span{font-size:12px;color:var(--ink2)}
.vl{border-radius:16px;background:var(--sub);overflow:hidden}
.vr{display:flex;align-items:center;gap:10px;padding:11px 12px}.vr+.vr{border-top:.5px solid var(--line)}
.vr .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;background:var(--trk);color:var(--ink2)}
.vr.cur .n{background:var(--blue);color:var(--navy)}
.vr .m{flex:1;min-width:0}.vr .m b{display:block;font-size:15px}.vr .m span{font-size:12px;color:var(--ink2)}
.vr.old .m b{text-decoration:line-through;color:var(--ink3);font-weight:600}
.menu{position:fixed;z-index:41;top:calc(64px + env(safe-area-inset-top,0px));left:max(16px,calc(50vw - 304px));width:230px;background:var(--pop);border-radius:18px;box-shadow:0 20px 50px rgb(0 0 0 / .25);overflow:hidden;animation:menuin .22s cubic-bezier(.25,1,.5,1);transform-origin:top left}
@keyframes menuin{from{opacity:0;transform:scale(.9)}}
.menu button{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:14.5px;font-weight:600;width:100%;text-align:right}.menu button+button{border-top:.5px solid var(--line)}
.menu .red{color:var(--c-lost)}.menu button.armed{background:var(--c-lost);color:#fff}
.mscrim{position:fixed;inset:0;z-index:40}
.sortb{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--c-sent);padding:4px 2px;align-self:center}
.sortb svg.i{width:17px;height:17px}
.menu.sm{width:210px}.menu .mhd{font-size:11.5px;color:var(--ink3);font-weight:700;padding:10px 14px 6px}
.menu .ck{width:18px;display:grid;place-items:center;color:var(--c-sent)}.menu .ck svg.i{width:16px;height:16px}
.menu button.on{color:var(--c-sent)}.menu .mhd+button{border-top:.5px solid var(--line)}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));right:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;z-index:60;font-weight:600;max-width:calc(100vw - 32px);animation:popt .3s cubic-bezier(.25,1,.5,1)}body .toast{background:#FFF0A6!important;color:#00203F!important;font-weight:600;font-size:13.5px;line-height:1.35;border-radius:999px;min-height:38px;padding:8px 18px;width:max-content;max-width:calc(100vw - 32px);box-shadow:0 10px 28px rgb(0 10 25 / .22);-webkit-backdrop-filter:none;backdrop-filter:none;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;white-space:normal;box-sizing:border-box}body .toast .undo,body .toast button,body .toast a{font-weight:800;color:#B4570A;text-decoration:none;background:none;border:0;padding:0;margin:0;margin-inline-start:auto;order:2;white-space:nowrap;cursor:pointer;font-size:inherit}
@keyframes popt{from{opacity:0;transform:translateX(50%) translateY(10px)}}
.paper .tots .grand{border-top:2px solid #FA1664;padding-top:6px;margin-top:4px;font-weight:700;font-size:17px}
/* ---------- scripts site ---------- */
.prev{align-self:center;font-size:11.5px;font-weight:700;color:#a86c12;background:rgb(183 121 31 / .15);border-radius:999px;padding:3px 10px}
body.nonav .nav{display:none}
.fab.cl{background:var(--card)}.fab.cl img{width:32px;height:32px;display:block}
.clg{width:18px;height:18px;display:block;flex:none}
.trk3{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3)}
.trk3 span{display:inline-flex;align-items:center;gap:4px}.trk3 span.done{color:var(--ink2)}.trk3 span.on{color:var(--c-sent);font-weight:700}
.trk3 em{font-style:normal;color:var(--ink3)}
.qc .age{font-size:11.5px;color:var(--ink3);flex:none}
.hero.go{width:100%;text-align:right;cursor:pointer;color:var(--ink)}
.hero .v.nm{font-size:22px}
.cell{cursor:pointer}
/* project head */
.qh .hl{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0}.qh .hl .sep{color:var(--ink3);font-size:18px}
.qh input.ed{display:block;max-width:100%;min-width:40px;border:1px solid transparent;background:none;border-radius:10px;padding:2px 6px;margin:0 -6px;outline:none;color:inherit}
.qh input.ed:focus{background:var(--card);border-color:var(--blue)}
.qh input.ed.cl{font-size:16px;color:var(--ink2)}
.qh input.ed.nm{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.qh input.ed::placeholder{color:var(--ink3)}
/* generic */
.col{display:flex;flex-direction:column;gap:10px}
.ta{display:block;width:100%;min-height:72px;border:0;background:none;border-radius:0;padding:2px 0 6px;font-size:16px;line-height:1.6;color:var(--ink);outline:none;resize:none;overflow:hidden}
.ta:focus{box-shadow:inset 0 -1.5px 0 var(--blue)}
.ta::placeholder{color:var(--ink3)}
.ehint{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);margin-top:-4px}.ehint svg.i{width:13px;height:13px}
.ta.sm{min-height:30px}
.ai{height:46px;border-radius:999px;background:var(--bb);color:var(--bt);font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.aiw .ai{flex:1}
.ai:disabled{opacity:.65;cursor:default}
.hint{font-size:12.5px;color:var(--ink2);line-height:1.5}
.sx .r{margin-inline-start:auto;font-size:12.5px;font-weight:700;color:var(--c-sent);display:inline-flex;align-items:center;gap:4px;flex:none}
.sx .r svg.i{width:15px;height:15px}.sx .r .clg{width:15px;height:15px}.sx .r:disabled{opacity:.6}
.at2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.at2 .ch2,.ch2{height:32px;padding:0 12px;border-radius:999px;background:var(--trk);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
.ch2 svg.i{width:16px;height:16px}.ch2.red{background:var(--c-lost-bg);color:var(--c-lost)}
.ch2[aria-pressed="true"]{background:var(--bb);color:var(--bt)}
.qs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:q}
.qs li{counter-increment:q;display:flex;gap:10px;font-size:14px;line-height:1.5}
.qs li::before{content:counter(q);width:22px;height:22px;border-radius:50%;background:var(--c-sent-bg);color:var(--c-sent);font-size:11.5px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:1px}
.acts{display:flex;gap:8px}.acts .bp{flex:1}.acts .bs{width:auto;padding:0 18px;flex:none}
.lnk2{align-self:flex-start;font-size:13px;font-weight:700;color:var(--c-sent);display:inline-flex;align-items:center;gap:6px}
.lnk2 .clg{width:15px;height:15px}
/* concept */
.cc1{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border:1.5px solid transparent;width:100%;text-align:right;color:var(--ink)}
.cc1 .n{width:26px;height:26px;border-radius:50%;background:var(--trk);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none;color:var(--ink2)}
.cc1 .tx{flex:1;min-width:0}.cc1 h4{margin:0 0 4px;font-size:16px}.cc1 p{margin:0;font-size:15px;line-height:1.6;color:var(--ink2);white-space:pre-wrap}
.cc1 .pk{flex:none;height:30px;padding:0 12px;border-radius:999px;background:var(--trk);font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.cc1 .pk svg.i{width:14px;height:14px}
.cc1.on{border-color:var(--blue)}.cc1.on .n{background:var(--blue);color:var(--navy)}.cc1.on .pk{background:var(--bb);color:var(--bt)}
/* script */
.vch{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.vch::-webkit-scrollbar{display:none}
.vch button{flex:none;height:34px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:var(--sh);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.vch button.on{background:var(--bb);color:var(--bt)}
.vch button.add{width:34px;padding:0;display:grid;place-items:center;color:var(--c-sent)}.vch button.add svg.i{width:18px;height:18px}
.vch input{flex:none;width:170px;height:34px;border-radius:999px;border:1px solid var(--blue);background:var(--card);padding:0 14px;outline:none;color:var(--ink)}
.drs{display:flex;align-items:center;gap:8px}
.dseg{flex:1;min-width:0;display:flex;background:var(--trk);border-radius:999px;padding:3px;overflow-x:auto;scrollbar-width:none}
.dseg::-webkit-scrollbar{display:none}
.dseg button{flex:1 0 auto;min-width:78px;text-align:center;padding:7px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.dseg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
:root[data-theme="dark"] .dseg button.on{background:#1E2A38}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dseg button.on{background:#1E2A38}}
.drs .sv{font-size:13px;font-weight:700;color:var(--c-sent);white-space:nowrap;flex:none;padding:6px 2px}
.cnote{border-radius:14px;background:var(--c-sent-bg);padding:9px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.cnote span{flex:1}.cnote .x{color:var(--ink3);font-size:15px;line-height:1}
.aiw{display:flex;gap:8px}
.imp{width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;flex:none;color:var(--ink)}
.imp svg.i{width:19px;height:19px}.imp:disabled{opacity:.6}
.tb{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.th,.tr2{display:grid;grid-template-columns:22px 1fr 1fr 18px;gap:10px;padding:10px 12px;font-size:13.5px;line-height:1.5}
.th{font-size:11.5px;font-weight:700;color:var(--ink3);background:var(--sub);padding-block:8px}
.rw+.rw{border-top:.5px solid var(--line)}
.tr2{cursor:pointer;-webkit-user-select:none;user-select:none}
.tr2 .no{font-size:11.5px;font-weight:800;color:var(--ink3);padding-top:2px}
.tr2 .c{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}.tr2 .c.h{font-weight:600}
.tr2 .c.e{color:var(--ink3);font-weight:400}
.tr2 .cc{display:flex;justify-content:center;padding-top:2px}
.tr2 .cc i,.seg .n{font-style:normal;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--fuchsia);color:#fff;font-size:10.5px;font-weight:800;display:inline-grid;place-items:center;line-height:1}
.rw.sel .tr2,.rw.sel .xp{background:var(--c-sent-bg)}
.xp{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.xp .seg{background:var(--trk)}.xp .seg button{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;padding:7px 0}
.xp .seg .clg{width:15px;height:15px}
.bub{background:var(--card);border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.55;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
.bub .alt{border-inline-start:2px solid var(--blue);padding-inline-start:9px;display:flex;flex-direction:column;gap:3px}
.bub .alt b{font-size:11px;color:var(--ink3);font-weight:700}
.bub .why{font-size:12.5px;color:var(--ink2)}
.bub .row{display:flex;gap:6px;flex-wrap:wrap}
.bsm2{height:32px;padding:0 12px;border-radius:999px;background:var(--bb);color:var(--bt);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.bsm2.g{background:var(--trk);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:32px;padding:0 12px;border-radius:999px;background:var(--card);box-shadow:var(--sh);font-size:12.5px;font-weight:600;color:var(--ink2)}
.chips button:disabled{opacity:.5}
.inp2{display:flex;align-items:flex-end;gap:8px;background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:5px 5px 5px 5px;padding-inline-start:14px}
.inp2 textarea{flex:1;min-width:0;border:0;background:none;outline:none;resize:none;padding:7px 0;line-height:1.45;max-height:140px;color:var(--ink)}
.inp2 .snd{width:36px;height:36px;border-radius:50%;background:var(--bb);color:var(--bt);display:grid;place-items:center;flex:none}
.inp2 .snd svg.i{width:17px;height:17px}.inp2 .snd:disabled{opacity:.6}
.cmt{display:flex;gap:9px;font-size:13.5px;line-height:1.5}
.cmt .av{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;flex:none}
.cmt .av.t{background:var(--blue);color:var(--navy)}
.cmt .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cmt .m small{color:var(--ink3);font-size:11px;margin-inline-start:5px;font-weight:500}
.cmt .m .tx{white-space:pre-wrap}
.cmt.done{opacity:.55}
.cmt .lk{align-self:flex-start;font-size:12px;font-weight:700;color:var(--c-sent)}
.chk{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2)}
.chk input{width:18px;height:18px;accent-color:var(--blue);margin:0}
.fl2{display:flex;flex-direction:column;gap:4px}.fl2>span{font-size:11.5px;font-weight:700;color:var(--ink3)}
.addl{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;font-size:13.5px;font-weight:700;color:var(--c-sent);border-top:.5px solid var(--line);width:100%}
.addl svg.i{width:16px;height:16px}
.tb .emp{padding:18px 14px;text-align:center;color:var(--ink2);font-size:13.5px}
/* chat */
.dbar .ttl.cht{display:flex;align-items:center;justify-content:center;gap:7px}
.ctxs{display:flex;align-items:center;gap:8px;background:var(--c-sent-bg);border-radius:14px;padding:9px 12px;font-size:12.5px;font-weight:600}
.ctxs .clg{width:15px;height:15px}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-start;background:var(--bb);color:var(--bt);border-end-start-radius:6px}
.msg.me .by{display:block;font-size:11px;font-weight:700;opacity:.75;margin-bottom:2px}
.msg.cl{align-self:flex-end;background:var(--card);box-shadow:var(--sh);border-end-end-radius:6px}
.msg.cl .by{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:4px}
.msg.cl .by .clg{width:14px;height:14px}
.msg .ap{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;white-space:normal}
.msg .ap span{font-size:12px;color:var(--ink2)}
.typing{align-self:flex-end;font-size:12.5px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.typing .clg{width:15px;height:15px;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.att{font-size:12.5px;color:var(--ink2)}.att button{color:var(--c-sent);font-weight:700}
.cbar{position:fixed;z-index:20;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:calc(14px + env(safe-area-inset-right,0px));left:calc(14px + env(safe-area-inset-left,0px));max-width:612px;margin-inline:auto}
.cbar .inp2{box-shadow:var(--navsh);border-radius:28px;padding:6px;padding-inline-start:6px;align-items:flex-end}
.cbar .at{width:40px;height:40px;border-radius:50%;background:var(--trk);display:grid;place-items:center;flex:none;cursor:pointer}
.cbar .at svg.i{width:19px;height:19px}
.cbar .snd{width:40px;height:40px}
.cbar textarea{padding:9px 0}
.busyline{display:flex;align-items:center;gap:8px;justify-content:center;font-size:13px;color:var(--ink2);padding:6px}
.busyline .clg{width:16px;height:16px;animation:spin 1.6s linear infinite}
.bred{height:46px;border-radius:999px;background:var(--fuchsia);color:#fff;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;width:100%}
.drop{border:1.5px dashed var(--ln);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer;text-align:center}
.drop svg.i{width:22px;height:22px;color:var(--c-sent)}
/* paper */
#pdfHost{position:fixed;left:-20000px;top:0;width:794px;pointer-events:none}
.paper{width:794px;background:#fff;color:#1b1b1b;font-family:"Assistant K",Arial,sans-serif;direction:rtl;padding:48px 52px;display:flex;flex-direction:column;gap:18px;font-size:13.5px;line-height:1.6}
.paper .cover{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding-bottom:18px;border-bottom:3px solid #06B3E5}
.paper .cover img{height:42px}
.paper .kind{font-size:12px;letter-spacing:.08em;color:#FA1664;font-weight:700}
.paper .pn{font-family:"Secular K","Assistant K",sans-serif;font-size:30px;line-height:1.2;margin:2px 0 4px}
.paper .sn{font-size:18px;font-weight:600;color:#0784ad}
.paper .mt{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#666;margin-top:8px}
.paper .mt b{color:#1b1b1b;font-weight:600}
.paper table{width:100%;border-collapse:collapse}
.paper th{background:#e6f6fc;color:#0784ad;text-align:right;padding:8px 10px;font-size:12.5px}
.paper td{padding:9px 10px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:pre-wrap}
.paper td.n{width:28px;color:#888;font-size:12px}
.paper th.see{width:47%}
.paper td.h{background:#fdf6f8}
.paper td.s{background:#f3fafd}
.paper .blk{white-space:pre-wrap}
.paper .foot{display:flex;justify-content:space-between;font-size:11px;color:#888;border-top:1px solid #e3e3e3;padding-top:8px}
.cc1:active,.ch2:active,.vch button:active,.imp:active,.ai:active,.bsm2:active{transform:scale(.97)}
.cc1,.ch2,.vch button,.imp,.ai,.bsm2{transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .2s}

.qc .chip{align-self:flex-start}

.art .pb{fill:#00203F}
:root[data-theme="dark"] .art .pb{fill:#F2F5F8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .art .pb{fill:#F2F5F8}}
.vch button.on{display:inline-flex;align-items:center;gap:4px;padding-inline-end:5px}
.vch .kb{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255 / .16)}
.vch .kb svg.i{width:16px;height:16px}
:root[data-theme="dark"] .vch .kb{background:rgb(0 32 63 / .14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vch .kb{background:rgb(0 32 63 / .14)}}
.okb{border-radius:16px;background:var(--c-won-bg);color:var(--c-won);padding:10px 14px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.okb svg.i{width:18px;height:18px}.okb span{flex:1}.okb button{font-size:13px;font-weight:600;color:var(--ink2);text-decoration:underline;padding:4px}
.acts .bs.wide{flex:1;width:100%}
.acts .bp,.acts .bs{white-space:nowrap}
.fin{background:linear-gradient(135deg,var(--sun1),var(--sun2));border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fin b{font-size:16px}.fin p{margin:-4px 0 0;font-size:13px;color:var(--ink2);line-height:1.5}
.lnk3{align-self:center;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--c-sent);padding:2px 8px}.lnk3 svg.i{width:16px;height:16px}
.sortb{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--c-sent);padding:4px 2px;align-self:center}
.sortb svg.i{width:17px;height:17px}
.menu.sm{width:210px}.menu .mhd{font-size:11.5px;color:var(--ink3);font-weight:700;padding:10px 14px 6px}
.menu .ck{width:18px;display:grid;place-items:center;color:var(--c-sent)}.menu .ck svg.i{width:16px;height:16px}
.menu button.on{color:var(--c-sent)}
.menu .mhd+button{border-top:.5px solid var(--line)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thb{position:relative;width:52px;height:52px}.thb img{width:52px;height:52px;object-fit:cover;border-radius:12px;display:block}
.thb button{position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;line-height:1;display:grid;place-items:center}
label.imp{cursor:pointer}
/* bell */
.dbar.b2{grid-template-columns:minmax(96px,auto) 1fr minmax(96px,auto)}
.dbar.b2 .hb{display:flex;gap:8px;justify-content:flex-end}
.rbtn.bellon{width:auto;padding:0 12px;gap:5px;display:inline-flex;align-items:center;border-radius:999px;background:var(--c-sent-bg);color:var(--c-sent);box-shadow:none;font-size:12.5px;font-weight:700;white-space:nowrap}
.rbtn.bellon svg.i{width:17px;height:17px}
.bq{display:flex;gap:6px}.bq button{flex:1;height:36px;border-radius:999px;background:var(--trk);font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink)}
.bq button.on{background:var(--bb);color:var(--bt)}
.bw{display:flex;flex-direction:column;gap:6px}
.bwr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--sub);cursor:pointer}
.bwr .ic{width:32px;height:32px;border-radius:10px;background:var(--c-sent-bg);color:var(--c-sent);display:grid;place-items:center;flex:none}.bwr .ic svg.i{width:18px;height:18px}
.bwr .m{flex:1}.bwr .m b{display:block;font-size:14px}.bwr .m small{font-size:12px;color:var(--ink2)}
.bmsg{font-size:13px;color:var(--c-lost);font-weight:600;text-align:center}.bmsg:empty{display:none}


/* project header: balanced bar, reminder chip by the name */
.remchip{flex:none;align-self:center;height:30px;padding:0 10px;margin-inline-start:auto;border-radius:999px;background:var(--c-sent-bg);color:var(--c-sent);display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;white-space:nowrap}
.remchip svg{width:15px;height:15px}
/* videos as a list (option ה) */
.vlh{margin-top:4px}
.vlist{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.vrow{display:flex;align-items:center;position:relative;min-height:46px}
.vrow+.vrow::before{content:"";position:absolute;top:0;right:14px;left:14px;height:1px;background:var(--line)}
.vrow .vn{flex:1;min-width:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px;font-weight:600;color:var(--ink);text-align:start}
.vrow .vn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .vn i{width:18px;flex:none}
.vrow .vn svg.i{width:18px;height:18px;flex:none}
.vrow.on .vn{color:var(--c-sent)}
.vrow .kb{width:36px;height:36px;margin-inline-end:6px;border-radius:50%;display:grid;place-items:center;background:var(--trk);color:var(--ink);flex:none}
.vrow .kb svg.i{width:16px;height:16px}
.vrow.add .vn{color:var(--c-sent)}
.vrow input{flex:1;height:36px;margin:5px 10px;border-radius:10px;border:1px solid var(--blue);background:var(--card);padding:0 12px;outline:none;color:var(--ink);font:inherit;font-size:15px}

/* bell popup — same language as the board reminder (option B) */
.pop.bpop{gap:12px}
.bhd{display:flex;align-items:center;gap:10px}
.bbi{width:40px;height:40px;border-radius:13px;background:var(--c-sent-bg);color:var(--c-sent);display:grid;place-items:center;flex:none}
.bbi svg{width:21px;height:21px}
.bm{flex:1;min-width:0}.bm b{display:block;font-size:16px;font-weight:800;color:var(--ink)}
.bm small{display:block;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bxx{width:34px;height:34px;border-radius:50%;background:var(--trk);color:var(--ink);display:grid;place-items:center;flex:none}
.bxx svg{width:16px;height:16px}
.bpop .inp.btx,.bpop .inp.bat{width:100%;min-width:0;max-width:100%;height:46px;border:0!important;border-radius:14px;background:var(--trk);box-shadow:none!important;padding:0 14px;font-size:16px;color:var(--ink);outline:none;display:block}
.bpop .inp.bat{text-align:center;font-weight:600;-webkit-appearance:none;appearance:none}
.bpop .inp.bat[hidden]{display:none}
.bpop .inp.btx:focus,.bpop .inp.bat:focus{box-shadow:inset 0 0 0 1.5px var(--blue)!important}
.bpop .bq button{height:38px}
.bnote{font-size:12.5px;color:var(--ink2);text-align:center}
.bgo{width:100%;height:46px;border-radius:999px;background:var(--bb);color:var(--bt);font-size:15px;font-weight:700}
.bdel{align-self:center;background:none;font-size:13.5px;font-weight:600;color:var(--c-lost);padding:2px 8px}

/* bottom bar: stretches smoothly when the + comes and goes, instead of jumping */
@media (prefers-reduced-motion:no-preference){
  .nav{transition:left .45s var(--ios-move,cubic-bezier(.25,1,.5,1))}
  .fab{transition:opacity .3s ease,transform .45s var(--ios-move,cubic-bezier(.25,1,.5,1))}
}
body.nofab .fab{display:grid!important;opacity:0;transform:scale(.6)!important;pointer-events:none}
body.innav .fab{display:none!important}

/* collapsible videos list */
.vlh{align-items:center;cursor:pointer;-webkit-user-select:none;user-select:none}
.vtog{margin-inline-start:auto;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--c-sent);padding:4px 2px}
.vtog svg.i{width:16px;height:16px;transition:transform .35s var(--ios-move,ease)}
.vlist.shut .vrow:not(.on){display:none}
.vlist.shut .vrow.on::before{display:none}
/* one height for every pill / circle control on the project page, one gap between blocks */
.dseg{height:44px;align-items:stretch}.dseg button{height:auto}
.aiw .ai,.aiw .imp{height:44px!important;min-height:44px}
.aiw .imp{width:44px!important;flex:none}
.drs #snapDraft{height:44px;display:inline-flex;align-items:center}
.vrow .kb{width:34px;height:34px}
/* drafts row and Claude row share one grid: same main width, side slot centred under/over each other */
.drs,.aiw{display:grid!important;grid-template-columns:minmax(0,1fr) 64px;gap:8px;align-items:center}
.drs .dseg,.aiw .ai{width:100%!important;min-width:0}
.drs #snapDraft,.aiw .imp{justify-self:center}
/* ===== Keenest dialog language (all popups look like the reminder popup) ===== */
.kd-hd{display:flex;align-items:center;gap:10px;margin:0}
.kd-hd .kd-t{flex:1;min-width:0;text-align:start}
.kd-hd .kd-t>h3{margin:0!important;text-align:start!important;font-size:17px!important;font-weight:800!important;line-height:1.25;display:flex;align-items:center;gap:8px}
.kd-hd .kd-t>.sub,.kd-hd .kd-t>small{display:block;margin:2px 0 0!important;text-align:start!important;font-size:12.5px;opacity:.7}
.kd-x{width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;flex:none;cursor:pointer;background:rgb(127 140 160 / .16);color:inherit;padding:0}
.kd-x svg{width:16px;height:16px}
/* solid card, no glass, no white top line */

.kd .sheet::before{display:none!important}

.kd .actions,.pop.kd .btns{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:8px!important}
.kd .actions .spacer{display:none!important}
.kd .actions .btn:not(.ghost):not(.danger),.pop.kd .btns .bp{width:100%;height:46px;border-radius:999px;font-weight:700;font-size:15px;justify-content:center;order:-1}
.kd .actions .btn:not(.ghost):not(.danger){background:var(--sel-bg)!important;color:var(--sel-fg)!important;border:0!important}

.kd .actions:not(.kd-hasp) .btn.danger,.pop.kd .btns:not(.kd-hasp) :is(.bred,.bs.red){width:100%;height:46px;border-radius:999px;justify-content:center;font-weight:700}

.kd .form input[type=datetime-local],.kd .form input[type=date]{padding-left:10px!important}

/* ===== iOS motion layer (shared by all Keenest sites) — per Apple motion principles =====
   critically damped everywhere (no bounce, no overshoot); unhurried; press feedback on touch-down;
   exits mirror entrances; only transform + opacity animate; no fractional centering transforms
   (they make text jump a pixel when an animation ends); selected tabs keep the same font weight. */
:root{--ios-move:cubic-bezier(.22,1,.36,1);--ios-in:cubic-bezier(.4,0,1,1)}
@supports (animation-timing-function:linear(0,1)){:root{
  --ios-move:linear(0,.109,.309,.501,.656,.77,.849,.903,.938,.961,.976,.985,.991,.994,1)}}
html,body{overflow-x:clip}
#view,main{overflow-x:clip}
/* center popups and toasts without translate(-50%) */
.pop{left:0!important;right:0!important;top:0!important;bottom:0!important;margin:auto!important;height:fit-content!important;transform:none!important}
.toast{left:0!important;right:0!important;margin-inline:auto!important;width:max-content;max-width:calc(100vw - 32px);transform:none!important}
.pop,.sheet{will-change:transform,opacity}
/* same weight selected / not selected, so labels never shift */
:is(.wseg,.seg,.dseg,nav.tabs,nav.nav)>:is(button,a){font-weight:600!important}
@media (prefers-reduced-motion:no-preference){
  /* press: sinks on touch-down, settles back slowly, no bounce */
  :where(button,a,.chip,.cell,label.bwr){transition:transform .45s var(--ios-move)}
  :where(button,a,.chip,.cell,label.bwr):active{transform:scale(.97);transition:transform .12s ease-out}
  /* rows: no shrink and no fade (both make text shift by a pixel) — just a soft highlight behind them */
  .row:active,.qc:active,.li:active,.cc1:active,div[data-open]:active{transform:none!important;opacity:1!important}
  :where(.row,div[data-open],.qc,.li,.cc1):not(:has(:is(button,select,input,textarea,a,label):active)):active{background-color:rgb(127 140 160 / .12)!important}
  /* one press depth everywhere (older rules pressed some buttons deeper) */
  :is(button,.cell,.chip,.btn,.rbtn,.sbtn,.hpill,.fold,.pchip,.wc,.go,.go2,.bp,.bs,.pen,.who,.imp,.ai,.ch2,.bsm2):active{transform:scale(.97)!important}
  /* segmented controls and tab bars don't shrink — their pill slides */
  :is(.wseg,.seg,.dseg,nav.tabs,nav.nav)>:is(button,a),:is(.wseg,.seg,.dseg,nav.tabs,nav.nav)>:is(button,a):active{transform:none!important;transition:color .25s!important}
  /* popups: grow in, shrink out the same way */
  .scrim{animation:iosFade .35s ease both}
  .sheet,.cx-card,.pop{animation:iosPopIn .45s var(--ios-move) both!important}
  .ios-ghost{pointer-events:none}
  .ios-ghost .scrim,.ios-ghost .cx-scrim{animation:iosFadeOut .26s ease forwards!important}
  .ios-ghost .sheet,.ios-ghost .cx-card,.ios-ghost .pop{animation:iosPopOut .24s var(--ios-in) forwards!important}
  .ios-ghost .menu,.ios-ghost .srt-menu,.ios-ghost .cx-menu{animation:iosMenuOut .2s var(--ios-in) forwards!important}
  .srt-menu,.menu{transform-origin:top left;animation:iosMenu .38s var(--ios-move) both!important}
  .cx-menu{animation:iosMenu .38s var(--ios-move) both!important}
  .toast{animation:iosToast .45s var(--ios-move) both!important}
  /* open task unfolds under its row */
  .xwrap.ios-open .xpn{animation:iosReveal .42s var(--ios-move) both}
  /* content changes: calm cross-fade with a small drift */
  #view.a-tl>*{animation:iosSlideL .42s var(--ios-move) both!important}
  #view.a-tr>*{animation:iosSlideR .42s var(--ios-move) both!important}
  #view.a-load>*{animation:iosRise .5s var(--ios-move) both!important}
  /* filter change: no fade on the list (a fading layer re-snaps text by a pixel) — rows glide instead */
  #view.a-flt>*{animation:none!important}
  #view.ios-push>*,main.v-in{animation:iosSlideL .45s var(--ios-move) both!important}
  #view.ios-back>*{animation:iosSlideR .45s var(--ios-move) both!important}
  .ios-thumb{position:absolute;z-index:0;pointer-events:none;will-change:transform,width}
  .ios-flip{position:relative;z-index:1;transition:none!important}
  .ios-flip.ios-flip-on{background:transparent!important;box-shadow:none!important}
}
@media (prefers-reduced-motion:reduce){
  .scrim,.sheet,.pop,.menu,.srt-menu,.toast,main.v-in{animation:iosFade .2s ease both!important}
}
@keyframes iosFade{from{opacity:0}}
@keyframes iosFadeOut{to{opacity:0}}
@keyframes iosFadeQ{from{opacity:.55}}
@keyframes iosPopIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes iosPopOut{to{opacity:0;transform:scale(.96)}}
@keyframes iosMenu{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes iosMenuOut{to{opacity:0;transform:scale(.92)}}
@keyframes iosToast{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes iosReveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}} /* unfolds downward; clip-path is painted, not layered, so text never re-snaps */
@keyframes iosSlideL{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes iosSlideR{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes iosRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Claude ---------- */
let SAMPLE=null;
async function sampleFn(){if(SAMPLE===null){try{SAMPLE=await claude.use("sample")}catch(_){SAMPLE=false}}return SAMPLE||null}
const aiErr=e=>{const c=e&&e.code;return c==="not_granted"?"צריך לאשר ל-Claude לעבוד בדף (בחלון שקופץ).":c==="rate_limited"?"יותר מדי בקשות ברגע. נסו שוב עוד דקה.":c==="images_unavailable"||c==="image_rejected"?"לא הצלחתי לשלוח את התמונה. נסו קובץ JPG או PNG.":c==="invalid_json"?"Claude ענה בפורמט לא צפוי. נסו שוב.":"Claude לא הצליח לענות כרגע. נסו שוב."};
function ctx(p,v,withScript=true){
  let s=`את/ה כותב/ת תסריטים בכיר/ה בחברת "קינסט" – חברת הפקות וידאו בוטיק שמשלבת AI, באיכות קולנועית. כתוב/כתבי תמיד בעברית טבעית ועניינית. התפקיד שלך הוא קריאייטיב ותסריט בלבד: אל תעסוק/י בתקציב, עלויות, מחירים או לוחות זמנים של הפקה, ואל תכניס/י הערות, הסברים או הנחות לתוך שורות התסריט – כל שורה היא רגע בסרטון בלבד.\n\nפרויקט: ${p.name||"ללא שם"}${p.client?` · לקוח: ${p.client}`:""}\nשם הפרויקט הוא שם עבודה פנימי בלבד – אסור להכניס אותו לתוכן הסרטון (טקסט על המסך, כרטיס סיום, סלוגן או קריינות).\n`;
  if(p.briefRefined||p.briefRaw)s+=`\nבריף:\n${p.briefRefined||p.briefRaw}\n`;
  if(p.concept)s+=`\nקונספט שנבחר:\n${p.concept}\n`;
  if(withScript&&v&&v.rows&&v.rows.length){s+=`\nהתסריט הנוכחי (${v.title}) – שורות ממוספרות, רואים | שומעים:\n`+v.rows.map((r,i)=>`${i+1}. רואים: ${r.see||"—"} | שומעים: ${r.hear||"—"}`).join("\n")+"\n"}
  return s}
/* Claude ממשיך גם אם יוצאים מהאתר באמצע: אם הקריאה נקטעה בזמן שהדף היה ברקע, מחכים לחזרה ומנסים שוב לבד */
let wasHidden=false;document.addEventListener("visibilitychange",()=>{if(document.hidden)wasHidden=true});
const waitVisible=()=>new Promise(r=>{if(!document.hidden){setTimeout(r,400);return}const f=()=>{if(!document.hidden){document.removeEventListener("visibilitychange",f);setTimeout(r,600)}};document.addEventListener("visibilitychange",f)});
let aiBusy=0;
async function aiJSON(prompt,opts={}){const sm=await sampleFn();if(!sm)throw {code:"unavailable"};
  aiBusy++;try{ls.set("scripts.busy",String(Date.now()));
    for(let i=0;;i++){wasHidden=document.hidden;
      try{return await sm.json(prompt,{...opts,model:"claude-opus-5-5",modelTier:"complex"})}
      catch(e){const c=e&&e.code;if(i<3&&(wasHidden||document.hidden)&&!["not_granted","rate_limited","unavailable"].includes(c)){await waitVisible();toast("Claude ממשיך מאיפה שעצר…");continue}throw e}}}
  finally{aiBusy--;if(!aiBusy)ls.set("scripts.busy","")}}
setTimeout(()=>{const b=+ls.get("scripts.busy","")||0;if(b&&Date.now()-b<20*60000){ls.set("scripts.busy","");toast("Claude נקטע כשהאתר נסגר – צריך ללחוץ שוב על הפעולה")}},1500);

function vBrief(p){const busy=S.thinking.brief;const tab=S.btab||(p.briefRefined?"ref":"raw");

  const refineBtn=`<button class="ai" id="refine" ${busy?"disabled":""}>${CL}${busy?"Claude מחדד…":"חידוד עם Claude"}</button>`;
  if(tab==="raw"){const ims=S.briefImgs||[];
    return seg+`<div class="card col"><textarea class="ta" id="p_briefRaw" data-p="briefRaw" rows="2" placeholder="הבריף מהלקוח">${esc(p.briefRaw||"")}</textarea>
    ${ims.length?`<div class="thumbs">${ims.map((f,i)=>`<span class="thb"><img src="${imgUrl(f)}" alt=""><button data-rmimg="${i}" aria-label="הסרת התמונה">×</button></span>`).join("")}</div>`:""}</div>

  if(!p.briefRefined&&!(p.briefQuestions||[]).length)return seg+`<div class="card col"><div class="hint">עוד אין בריף מחודד.</div>${refineBtn}</div>`;
  const qs=p.briefQuestions||[];
  return seg+`<div class="sx"><b>בריף מחודד</b><button class="r" id="refine" ${busy?"disabled":""}>${CL}${busy?"Claude מחדד…":"לחדד שוב"}</button></div><div class="card col"><textarea class="ta" id="p_briefRefined" data-p="briefRefined" rows="2">${esc(p.briefRefined||"")}</textarea></div>
    ${qs.length?`<div class="sx"><b>שאלות ללקוח</b><button class="r" id="copyQs">${I.cp}העתקה</button></div><div class="card"><ol class="qs">${qs.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></div>`:""}
    <div class="acts"><button class="bp" data-stage="concept">המשך לקונספט ←</button></div>`}
const bSig=p=>String(p.briefRaw||"").trim()+"\u0001"+String(p.briefRefined||"").trim();
function conceptReset(p){const sg=bSig(p);if(p.conceptSig===undefined){p.conceptSig=sg;return false}if(p.conceptSig===sg)return false;
  p.conceptSig=sg;if(!(p.concepts||[]).length&&!(p.concept||"").trim())return false;
  p.concepts=[];p.concept="";p.conceptPick=null;if(!S.chat)S.pcc=p.id;else if(S.chat.concept&&S.chat.concept.length){S.chat.concept=[];try{saveChat()}catch(_){}}
  setTimeout(()=>{saveP(p);toast("הבריף השתנה – הקונספט התאפס")},0);return true}
function vConcept(p){conceptReset(p);const busy=S.thinking.concept;const cs=p.concepts||[];
  return `<div class="sx"><b>כיווני קונספט</b>${cs.length?`<button class="r" id="genConcepts" ${busy?"disabled":""}>${busy?"Claude חושב…":I.redo+"3 חדשים"}</button>`:""}</div>
  ${cs.length?cs.map((c,i)=>{const on=p.conceptPick===i;return `<button class="cc1${on?" on":""}" data-pick="${i}"><span class="n">${i+1}</span><span class="tx"><h4>${esc(c.title)}</h4><p>${esc(c.text)}</p></span><span class="pk">${on?I.chk+"נבחר":"בחירה"}</span></button>`}).join("")
    :`<div class="card col"><button class="ai" id="genConcepts" ${busy?"disabled":""}>${CL}${busy?"Claude חושב…":"3 כיוונים מ-Claude"}</button></div>`}

  <div class="card col"><textarea class="ta" id="p_concept" data-p="concept" rows="2" placeholder="הקונספט הנבחר">${esc(p.concept||"")}</textarea>

function vScript(p){const v=curVideo(p);const busy=S.thinking.script;const vs=vers(v);
  const vt=p.videos.map(x=>({...x,title:x.altOf&&p.videos.filter(y=>!y.altOf).length<2?String(x.title).replace(/^.*·\s*/,""):x.title}));

  const note=d&&d.cnote&&!d.cnoteHide?`<div class="cnote"><span>💡 ${esc(d.cnote)}</span><button class="x" data-cnotex="${esc(d.id)}" aria-label="הסתרת ההערה">✕</button></div>`:"";
  const aiw=`<div class="aiw"><button class="ai" id="writeScript" ${busy?"disabled":""}>${CL}${busy?"Claude כותב…":v.rows.length?"Claude – לשפר או כיוון חדש":"Claude יכתוב דראפט ראשון"}</button><button class="imp" id="importScript" aria-label="ייבוא תסריט קיים" ${busy?"disabled":""}>${I.imp}</button></div>`;
  const cm=S.comments.filter(c=>c.vid===v.id&&!c.resolved);
  const rows=v.rows.map((r,i)=>{const n=cm.filter(c=>c.rowId===r.id).length;const op=S.openRow===r.id;
    return `<div class="rw${op?" sel":""}" data-row="${esc(r.id)}"><div class="tr2" role="button" tabindex="0" aria-expanded="${op}" aria-label="שורה ${i+1}"><span class="no">${i+1}</span><span class="c${r.see?"":" e"}">${esc(r.see||"רואים")}</span><span class="c h${r.hear?"":" e"}">${esc(r.hear||"שומעים")}</span><span class="cc">${n?`<i>${n}</i>`:""}</span></div>${op?rowPanel(p,v,r,n):""}</div>`}).join("");
  return chips+drs+note+aiw+`<div class="tb"><div class="th"><span>#</span><span>רואים</span><span>שומעים</span><span class="uhc">${undoBtn()}</span></div>${rows||`<div class="emp">אין עדיין שורות.</div>`}<button class="addl" id="addRow">${I.plus}שורה</button></div>${finBlock(p,v)}`}
function finBlock(p,v){if(!v.rows.length)return "";const vs=vers(v);const k=id=>vs.findIndex(d=>d.id===id)+1;
  const fin=v.final&&vs.some(d=>d.id===v.final)?v.final:null;const kc=k(v.cur);
  if(fin&&fin===v.cur)return `<div class="okb">${I.chk}<span>התסריט אושר כסופי${kc?" · דראפט "+kc:""}</span><button id="unFinal">ביטול</button></div><div class="acts"><button class="bs wide" id="pdfScript">${I.dl}PDF לשליחה ללקוח</button></div>`;
  return (fin?`<div class="okb">${I.chk}<span>דראפט ${k(fin)} אושר כסופי</span><button data-ver="${esc(fin)}">לפתוח</button><button id="unFinal">ביטול</button></div>`:"")+
  `<div class="fin"><b>${fin?"לאשר את הדראפט הזה במקום?":"סיימתם את התסריט?"}</b><p>אישור שומר את ${kc?"דראפט "+kc:"התסריט"} כגרסה הסופית${p.videos.length>1?" של "+esc(v.title):""}${p.videos.filter(x=>(x.rows||[]).length).length<=1?" ומסמן את הפרויקט כאושר":""}.</p><button class="bp" id="mkFinal">${I.chk}אישור כתסריט סופי</button><button class="lnk3" id="pdfScript">${I.dl}הורדת PDF</button></div>`}
function rowPanel(p,v,r,n){const m=S.rmode;const rid=esc(r.id);
  let body="";
  if(m==="ai"){const st=S.rowAI[r.id]||{};
    body=`${(st.opts||[]).map((o,i)=>`<div class="bub"><div class="alt"><b>רואים</b><span>${esc(o.see)}</span><b>שומעים</b><span>${esc(o.hear)}</span></div>${o.why?`<div class="why">${esc(o.why)}</div>`:""}<div class="row"><button class="bsm2" data-applyopt="${i}">להחליף בשורה</button><button class="bsm2 g" data-optcm="${i}">להוסיף כהצעה בהערות</button></div></div>`).join("")}
      ${st.busy?`<div class="busyline">${CL}Claude חושב…</div>`:""}${st.err?`<div class="hint" style="color:var(--c-lost)">${esc(st.err)}</div>`:""}

  else if(m==="cm"){const cs=S.comments.filter(c=>c.rowId===r.id).sort((a,b)=>(a.at||"").localeCompare(b.at||""));
    body=`${cs.map(c=>{const a=String(c.author||"?");return `<div class="cmt${c.resolved?" done":""}"><span class="av${/^צ/.test(a)?" t":""}">${esc(a[0]||"?")}</span><div class="m"><div><b>${esc(a)}</b><small>${fmtD(c.at)}${c.resolved?" · נסגר":""}</small></div>${c.text?`<div class="tx">${esc(c.text)}</div>`:""}

      ${!c.resolved?`<button class="lk" data-cmdone="${esc(c.id)}">סגירת ההערה</button>`:""}</div></div>`}).join("")||`<div class="hint">אין הערות על השורה.</div>`}
      <div class="inp2"><textarea id="cm_${rid}" rows="1" placeholder="הערה ל${esc(ME()==="רן סופר"?"צפריר":"רן")}…"></textarea><button class="snd" data-cmadd aria-label="הוספת הערה">${I.send}</button></div>
      <label class="chk"><input type="checkbox" id="cmsug_${rid}"> לצרף הצעת נוסח (בלי לשנות את השורה)</label>

  else{body=`<label class="fl2"><span class="flh"><span>רואים</span><button type="button" class="uhb fu" data-undorow data-uf="see" title="ביטול" aria-label="ביטול הפעולה האחרונה">${I.undo}</button></span><textarea class="ta sm" data-f="see" rows="2" placeholder="מה רואים בפריים">${esc(r.see||"")}</textarea></label>

  return `<div class="xp"><div class="seg" role="tablist"><button data-rmode="edit" class="${m==="edit"?"on":""}">${I.pen}עריכה</button><button data-rmode="cm" class="${m==="cm"?"on":""}">הערות${n?` <i class="n">${n}</i>`:""}</button><button data-rmode="ai" class="${m==="ai"?"on":""}">${CL}Claude</button></div>${body}</div>`}

function vChat(p){const msgs=chatMsgs();const busy=S.thinking.chat;const C=CHAT[S.stage];const v=curVideo(p);
  let about=STG[S.stage];if(S.stage==="script"){const vs=vers(v);const k=vs.findIndex(d=>d.id===v.cur)+1;about+=` · ${v.title}${k?` · דראפט ${k}`:""}`}

  <div class="ctxs">${CL}<span>מדברים על: ${esc(about)}</span></div>
  <div class="msgs">${msgs.map((m,i)=>{
    if(m.role==="user")return `<div class="msg me">${m.author&&m.author!==me?`<span class="by">${esc(m.author)}</span>`:""}${esc(m.text)}</div>`;
    let ap="";
    if(m.rows&&m.rows.length){const d=m.ver&&S.drafts.find(x=>x.id===m.ver);const k=d?vers(v).indexOf(d)+1:0;ap=d?`<div class="ap"><span>נשמר כדראפט ${k}</span><button class="bsm2" data-ver="${esc(d.id)}" data-tochk>${v.cur===d.id?"לתסריט":"לפתוח"}</button></div>`:`<div class="ap"><span>הצעה לתסריט (${m.rows.length} שורות)</span><button class="bsm2" data-showprop="${i}">לשמור כדראפט חדש</button></div>`}
    if(m.apply&&!m.applied)ap+=`<div class="ap"><button class="bsm2" data-applychat="${i}">להחיל כדראפט חדש</button></div>`;else if(m.applied)ap+=`<div class="ap"><span>✓ יושם בדראפט חדש</span></div>`;
    if(m.brief)ap+=`<div class="ap"><button class="bsm2" data-usebrief="${i}">להחליף את הבריף המחודד</button></div>`;
    if(m.concept)ap+=`<div class="ap"><button class="bsm2" data-useconcept="${i}">להשתמש כקונספט</button></div>`;
    return `<div class="msg cl"><span class="by">${CL}Claude</span>${esc(m.text)}${ap}</div>`}).join("")||`<div class="hint" style="padding:4px">${C.empty}</div>`}
    ${busy?`<div class="typing">${CL}Claude כותב…</div>`:""}</div>
  ${!busy?`<div class="chips">${C.chips.map(c=>`<button data-chip="${esc(c)}">${esc(c)}</button>`).join("")}</div>`:""}
