<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>לילה טוב</title><link rel="manifest" href="manifest.webmanifest?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="לילה טוב"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-180.png?v=1"><link rel="icon" type="image/png" href="icons/icon-192.png?v=1">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --blue:#06B3E5;--navy:#00203F;--fuchsia:#FA1664;--gold:#F6D58A;
  --bg:#13284A;--fg:#EEF2F7;--muted:#9FB2C9;--chip:rgba(255,255,255,.08);--chipfg:#DCE5EF;--line:rgba(255,255,255,.08);--title:#FFFFFF;
  --surface:#183158;--sel-bg:#06B3E5;--sel-fg:#fff;--good:#3CCB97;--warn:#F2B53A;--bad:#FA6C93;--empty:rgba(255,255,255,.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);font-family:Heebo,system-ui,sans-serif;touch-action:manipulation;transition:background .3s,color .3s}
body{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#view{max-width:520px;margin:0 auto;padding:22px 20px calc(110px + env(safe-area-inset-bottom))}
#view.home{padding:0 0 calc(94px + env(safe-area-inset-bottom))}
.hero{position:relative;height:470px;overflow:hidden}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-top{position:absolute;top:calc(22px + env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start;z-index:2}
.hello{font-size:30px;font-weight:800;line-height:1.1;color:#fff;text-shadow:0 2px 14px rgba(0,10,30,.25)}
[data-theme=light] .hello{color:#0F2547;text-shadow:none}
.date{font-size:14px;margin-top:6px;color:rgba(255,255,255,.85);font-weight:500}
[data-theme=light] .date{color:#2C4468}
.glass{background:rgba(255,255,255,.2)!important;color:#fff!important;border:1px solid rgba(255,255,255,.28)}
[data-theme=light] .rbtn.glass{background:rgba(255,255,255,.55)!important;color:#0F2547!important}
.scene .tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.9}50%{opacity:.15}}
.scene .shoot{opacity:0;animation:shoot 11s linear infinite 3s}
@keyframes shoot{0%,90%{opacity:0;transform:translate(0,0)}91%{opacity:1}96%{opacity:0;transform:translate(-150px,48px)}100%{opacity:0}}
.scene .drift{animation:drift 26s ease-in-out infinite alternate}.scene .drift2{animation:drift 34s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-24px)}to{transform:translateX(24px)}}
.scene .cloud{animation:cloud 80s linear infinite}
@keyframes cloud{from{transform:translateX(-90px)}to{transform:translateX(120px)}}
.scene .bird{animation:bird 40s linear infinite}
@keyframes bird{from{transform:translate(-220px,20px)}to{transform:translate(260px,-30px)}}
.scene .flap{transform-box:fill-box;transform-origin:center;animation:flap .9s ease-in-out infinite}
@keyframes flap{50%{transform:scaleY(.4)}}
.scene .shim{transform-box:fill-box;transform-origin:center;animation:shim 2.6s ease-in-out infinite}
@keyframes shim{0%,100%{opacity:.15;transform:scaleX(.6)}50%{opacity:.75;transform:scaleX(1.15)}}
.scene .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .5s ease-in-out infinite alternate}
.scene .f2{animation-duration:.37s}
@keyframes flame{from{transform:scale(.88,.92) skewX(-3deg)}to{transform:scale(1.08,1.12) skewX(3deg)}}
.scene .fireglow{transform-box:fill-box;transform-origin:center;animation:fglow 1.8s ease-in-out infinite}
@keyframes fglow{50%{opacity:.6;transform:scale(.9)}}
.scene .glowt{animation:fglow 2.4s ease-in-out infinite}
.scene .spark{animation:spark 3.5s ease-out infinite;opacity:0}
@keyframes spark{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(6px,-38px)}}
.scene .ffly{animation:ffly 7s ease-in-out infinite}
@keyframes ffly{0%,100%{opacity:.1;transform:translate(0,0)}30%{opacity:1}50%{transform:translate(10px,-8px)}70%{opacity:.8;transform:translate(-6px,-14px)}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}}
.talk{position:absolute;left:0;right:0;top:150px;display:flex;flex-direction:column;align-items:center;z-index:2}
.talk .orb{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.34),rgba(255,255,255,.14) 70%);border:1px solid rgba(255,255,255,.45);box-shadow:0 10px 40px rgba(0,15,40,.35),inset 0 0 30px rgba(255,255,255,.12);position:relative}
.talk .orb::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(255,255,255,.22);animation:ring 3.2s ease-in-out infinite}
@keyframes ring{0%,100%{transform:scale(.96);opacity:.7}50%{transform:scale(1.06);opacity:.15}}
.talk .orb svg{width:40px;height:40px;fill:#fff}
.talk .l1{margin-top:14px;font-size:18px;font-weight:700;color:#fff;text-shadow:0 2px 12px rgba(0,10,30,.35)}
.talk .row{display:flex;gap:8px;margin-top:12px}
.talk .pill{height:40px;padding:0 16px;font-size:14px}
.body{position:relative;margin-top:-30px;background:var(--bg);border-radius:30px 30px 0 0;padding:6px 20px 0;z-index:3}
.stagechip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:var(--chip);color:var(--chipfg);font-size:13px;font-weight:600;cursor:pointer}
.stagechip b{color:var(--gold)}
.hint{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.6}
.hint b{color:var(--gold);font-weight:600}
.lastline{font-size:15px;line-height:1.7;color:var(--fg)}
.lastline .lk{color:var(--blue);font-weight:600;font-size:14px;margin-inline-start:6px}
.ttl{font-weight:800;font-size:24px;color:#fff;margin:6px 0 4px}
.tabbar{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));margin:0 auto;width:calc(100% - 32px);max-width:488px;z-index:40;display:flex;justify-content:center;background:#24426E;border-radius:32px;padding:10px 0 8px;box-shadow:0 12px 32px rgba(0,8,25,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.tabbar .in{width:100%;max-width:520px;display:flex;justify-content:space-around}

.tabbar button{width:90px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#9DB0C9;font-size:11.5px;font-weight:600}
.tabbar button svg{width:24px;height:24px}
.tabbar button i{display:none}
.tabbar button.on{color:var(--gold)}
.tabbar button.on i{background:transparent}
.nrow2{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.nrow2 span:last-child{color:var(--muted);font-size:13px;text-align:end}
.topbar{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:8px}
.topbar .title{font-weight:800;font-size:22px;color:var(--title)}
.topbar .sub{font-size:13px;color:var(--muted);font-weight:500}
.rbtn{width:36px;height:36px;border-radius:50%;background:var(--chip);color:var(--chipfg);display:grid;place-items:center;flex:none}
.rbtn svg{width:17px;height:17px}
.sec{font-size:13px;font-weight:600;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:7px}
.sec::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.sec .more{margin-inline-start:auto;color:var(--gold);font-weight:600;font-size:13px}
/* orb */
.orbwrap{display:flex;flex-direction:column;align-items:center;margin:18px 0 4px}
.orb{width:156px;height:156px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7FE0FA,var(--blue) 45%,#035A7A);box-shadow:0 0 60px rgba(6,179,229,.4);display:grid;place-items:center;text-decoration:none}
.orb svg{width:44px;height:44px;fill:#fff}
.orb-l1{margin-top:16px;font-size:17px;font-weight:700;color:var(--title)}
.orb-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.pill{height:44px;padding:0 18px;border-radius:999px;background:var(--chip);color:var(--chipfg);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pill.blue{background:var(--blue);color:#fff}
.pill[disabled]{opacity:.5}
/* stage */
.stage{font-size:15px;font-weight:500;cursor:pointer}
.stagebar{display:flex;gap:5px;margin-top:9px;cursor:pointer}
.stagebar i{flex:1;height:6px;border-radius:3px;background:var(--empty)}
.stagebar i.on{background:var(--blue)}
.tonight{font-size:15px;line-height:1.7}
.tonight small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
/* trends */
.trend{display:flex;justify-content:space-between;align-items:center;min-height:44px;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.trend:last-child{border-bottom:0}
.st{font-size:13px;font-weight:600;white-space:nowrap}
.st.good{color:var(--good)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}.st.none{color:var(--muted)}
.wide{width:100%;height:46px;border-radius:999px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;margin-top:22px;display:flex;align-items:center;justify-content:center}
.wide{background:var(--blue)!important}
.wide.soft{background:var(--chip);color:var(--chipfg)}
.empty{color:var(--muted);font-size:14px;line-height:1.6}
/* night form */
.q{font-size:14px;font-weight:600;margin:16px 0 8px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{height:38px;padding:0 15px;border-radius:999px;background:var(--chip);color:var(--chipfg);font-size:14px;font-weight:500;display:inline-flex;align-items:center}
.chip.on{background:var(--blue);color:#fff}
.prose{font-size:15px;line-height:1.75}
.prose b{font-weight:700;color:var(--title)}
textarea.note{width:100%;min-height:70px;border-radius:16px;border:0;background:var(--chip);color:var(--fg);font:inherit;font-size:15px;padding:12px 14px;resize:none;outline:none}
/* week */
.wm{padding:12px 0;border-bottom:1px solid var(--line)}
.wm:last-child{border-bottom:0}
.wm .row1{display:flex;justify-content:space-between;align-items:center}
.wm .nm{font-size:15px;font-weight:500}
.dots{display:flex;gap:5px;margin-top:9px}
.dots span{flex:1;max-width:38px;height:8px;border-radius:4px;background:var(--empty)}
.dots .g{background:var(--good)}.dots .y{background:var(--warn)}.dots .r{background:var(--bad)}
.days{display:flex;gap:5px;margin-top:4px}
.days span{flex:1;max-width:38px;font-size:10px;color:var(--muted);text-align:center}
/* sheet */
#sheetHost .scrim{position:fixed;inset:0;background:rgb(0 16 32 / .45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
#sheetHost .sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--surface);color:var(--fg);border-radius:26px 26px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom))}
.msgs{display:flex;flex-direction:column;gap:10px;margin:14px 0;max-height:52vh;overflow:auto}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.6;white-space:pre-wrap}
.msg.me{align-self:flex-start;background:var(--blue);color:#fff}
.msg.her{align-self:flex-end;background:var(--chip);color:var(--fg)}
.msg .go{display:inline-flex;margin-top:8px;height:34px;padding:0 14px;border-radius:999px;background:var(--blue);color:#fff;font-weight:600;font-size:13px;align-items:center}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea{flex:1;height:44px;max-height:120px;border-radius:22px;border:0;background:var(--chip);color:var(--fg);font:inherit;font-size:15px;padding:10px 16px;resize:none;outline:none;line-height:24px}
.send{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.send svg{width:18px;height:18px}
.slist{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.srow{height:48px;border-radius:14px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:var(--chip);color:var(--chipfg);font-size:15px;font-weight:500}
.srow.on{background:var(--blue);color:#fff}
.thinking{color:var(--muted);font-size:14px}
.nrow{padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.6;cursor:pointer}
.nrow:last-of-type{border-bottom:0}
.nrow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.actions{margin-top:16px}
.btn{display:flex;align-items:center;font-weight:600}
.btn.danger{color:var(--bad)}
.facts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.fact{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:14px;background:var(--chip);color:var(--fg);font-size:15px;line-height:1.55;text-align:start}
.fact i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);margin-top:2px;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff}
.fact.on i{background:var(--blue);border-color:var(--blue)}
.toast button{margin-inline-start:12px;font-weight:700;color:#00203F;text-decoration:underline}
/* toast */
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));background:#FFF4C2;color:#2F2F2F;font-size:14px;font-weight:500;padding:9px 18px;border-radius:999px;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

#view.home{display:flex;flex-direction:column;min-height:100vh;min-height:100svh}
#view.home .hero{flex:1;height:auto;min-height:440px}
.hero svg.scene2{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-top{display:block;text-align:center}
.talk{top:auto!important;bottom:52px}
.body{padding-bottom:6px}
.lnk{display:flex;align-items:center;gap:12px;width:100%;text-align:start;font-size:15px;line-height:1.65;color:var(--fg)}
.lnk span{flex:1}.lnk .cv{width:18px;height:18px;flex:none;color:var(--muted)}
#view.eve{padding:0 0 calc(96px + env(safe-area-inset-bottom))}
.ehero{position:relative;height:200px;overflow:hidden}.ehero svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ehero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(rgba(19,40,74,0),rgba(19,40,74,.55) 55%,var(--bg));z-index:3;pointer-events:none}.ehero{margin-bottom:10px}
.ehero .rbtn.lt{background:rgba(255,255,255,.55)!important}.ehero .rbtn{position:absolute;top:calc(18px + env(safe-area-inset-top));right:18px;z-index:2}
.ettl{position:absolute;top:calc(20px + env(safe-area-inset-top));right:66px;font-size:24px;font-weight:800;color:#fff;z-index:2;text-shadow:0 2px 12px rgba(0,10,30,.35)}
.ebody{max-width:520px;margin:-18px auto 0;padding:0 20px;position:relative;z-index:2}
.wcards{display:flex;align-items:stretch;gap:10px;margin:0 0 22px}.wcard{flex:1;text-align:start;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.06);color:var(--title)}.wcard small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}.wcard b{display:block;font-size:17px;margin-top:2px}.wcard.me{box-shadow:inset 0 0 0 1.5px var(--gold)}.wcard.me small{color:var(--gold)}
.wswap{align-self:center;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--gold);flex:none}.wswap svg{width:18px;height:18px}
.othrow{display:flex;width:100%;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line);margin-top:8px;color:var(--chipfg);font-size:15px;text-align:start}.othrow b{color:var(--title)}.othrow .cvd{width:18px;height:18px;transition:transform .3s}.othrow.open{margin-bottom:12px}.othrow.open .cvd{transform:rotate(180deg)}
.chrow{display:flex;width:100%;justify-content:space-between;align-items:center;padding:14px 18px;margin:18px 0 8px;border-radius:999px;background:rgba(255,255,255,.07);font-size:15px;color:var(--title);font-weight:600}.chrow small{color:var(--muted);font-weight:500;margin-inline-start:6px}.chrow svg{width:18px;height:18px;color:var(--gold)}
.stp{position:relative;padding-inline-start:26px;margin:0 0 14px;line-height:1.55;font-size:15px}
.stp::before{content:"";position:absolute;inset-inline-start:4px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--empty);border:2px solid rgba(255,255,255,.35);box-sizing:border-box}
.stp.done::before{background:var(--gold);border-color:var(--gold)}
.stp.now::before{width:13px;height:13px;inset-inline-start:2px;top:5px;background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 5px rgb(246 213 138 / .2)}
.stp::after{content:"";position:absolute;inset-inline-start:8px;top:20px;bottom:-14px;width:1px;background:rgba(255,255,255,.15)}
.stp:last-of-type::after{display:none}
.stp b{display:block;font-weight:700;color:var(--title)}.stp b small{font-weight:500;color:var(--muted);margin-inline-start:8px;font-size:13px}
.stp span{color:var(--chipfg);opacity:.9}.stp.now b{color:var(--gold)}
.strip{position:sticky;top:10px;z-index:5;width:100%;height:52px;border-radius:26px;background:#1C3560;display:flex;align-items:center;gap:10px;padding:0 18px;font-size:14px;box-shadow:0 8px 20px rgb(0 8 25 / .35);margin:4px 0 6px}
.strip b{flex:1;text-align:start}.strip .dts{display:flex;gap:5px}.strip .dts i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.strip .dts i.d{background:var(--gold)}.strip .dts i.on{background:var(--gold);box-shadow:0 0 0 3px rgb(246 213 138 / .3)}.strip svg{width:18px;height:18px;color:var(--muted)}
.emsgs{max-height:none;overflow:visible;margin-bottom:0}
.emsgs .msg.her{background:rgba(255,255,255,.08)}
.news{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;margin-top:12px;font-size:13.5px;line-height:1.5;color:var(--chipfg)}
.news i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-top:7px}
.news span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.news b{color:var(--gold);font-weight:700}
.emsgs .msg.voice{align-self:stretch;max-width:100%;background:rgba(246,213,138,.1);border:1px solid rgba(246,213,138,.25);color:var(--fg)}
.tq{display:block;font-weight:700;color:var(--title);margin-bottom:2px}

.mrow{display:flex;align-items:baseline;gap:8px;width:100%;min-height:46px;padding:12px 0;border-bottom:1px solid var(--line);text-align:start;font-size:15px;color:var(--fg)}
.mrow b{flex:none;font-weight:700;color:var(--title);max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--chipfg);opacity:.85}
.mrow small{flex:none;color:var(--muted);font-size:12px}
.mall{display:flex;align-items:center;gap:4px;margin-top:10px;color:var(--gold);font-weight:600;font-size:14px}.mall .cv{width:15px;height:15px;color:var(--gold)}
.mlist{margin-top:8px}.mlist .mrow:last-child{border-bottom:0}
/* tab bar: narrow floating pill */
.tabbar{width:calc(100% - 64px)!important;max-width:340px!important;border-radius:999px!important;padding:7px 0 6px!important;bottom:calc(14px + env(safe-area-inset-bottom))!important}
.tabbar button{width:78px!important;gap:2px!important;font-size:11px!important}
.tabbar button svg{width:22px!important;height:22px!important}
/* no zoom while typing */
input,textarea,select{font-size:16px!important}
/* home: one screen, no scroll */
html.noscroll,html.noscroll body{overflow:hidden;height:100%;overscroll-behavior:none}
#view.home{height:100vh;height:100dvh;min-height:0!important;overflow:hidden}
#view.home .hero{min-height:330px!important}
/* evening: fixed header, own scroll area */
#view.eve{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0!important;overflow:hidden}
#view.eve .ehero{flex:none}
#view.eve .escroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

.tgh{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;text-align:start;color:var(--fg)}
.tgh .tic{width:36px;height:36px;flex:none}.tgh .tic svg{width:36px;height:36px;display:block}
.tgh b{flex:1;font-size:16px;font-weight:700}.tgh .tgc{font-size:12px;color:var(--muted)}.tgh .cv{width:18px;height:18px;color:var(--muted);flex:none;transition:transform .42s var(--ios-move,ease)}
.tg.open .tgh b{color:var(--gold)}.tg.open .tgh .cv{transform:rotate(180deg);color:var(--gold)}
.tgb{padding:0 48px 6px 0;animation:iosReveal .42s var(--ios-move,ease) both}.tgb .acc:last-child{border-bottom:0}.tgb .acct b{font-size:15px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.tgh:active{transform:none!important;background-color:rgb(127 140 160 / .12)!important;border-radius:10px}.nrow:active{background-color:rgb(127 140 160 / .12)}}

/* home – now / next */
.talk .l2{font-size:13px;color:rgba(255,255,255,.85);margin-top:3px;text-shadow:0 1px 8px rgba(0,10,30,.4)}
.hero.tight .talk .l2{font-size:12px;margin-top:1px}
.nowc{display:block;width:100%;text-align:start;margin-top:18px;color:var(--fg)}.nowc small{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--gold);margin-bottom:6px}
.nowc b{display:block;font-size:19px;line-height:1.35;color:var(--title)}.nowc span{display:block;font-size:14px;color:var(--muted);margin-top:4px;line-height:1.55}.nowc .wide{margin-top:14px}
.dayq{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px}.dayq span{font-size:13px;color:var(--muted);margin-left:4px}
.dayq button{height:32px;padding:0 11px;border-radius:999px;background:var(--chip);color:var(--chipfg);font-size:13px;font-weight:500}.dayq button.on{background:rgba(246,213,138,.16);color:var(--gold)}
.nextl{margin-top:16px;border-top:1px solid var(--line);padding-top:6px}.nextl small{display:block;font-size:12px;color:var(--muted);margin:6px 0 0}
.nextl .lnk{padding:9px 0;font-size:14px;line-height:1.5}.nextl .lnk{cursor:pointer}.nextl .lnk>span:first-child{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.nextl .lnk em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.nnews{display:flex;margin-top:14px}.nnews .hsep{display:none}
.nowc b,.nowc span{display:-webkit-box!important;-webkit-box-orient:vertical;overflow:hidden}.nowc b{-webkit-line-clamp:2}.nowc span{-webkit-line-clamp:2}.nextl .hic{width:18px;height:18px;color:var(--gold);flex:none}

function nScore(n){if(!n||n.part)return null;const P=nParts(n);if(P.length<2)return null;let w=0,t=0;P.forEach(p=>{w+=SW[p.k];t+=SW[p.k]*p.v});

/* ---------- notes ---------- */
function noteSheet(n){
  openSheet(`<h3>${n?"עדכון":"להוסיף משהו"}</h3><textarea class="note" id="ntext" style="margin-top:12px;min-height:110px">${esc(n?n.text:"")}</textarea>
  <div class="actions"><button class="btn" id="nsave">שמירה</button>${n?'<button class="btn danger" id="ndel">מחיקה</button>':""}<button class="btn ghost" data-close>ביטול</button></div>`);
  $("#sheetHost [data-close]").onclick=closeSheet;
  const ta=$("#ntext");setTimeout(()=>ta&&ta.focus(),350);
  $("#nsave").onclick=async()=>{const t=(ta.value||"").trim();if(!t)return;closeSheet();
    if(n){if(t!==n.text)await writeNote(n.id,{...n,text:t})}else await addNotes([t],"parents");};
  const d=$("#ndel");if(d)d.onclick=async()=>{
    if(!d.dataset.sure){d.dataset.sure=Date.now();d.textContent="בטוח? לחצו שוב כדי למחוק";return}if(Date.now()-d.dataset.sure<600)return;
    closeSheet();const keep={...n};await delNote(n.id);toast("נמחק",()=>writeNote(keep.id,keep));};
}
function noteDoc(id){return DB?DB.doc("notes/"+id):null}
async function writeNote(id,data){const rec={text:data.text,at:data.at||Date.now(),src:data.src||"parents"};if(UID&&!data.by)rec.by=UID;else if(data.by)rec.by=data.by;
  if(!DB){S.notes=[{id,...rec},...S.notes.filter(x=>x.id!==id)];render();return}
  try{await noteDoc(id).set(rec)}catch(e){toast(e&&e.code==="invalid_argument"?"אין הרשאה לשמור":"השמירה לא הצליחה")}}
async function addNotes(texts,src,quiet){let t=Date.now();const ids=[];for(const x of texts){const id="n"+t.toString(36)+Math.random().toString(36).slice(2,6);ids.push(id);await writeNote(id,{text:x,at:t++,src})}
  if(!quiet)toast(texts.length>1?"נשמרו "+texts.length+" עדכונים":"נשמר");return ids}
async function delNote(id){if(!DB){S.notes=S.notes.filter(x=>x.id!==id);render();return}try{await noteDoc(id).delete()}catch(_){toast("המחיקה לא הצליחה")}}
function factsSheet(summary,facts){
  const sel=facts.map(()=>true);
  const draw=()=>{openSheet(`<h3>סיכום השיחה</h3>${summary?`<p class="prose" style="margin-top:12px">${esc(summary)}</p>`:""}
    ${facts.length?`<div class="sec" style="margin-top:18px">לשמור ב"מה עוד חשוב לדעת"</div><div class="facts">${facts.map((f,i)=>`<button class="fact ${sel[i]?"on":""}" data-fi="${i}"><i>${sel[i]?"✓":""}</i><span>${esc(f)}</span></button>`).join("")}</div>`:""}
    <div class="actions">${facts.length?'<button class="btn" id="fsave">שמירה</button>':""}<button class="btn ghost" data-close>סגירה</button></div>`);
    $("#sheetHost [data-close]").onclick=closeSheet;
    document.querySelectorAll("[data-fi]").forEach(b=>b.onclick=()=>{sel[+b.dataset.fi]=!sel[+b.dataset.fi];draw()});
    const fs=$("#fsave");if(fs)fs.onclick=async()=>{const pick=facts.filter((_,i)=>sel[i]);closeSheet();if(pick.length)await addNotes(pick,"voice")};};
  draw();
}

function context(){
  const last=S.nights.slice(0,10).map(n=>({לילה:n.date,הירדמות:n.lat,יציאות:n.exits,הגעות_לחדר_ההורים:n.wakes,מי_הגיב:n.resp,בקבוקים:n.bottles,שלב:STAGES[n.stage??0],הערה:n.note||""}));
  return `# מי את
את יועצת שינה והורות חמה ומעשית שמלווה את רן (אבא) וטל (אמא) עם דריה (בת 5.5, ישנה טוב), נטע (בן כמעט 3) ונועם (תינוקת בת 7 חודשים, בעריסה בחדר ההורים). את כותבת בעברית מדוברת, קצר וברור, בלי כותרות ובלי רשימות ארוכות. פני לנטע בלשון זכר, לדריה ולנועם בלשון נקבה.

# המצב
נטע: עד גיל שנה וחצי-שנתיים נרדם על הידיים. היום צריך הורה צמוד כדי להירדם, יוצא הרבה מהמיטה, משחק במטבח הצעצוע בחדר, שותה שני בקבוקים לפני השינה. מאוד תלוי באבא ("רק אבא"), בוכה חזק כשמסרבים להרים אותו. בחודשים האחרונים קם כמה פעמים בלילה בבכי, מגיע לחדר ההורים, מעיר את נועם, לא מסכים שאמא תחזיר אותו ודורש שאבא יישב על הכיסא. טל עברה ניתוח ובתקופה שאחריו לא הרימה אותו.

# הגישה שנבחרה: "אמצע חם"
שיטת הכיסא בשלבים (צמוד למיטה, אמצע החדר, ליד הדלת, מחוץ לדלת, נרדם לבד), כל 2-3 לילות טובים מתקדמים שלב. בתוך זה יציאות קצרות של "רגע, אני בודק את נועם" וחזרה עם שבח כשהוא שוכב. יציאה מהמיטה או הגעה לחדר ההורים בלילה – החזרה שקטה ועניינית לחדר שלו, בלי לדבר, ובלילה אותה תמיכה של השלב הנוכחי ולא יותר. לוח מדבקות עם מטרה אחת. אמא נכנסת בהדרגה להשכבה ולתגובות בלילה, לפי לוח קבוע של מי משכיב, וזמן מיוחד יומי של נטע עם אמא. ההחלטה מי מגיב היא של ההורים, לא של נטע. הבקבוק עובר לתחילת השגרה, אחריו צחצוח שיניים, אין בקבוק במיטה, ובהמשך נפרדים ממנו. העיקרון: חם בתוכן, עקבי בגבול – מתקפים רגש ומנחמים, אבל לא משנים את הגבול בגלל בכי. החמרה בלילות 2-4 של שינוי צפויה. מסתכלים על ממוצע של כמה לילות, לא על לילה בודד. אם אחרי 7-10 לילות עקביים אין שיפור – מחמירים רק בנקודה התקועה. במצוקה קשה – יורדים חצי שלב, לא חוזרים להתחלה. נועם עוברת קודם למיטת תינוק, ולחדר הילדים רק כשנטע יציב.
את לא רופאה: נחירות קבועות, הפסקות נשימה, חום, כאב או חשד רפואי – לרופא/ת הילדים.

# עדכונים שההורים הוסיפו (מידע עדכני, גובר על מה שלמעלה)
${S.notes.slice(0,30).map(n=>"- ["+shortDate(n.at)+"] "+n.text).join("\n")||"אין עדיין."}

# איך היו הימים האחרונים (מה ההורים סימנו)
${(S.days||[]).slice(0,31).map(d=>"- "+d.date+": "+dayLineCtx(d)).join("\n")||"אין עדיין."}

# סיכומי החודשים הקודמים
${(S.months||[]).filter(m=>m.text).slice(0,6).map(m=>"- "+m.id+": "+m.text).join("\n")||"אין עדיין."}

# עצות שכבר נתת (שמרי על עקביות איתן)
${S.tips.slice(0,30).map(t=>"- "+t.q+": "+t.a).join("\n")||"אין עדיין."}

# עכשיו
השלב הנוכחי: ${STAGES[S.plan.stage]}.
הלילות האחרונים (החדש ראשון): ${JSON.stringify(last)}`;
}
const OPTS_TXT=QF.map(f=>`"${f.k}" (${f.nm}): אחד מ־${f.opts.map(o=>'"'+o+'"').join(", ")}`).join("\n");
const OUT=`
החזירי JSON בלבד, בצורה הזו:
{"reply": "התשובה שלך להורה", "night": null או {"lat":..,"exits":..,"wakes":..,"resp":..,"bottles":..,"note":"משפט קצר או ריק"}, "tonight": null או "מה עושים הערב, 1-2 משפטים", "day": null או {"t":"המשימה להיום, עד 8 מילים","d":"משפט-שניים: איך עושים"}, "facts": ["מידע חדש וקבוע שההורה סיפר ושכדאי לזכור, משפט קצר לכל פריט"], "tips": [{"topic":"אחד מ: bed (השכבה והירדמות), night (התעוררויות ומה שקורה בלילה), day (התנהגות ביום, גבולות, רגשות, אחים, גן, מסכים), bottle (בקבוקים), dad (מי משכיב, רק אבא/אמא), baby (נועם התינוקת), other","q":"הנושא, 2-6 מילים","a":"העצה המעשית שנתת, 1-3 משפטים, כך שגם ההורה השני יבין בלי לקרוא את השיחה"}]}
"day" רק אם ההורה ביקש משימה אחרת להיום או שהסכמתם על משימה חדשה ליום; אחרת null.
"tips" רק עצה מעשית ושימושית גם לימים הבאים שנתת בתשובה הזו (לא חיזוק כללי ולא עצה שכבר מופיעה ב"עצות שכבר נתת"), אחרת [].
"night" – כל פרט על ההשכבה או הלילה של נטע שכבר קרה בפועל (כולל הערב, גם אם הוא עוד לא נגמר – למשל כמה בקבוקים כבר שתה, כמה זמן לקח לו להירדם). מלאי רק שדות שנאמרו במפורש, כל השאר null, בלי לנחש. תוכנית או כוונה ("נעשה בקבוק אחד") אינן night. "facts" רק דברים חדשים שלא כתובים כבר בעדכונים, אחרת []. בכל שדה שלא ידוע שימי null. הערכים חייבים להיות בדיוק מהרשימה:
${OPTS_TXT}`;

async function askJSON(prompt){
  try{return await SAMPLE.json(prompt,{modelTier:"default",cache:false})}
  catch(e){if(e&&e.code==="not_granted"){SAMPLE=null;render();throw e}
    const r=await SAMPLE(prompt,{modelTier:"default",cache:false});const m=(r.text||"").match(/\{[\s\S]*\}/);if(!m)throw e;return JSON.parse(m[0])}
}
function cleanNight(n){if(!n||typeof n!=="object")return null;const o={};let any=false;
  FIELDS.forEach(f=>{if(f.opts.includes(n[f.k])){o[f.k]=n[f.k];any=true}});if(typeof n.note==="string"&&n.note.trim())o.note=n.note.trim();return any?o:null}

function chatSheet(){
  openSheet(`<h3>${S.projView==="evening"?"שיחות הערב":"לכתוב ליועצת"}</h3><div class="msgs" id="msgs"></div>
    <div class="inrow"><textarea id="cin" rows="1" aria-label="הודעה"></textarea><button class="send" id="csend" aria-label="שליחה">${SEND}</button></div>`);
  drawMsgs();
  const ta=$("#cin");ta.oninput=()=>{ta.style.height="44px";ta.style.height=Math.min(ta.scrollHeight,120)+"px"};

function eveBind(){const ta=$("#cin");if(!ta||ta.dataset.b)return;ta.dataset.b=1;
  ta.oninput=()=>{ta.style.height="44px";ta.style.height=Math.min(ta.scrollHeight,120)+"px"};$("#csend").onclick=sendChat;drawMsgs(true)}
function drawMsgs(first){const box=$("#msgs");if(!box)return;
  box.innerHTML=S.chat.map((m,i)=>m.who==="voice"?`<div class="msg voice"><em class="by">סיכום שיחה קולית${m.speaker||(m.by&&S.names[m.by])?" · "+esc(m.speaker||S.names[m.by]):""} · ${hm(m.at)}</em>${esc(m.text)}</div>`:`<div class="msg ${esc(m.who)}">${m.who==="me"&&m.by&&S.names[m.by]?`<em class="by">${esc(S.names[m.by])}</em>`:""}${esc(m.text)}</div>`).join("")+(S.thinking?`<div class="msg her thinking">כותבת…</div>`:"");
  box.querySelectorAll("[data-facts]").forEach(b=>b.onclick=async()=>{const m=S.chat[+b.dataset.facts];m.saved=true;drawMsgs();await addNotes(m.facts,"parents");if(DB&&m.id)try{await DB.doc("chat/"+m.id).update({saved:true})}catch(_){}});

function evOut(){const solo=whoNow().kids===whoNow().noam;return `

# עדכון התוכנית של הערב (רק כשצריך)
אם מה שסיכמתם בשיחה משנה את התוכנית של הערב (למשל "לא מסוגל לשלוש מקלחות" ← רק נועם במקלחת), הוסיפי ל-JSON גם:
"plan":{"track":"${solo?"solo":"kids או noam"}","steps":[{"t":"...","time":"...","d":"..."}]}
עם המסלול המלא המעודכן (כל השלבים, לא רק השינוי), ובתשובה אמרי בקצרה שעדכנת את המסלול. אם אין שינוי – אל תוסיפי plan.`}
function applyEvePlan(pl){const tr=["kids","noam","solo"].includes(pl.track)?pl.track:null;if(!tr||!eveReady())return;
  const st=cleanSteps(pl.steps);if(st.length<2)return;
  const e={...S.plan.evening};e[tr==="kids"?"steps":tr]=st;S.plan={...S.plan,evening:e};S.eveTab=tr==="solo"?null:tr;writePlan();
  if(S.projView==="evening"){const host=$("#sheetHost").innerHTML;render();if(host&&!$("#sheetHost").innerHTML){$("#sheetHost").innerHTML=host}const ta=$("#cin");if(ta){ta.oninput=()=>{ta.style.height="44px";ta.style.height=Math.min(ta.scrollHeight,120)+"px"};$("#csend").onclick=sendChat}drawMsgs()}}
async function sendChat(){
  const ta=$("#cin");const t=(ta.value||"").trim();if(!t||S.thinking)return;
  ta.value="";ta.style.height="44px";S.thinking=true;await putMsg({who:"me",text:t,at:Date.now(),by:UID||null});drawMsgs();
  const me=UID&&S.names[UID]?S.names[UID]:"";
  const hist=S.chat.slice(-14).map(m=>(m.who==="voice"?"[סיכום שיחה קולית] ":m.who==="me"?who(m)+" (הורה): ":"יועצת: ")+m.text).join("\n");
  const ev=S.projView==="evening"?"\n\n# ההורים שואלים על הערב הזה. "+whoLine()+"\nהתוכנית לדריה ונטע:\n"+evening().steps.map(x=>"- "+x.t+(x.time?" ("+x.time+")":"")+": "+x.d).join("\n")+"\nהתוכנית לנועם:\n"+evening().noam.map(x=>"- "+x.t+(x.time?" ("+x.time+")":"")+": "+x.d).join("\n")+(whoNow().kids===whoNow().noam?"\nהערב הורה אחד לבד עם שלושתם. התוכנית המשולבת:\n"+evening().solo.map(x=>"- "+x.t+(x.time?" ("+x.time+")":"")+": "+x.d).join("\n"):""):"";
  try{
    const r=await askJSON(context()+ev+"\n\n# השיחה של הערב (רן ואמא טל כותבים באותה שיחה; פני למי שכתב/ה את ההודעה האחרונה בשמו/ה כשזה טבעי). ההורה יכול לשאול, לעדכן מה קורה עכשיו, או סתם לפרוק תסכול – הגיבי בהתאם: חם, קצר ומעשי. על עדכון – אשרי בקצרה ותני את הצעד הבא; על תסכול – קודם הכרה ברגש, ואז כיוון אחד פשוט.\n"+hist+(me?"\nההודעה האחרונה נכתבה על ידי: "+me:"")+"\n"+OUT+(S.projView==="evening"?evOut():""));
    const night=cleanNight(r.night);
    const facts=Array.isArray(r.facts)?r.facts.filter(x=>typeof x==="string"&&x.trim()).map(x=>x.trim().slice(0,300)).slice(0,6):[];
    const tipsN=await saveTips(r.tips,"chat",UID&&S.names[UID]||null);
    S.thinking=false;
    await putMsg({who:"her",text:(typeof r.reply==="string"?r.reply:"").trim().slice(0,4000)||"…",at:Date.now()});
    autoSave(night,facts,tipsN,Date.now(),"parents");
    applyDay(r.day);
    if(S.projView==="evening"&&r.plan&&typeof r.plan==="object")applyEvePlan(r.plan);
    if(r.tonight&&typeof r.tonight==="string"){S.plan={...S.plan,tonight:r.tonight.trim().slice(0,600),tonightAt:Date.now()};writePlan();if(!S.projView)render()}
  }catch(e){S.thinking=false;S.chat.push({who:"her",at:Date.now(),text:e&&e.code==="rate_limited"?"רגע, יותר מדי הודעות. נסו שוב בעוד דקה.":"לא הצלחתי לענות כרגע. נסו שוב."})}
  S.thinking=false;drawMsgs();
}

function seenSt(){if(!S.seen){try{const v=JSON.parse(localStorage.getItem("gn-seen")||"null");S.seen=v&&typeof v==="object"&&Number.isFinite(+v.base)&&Array.isArray(v.ids)?{base:+v.base,ids:v.ids.filter(x=>typeof x==="string").slice(-500)}:null}catch(_){}if(!S.seen){S.seen={base:Date.now(),ids:[]};saveSeen()}}return S.seen}

function isNewTip(t){const st=seenSt(),me=UID&&S.names[UID];return t.at>st.base&&!st.ids.includes(t.id)&&!(me&&t.speaker===me)}
function newTips(){return (S.tips||[]).filter(isNewTip)}

function tipMeta(t){const w=t.speaker||(t.by&&S.names[t.by])||"";const k=t.src==="voice"?"משיחה קולית"+(w?" עם "+w:""):t.src==="ask"?"משאלה בכתב"+(w?" של "+w:""):"מהצ'אט של הערב"+(w?" עם "+w:"");return esc(shortDate(t.at)+" · "+k)}

/* ---------- save what came up in a conversation, with undo ---------- */
function nightDateFor(ts){const d=new Date(ts);if(d.getHours()<15)d.setDate(d.getDate()-1);return ymd(d)}
async function autoSave(night,facts,tipsN,ts,src){
  const parts=[],undo=[];
  if(night){const date=nightDateFor(ts),prev=S.nights.find(n=>n.date===date);
    const rec=sanNight({...(prev||{}),...night,date,stage:prev&&prev.stage!=null?prev.stage:S.plan.stage,at:Date.now()});
    const full=!!(rec.lat&&rec.wakes);if(prev&&!prev.part)delete rec.part;else if(full)delete rec.part;else rec.part=true;
    if(prev&&prev.note&&night.note&&!prev.note.includes(night.note))rec.note=prev.note+" · "+night.note;
    if(UID)rec.by=UID;
    if(DB){try{await DB.doc("nights/"+date).set(rec);parts.push("סיכום הלילה");
      undo.push(()=>prev?DB.doc("nights/"+date).set(prev):DB.doc("nights/"+date).delete())}catch(_){}}
    else{S.nights=[rec,...S.nights.filter(n=>n.date!==date)];parts.push("סיכום הלילה")}}
  if(facts&&facts.length){const ids=await addNotes(facts,src,true);parts.push("זיכרון");undo.push(()=>Promise.all(ids.map(id=>delNote(id))))}
  if(tipsN)parts.push(tipsN>1?tipsN+" עצות":"עצה");
  if(parts.length)toast("נשמר: "+parts.join(" · "),undo.length?()=>undo.forEach(f=>{try{f()}catch(_){}}):null);
}

async function pullVoice(found){

    if(!f){S.newConv=null;toast("אין שיחה קולית חדשה לסכם");return}

    const gp=f.gp||{};const tr=Array.isArray(gp.transcript)?gp.transcript:[];
    const text=tr.filter(m=>m&&m.message).map(m=>(m.role==="agent"?"יועצת: ":"הורה: ")+m.message).join("\n").slice(-20000);

# תמליל השיחה הקולית האחרונה
${text}

    const night=cleanNight(r.night);
    const facts=Array.isArray(r.facts)?r.facts.filter(x=>typeof x==="string"&&x.trim()).map(x=>x.trim().slice(0,300)).slice(0,8):[];
    const sp0=((gp.conversation_initiation_client_data||{}).dynamic_variables||{}).parent;const tipsN=await saveTips(r.tips,"voice",(sp0==="רן"||sp0==="טל")?sp0:null);

async function findFamConv(maxGets){const l=await MCP.callTool("ElevenLabs","agents_list_conversations",{context:"Find this family's newest voice conversation to summarize",agent_id:AGENT,page_size:10});
  const lp=l.payload||{};const list=(lp.conversations||lp.items||[]).filter(c=>c&&c.conversation_id);let gets=0;
  for(const c of list){const id=c.conversation_id;
    if((S.allChat||[]).some(m=>m.conv===id)||(S.doneConvs||[]).includes(id))continue;
    if(S.convOk[id]===false)continue;
    if(c.status&&c.status!=="done")continue;if(!((c.user_message_count||0)>0))continue;
    if(!S.famKey)return null;if(gets>=maxGets)return null;gets++;
    const g=await MCP.callTool("ElevenLabs","agents_get_conversation",{context:"Check the conversation belongs to this family before summarizing",conversation_id:id});
    const gp=g.payload||{};const dv=(gp.conversation_initiation_client_data||{}).dynamic_variables||{};
    if(dv.fk===S.famKey){S.convOk[id]=true;return {conv:c,gp}}S.convOk[id]=false}
  return null}

    const out={...mine};Object.keys(mine).forEach(k=>{if(JSON.stringify(mine[k]??null)===JSON.stringify(base[k]??null)&&k in latest)out[k]=latest[k]});
    if(out.stage!==mine.stage&&out.evening&&out.evening.stage!==out.stage)out.evening=null;
    await DB.doc("state/plan").set(out)}catch(e){toast(e&&e.code==="invalid_argument"?"אין הרשאה לשמור":"השמירה לא הצליחה")}}
